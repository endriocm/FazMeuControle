    }

    function renderCreditCard(card){
      const s = getCardStats(card);
      const tone = s.percent >= 95 ? "danger" : s.percent >= 80 ? "warn" : "";
      const visual = getCardVisual(card);
      return `
        <article class="credit-card" data-template="${escapeHtml(visual.templateId)}">
          <div class="credit-head" style="${cardVisualStyle(visual)}">
            <div class="credit-top">
              <div>
                <div class="credit-template">${escapeHtml(visual.templateLabel)}</div>
                <div class="credit-name">${escapeHtml(visual.name)}</div>
              <div class="credit-dates">Paga dia ${card.dueDay || "-"} • Fecha dia ${card.closingDay || "-"}<br>Melhor compra: dia ${calcBestDay(card)}</div>
              </div>
              <div class="credit-logo">${renderCardInstitutionMark(visual)}</div>
            </div>
            <div class="credit-number">•••• •••• •••• ••••</div>
            <div class="credit-bottom">
              <div class="credit-chip" aria-hidden="true"></div>
              <div class="credit-brand">
                ${renderBrandMark(visual.brand.id)}
                <span>${escapeHtml(visual.brand.label)}</span>
              </div>
            </div>
          </div>
          <div class="credit-body">
            <div class="metric-row"><span>Limite total</span><strong>${toBRL(card.limit)}</strong></div>
            <div class="metric-row"><span>Limite utilizado</span><strong>${toBRL(s.used)}</strong></div>
            <div class="metric-row"><span>Disponível</span><strong class="${s.available<0?"negative":"positive"}">${toBRL(s.available)}</strong></div>
            <div class="progress ${tone}"><span style="width:${Math.min(100,s.percent)}%"></span></div>
            <div class="metric-row"><span>Fatura atual</span><strong>${toBRL(s.invoice)}</strong></div>
            <div class="metric-row"><span>Parcelas futuras</span><strong>${toBRL(s.future)}</strong></div>
            <div class="metric-row"><span>Uso do limite</span><strong>${s.percent.toFixed(1)}%</strong></div>
            ${s.percent >= 95 ? `<div class="alert-line">⚠ Uso acima de 95% do limite.</div>` : s.percent >= 80 ? `<div class="alert-line">Atenção: uso acima de 80%.</div>` : ""}
            <div class="item-actions" style="margin-top:12px">
              <button class="btn dark small" data-action="open-card" data-id="${card.id}">Abrir lançamentos</button>
              <button class="btn soft small" data-action="edit-card" data-id="${card.id}">Editar</button>
              <button class="btn red small" data-action="delete-card" data-id="${card.id}">Excluir</button>
            </div>
          </div>
        </article>
      `;
    }

    function calcBestDay(card){
      return card.bestDay || (((Number(card.closingDay)||1) % 31) + 1);
    }

    function groupTotals(rows, keyFn){
      return rows.reduce((acc, row) => {
        const key = keyFn(row);
        acc[key] = round((acc[key] || 0) + number(row.displayValue ?? row.value));
        return acc;
      }, {});
    }

    function topGroup(totals, fallback = "-"){
      const entries = Object.entries(totals).sort((a,b) => b[1] - a[1]);
      return entries[0] || [fallback, 0];
    }

    function getAnalysisExpenseRows(monthIndex = state.month, planningYear = state.year){
      let rows = getExpenseDetailRowsForMonth(monthIndex, planningYear);
      if(state.analysis.category !== "all") rows = rows.filter(row => row.category === state.analysis.category);
      if(state.analysis.subcategory !== "all") rows = rows.filter(row => matchesSubcategoryValue(row, state.analysis.subcategory));
      if(state.analysis.card !== "all") rows = rows.filter(row => row.cardId === state.analysis.card);
      return rows;
    }

    function renderSubcategorySummary(){
      const rows = getAnalysisExpenseRows();
      const total = round(rows.reduce((sum, row) => sum + number(row.displayValue ?? row.value), 0));
      const [topSubcategory, topSubcategoryValue] = topGroup(groupTotals(rows, row => subcategoryLabel(row)));
      const [topCategory, topCategoryValue] = topGroup(groupTotals(rows, row => row.category || "Sem categoria"));
      return `
        <div class="mini-stat-grid" style="margin-bottom:14px">
          <div class="mini-stat"><small>Gasto filtrado</small><strong>${toBRL(total)}</strong></div>
          <div class="mini-stat"><small>Subcategoria principal</small><strong>${escapeHtml(topSubcategory)}</strong><span>${toBRL(topSubcategoryValue)}</span></div>
          <div class="mini-stat"><small>Categoria principal</small><strong>${escapeHtml(topCategory)}</strong><span>${toBRL(topCategoryValue)}</span></div>
          <div class="mini-stat"><small>Lançamentos</small><strong>${rows.length}</strong><span>despesas e compras</span></div>
        </div>
      `;
    }

    function renderLegacyAnalyticsPage(){
      return `
        <section class="page">
          <div class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Análises</h2>
                <p class="panel-subtitle">Gráficos atualizados automaticamente conforme os lançamentos mudam.</p>
              </div>
            </div>
            <div class="panel-body">
              <div class="filterbar">
                <select class="select" data-analysis="chartType">
                  <option value="doughnut" ${state.analysis.chartType==="doughnut"?"selected":""}>Pizza / Doughnut</option>
                  <option value="bar" ${state.analysis.chartType==="bar"?"selected":""}>Colunas</option>
                  <option value="line" ${state.analysis.chartType==="line"?"selected":""}>Linha</option>
                </select>
                <select class="select" data-analysis="category">
                  <option value="all">Todas as categorias</option>
                  ${data.categories.map(c=>`<option value="${escapeHtml(c.name)}" ${state.analysis.category===c.name?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}
                </select>
                <select class="select" data-analysis="subcategory">
                  ${subcategoryFilterOptions(state.analysis.subcategory)}
                </select>
                <select class="select" data-analysis="card">
                  <option value="all">Todos os cartões</option>
                  ${data.cards.map(c=>`<option value="${c.id}" ${state.analysis.card===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("")}
                </select>
              </div>
              ${renderSubcategorySummary()}
              <div class="chart-grid">
                <div class="chart-card"><h3>1. Despesas por categoria</h3><canvas id="expenseCategoryChart"></canvas></div>
                <div class="chart-card"><h3>2. Despesas por subcategoria</h3><canvas id="expenseSubcategoryChart"></canvas></div>
                <div class="chart-card"><h3>2. Entradas x Saídas</h3><canvas id="flowChart"></canvas></div>
                <div class="chart-card"><h3>3. Evolução do saldo mês a mês</h3><canvas id="balanceChart"></canvas></div>
                <div class="chart-card"><h3>4. Limite utilizado x disponível</h3><canvas id="cardLimitChart"></canvas></div>
                <div class="chart-card"><h3>5. Status das saídas</h3><canvas id="expenseStatusChart"></canvas></div>
                <div class="chart-card"><h3>6. Recebimentos</h3><canvas id="entryStatusChart"></canvas></div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    function reportMonthLabel(monthKey){
      const [year, month] = String(monthKey || "").split("-").map(Number);
      return month && year ? `${MONTHS[month - 1]}/${String(year).slice(-2)}` : "mês anterior";
    }

    function renderReportChange(change){
      const difference = number(change.differenceMinor);
      const comparisonText = difference === 0
        ? "Sem variação em relação ao mês anterior."
        : `${toBRL(Math.abs(difference) / 100)} ${difference > 0 ? "acima" : "abaixo"} do mês anterior.`;
      return `
        <article class="report-change-card">
          <small>${escapeHtml(change.title)}</small>
          <strong>${toBRL(change.currentMinor / 100)}</strong>
          <span>${comparisonText}</span>
        </article>
      `;
    }

    function renderAnalyticsPage(){
      const report = buildNarrativeReport(data, getMonthKey());
      const comparison = report.comparison;
      const difference = comparison.differenceMinor;
      return `
        <section class="page report-narrative">
          <section class="panel report-hero">
            <span class="report-eyebrow">Relatório de ${financeOsMonthName()} de ${state.year}</span>
            <h2 class="report-title">${escapeHtml(report.headline)}</h2>
            <p class="report-lead">Neste mês, o consumo foi ${difference === 0 ? "igual ao" : `${toBRL(Math.abs(difference) / 100)} ${difference > 0 ? "maior que o" : "menor que o"}`} mês anterior. A leitura considera gastos à vista e cada parcela do cartão no mês em que ela pertence, sem contar o pagamento da fatura como um novo gasto.</p>
            <div class="report-comparison" aria-label="Comparação de consumo">
              <div><small>Consumo neste mês</small><strong>${toBRL(comparison.consumptionMinor / 100)}</strong></div>
              <div><small>${reportMonthLabel(comparison.previousMonthKey)}</small><strong>${toBRL(comparison.previousConsumptionMinor / 100)}</strong></div>
              <div><small>Média móvel de 3 meses</small><strong>${toBRL(comparison.movingAverage3MonthsMinor / 100)}</strong></div>
            </div>
          </section>

          <section class="panel report-section">
            <div class="finance-os-head"><div><h2>Três mudanças principais</h2><p>O que mais variou em comparação com o mês anterior.</p></div></div>
            <div class="report-change-grid">${report.changes.map(renderReportChange).join("")}</div>
          </section>

          <section class="panel report-section">
            <div class="finance-os-head"><div><h2>Onde o dinheiro foi consumido</h2><p>Gastos à vista, compras e parcelas do cartão, líquidos de reembolsos.</p></div></div>
            ${report.categories.length ? `
              <div class="report-category-list">
                ${report.categories.map(category => `
                  <div class="report-category-row">
                    <div><strong>${escapeHtml(category.categoryName)}</strong><br><small>${Math.round(category.share * 100)}% do consumo</small></div>
                    <div class="report-category-track" aria-label="${Math.round(category.share * 100)} por cento"><span style="width:${Math.max(0, Math.min(100, category.share * 100))}%"></span></div>
                    <strong>${toBRL(category.amountMinor / 100)}</strong>
                  </div>
                `).join("")}
              </div>
            ` : `<div class="empty">Ainda não há gastos neste mês para narrar.</div>`}
          </section>
        </section>
      `;
    }

    function formatInvestmentPercent(value){
      if(!Number.isFinite(value)) return "—";
      const sign = value > 0 ? "+" : "";
      return `${sign}${new Intl.NumberFormat("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2}).format(value)}%`;
    }
    function investmentResultTone(value){ return number(value) < 0 ? "investment-negative" : "investment-positive"; }
    function investmentTypeOptions(selected = "Outro"){ return INVESTMENT_TYPES.map(type => `<option value="${escapeHtml(type)}" ${type===selected?"selected":""}>${escapeHtml(type)}</option>`).join(""); }
    function investmentIndexerOptions(selected = "Outro"){ return INVESTMENT_INDEXERS.map(indexer => `<option value="${escapeHtml(indexer)}" ${indexer===selected?"selected":""}>${escapeHtml(indexer)}</option>`).join(""); }
    function investmentRiskOptions(selected = "Não informado"){ return INVESTMENT_RISKS.map(risk => `<option value="${escapeHtml(risk)}" ${risk===selected?"selected":""}>${escapeHtml(risk)}</option>`).join(""); }

    function renderInvestmentPositionCard(position){
      const summary = summarizeInvestmentPosition(position);
      const resultLabel = summary.gainMinor < 0 ? "Prejuízo acumulado" : "Rendimento acumulado";
      const issuer = summary.issuer ? `Emissor: ${escapeHtml(summary.issuer)}.` : "Emissor não informado.";
      const maturity = summary.maturityDate ? ` Vencimento em ${formatDate(summary.maturityDate)}.` : "";
      const rate = summary.annualRate ? `${new Intl.NumberFormat("pt-BR", {maximumFractionDigits:2}).format(summary.annualRate)}% a.a. informados` : "Taxa não informada";
      return `
        <article class="investment-position-card">
          <div class="investment-position-head"><div><span class="investment-kicker">${escapeHtml(summary.type)}</span><h3>${escapeHtml(summary.name)}</h3></div><span class="investment-pill">${escapeHtml(summary.indexer)}</span></div>
          <p>${issuer}${maturity} ${escapeHtml(rate)}.</p>
          <div class="investment-position-values">
            <div class="investment-value"><small>Aportes</small><strong>${toBRL(summary.contributedMinor / 100)}</strong></div>
            <div class="investment-value"><small>Saldo hoje</small><strong>${toBRL(summary.currentMinor / 100)}</strong></div>
            <div class="investment-value"><small>${resultLabel}</small><strong class="${investmentResultTone(summary.gainMinor)}">${toBRL(summary.gainMinor / 100)}</strong></div>
            <div class="investment-value"><small>Rentabilidade</small><strong class="${investmentResultTone(summary.gainMinor)}">${formatInvestmentPercent(summary.returnPercent)}</strong></div>
          </div>
          <p>Última atualização: ${summary.lastUpdatedAt ? formatDate(summary.lastUpdatedAt) : "não registrada"} · Risco: ${escapeHtml(summary.risk)}${summary.liquidity ? ` · Liquidez: ${escapeHtml(summary.liquidity)}` : ""}.</p>
          <div class="investment-card-actions">
            <button class="btn primary small" data-action="update-investment" data-id="${escapeHtml(summary.id)}">Atualizar saldo</button>
            <button class="btn soft small" data-action="view-investment-history" data-id="${escapeHtml(summary.id)}">Ver histórico</button>
            <button class="btn ghost small" data-action="edit-investment" data-id="${escapeHtml(summary.id)}">Editar</button>
            <button class="btn red small" data-action="delete-investment" data-id="${escapeHtml(summary.id)}">Excluir</button>
          </div>
        </article>`;
    }

    function investmentEventLabel(type){
      if(type === "contribution") return "Aporte registrado";
      if(type === "withdrawal") return "Resgate registrado";
      return "Saldo atualizado";
    }
    function renderInvestmentEvent(event){
      const amountLabel = event.type === "contribution" ? `+ ${toBRL(event.amountMinor / 100)}` : event.type === "withdrawal" ? `− ${toBRL(event.amountMinor / 100)}` : toBRL((event.balanceMinor || 0) / 100);
      const balanceLabel = Number.isSafeInteger(event.balanceMinor) ? `Saldo após o registro: ${toBRL(event.balanceMinor / 100)}.` : "Saldo não informado.";
      return `<div class="investment-event" data-type="${event.type}"><span class="investment-event-dot" aria-hidden="true"></span><div><strong>${investmentEventLabel(event.type)} · ${escapeHtml(event.positionName)}</strong><small>${formatDate(event.date)} · ${balanceLabel}${event.note ? ` ${escapeHtml(event.note)}` : ""}</small></div><span class="investment-event-value">${amountLabel}</span></div>`;
    }

      state.investmentChartScenarioIds = selectedIds.length === availableIds.length ? [] : selectedIds;
      return state.investmentChartScenarioIds;
    }

    }

      if(selected) state.investmentComparisonId = selected.id;

    function toggleFixedIncomeChartScenario(scenarioId){

      if(!availableIds.includes(scenarioId)) return;
      const selectedIds = fixedIncomeChartFilterIds(comparison);

        state.investmentChartScenarioIds = [scenarioId];

        if(selectedIds.length === 1){

          return;

        state.investmentChartScenarioIds = selectedIds.filter(id => id !== scenarioId);
      }else{
        state.investmentChartScenarioIds = availableIds.filter(id => selectedIds.includes(id) || id === scenarioId);
      }
      if(!state.investmentChartScenarioIds.includes(state.investmentComparisonId)) state.investmentComparisonId = state.investmentChartScenarioIds[0];
      render();

      const capitalPercent=(scenario.contributedMinor/totalMinor)*100;

    function normalizeMarketSymbolInput(value){
      let symbol = String(value || "").trim().toUpperCase();
      const indexer = marketIndexerFromSymbol(symbol);
      if(indexer) return indexer.symbol;
      if(symbol.endsWith(".SA")) symbol = symbol.slice(0,-3);
      return /^[A-Z0-9^=.-]{1,20}$/u.test(symbol) ? symbol : "";
    }

    function normalizeMarketIndexerLookup(value){
      return String(value || "").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/gu,"").replace(/[^A-Z0-9^]/gu,"");
    }

    function marketIndexerFromSymbol(value){
      const normalized = normalizeMarketIndexerLookup(value);
      return MARKET_INDEXERS.find(indexer => indexer.symbol===normalized || indexer.aliases.includes(normalized)) || null;
    }

    function marketIndexerSuggestions(query){
      const normalized = normalizeMarketIndexerLookup(query).replace(/^\^/u,"");
      if(!normalized) return [];
      return MARKET_INDEXERS.filter(indexer => [indexer.displaySymbol,indexer.name,indexer.symbol,...indexer.aliases].some(value => normalizeMarketIndexerLookup(value).replace(/^\^/u,"").includes(normalized))).map(indexer => ({symbol:indexer.symbol,displaySymbol:indexer.displaySymbol,name:indexer.name,type:"Índice"}));
    }

    function marketSymbolDisplayLabel(value){
      const indexer = marketIndexerFromSymbol(value);
      return indexer ? `${indexer.displaySymbol} · ${indexer.name}` : String(value || "");
    }

    function marketBenchmarkFromValue(value){
      const normalized = normalizeMarketIndexerLookup(value);
      return MARKET_BENCHMARKS.find(benchmark => normalizeMarketIndexerLookup(benchmark.id)===normalized || benchmark.aliases.some(alias=>normalizeMarketIndexerLookup(alias)===normalized)) || null;
    }

    function selectedMarketBenchmark(){
      return marketBenchmarkFromValue(state.marketComparison.benchmark) || MARKET_BENCHMARKS[0];
    }

    function marketSymbolCollection(target="comparison"){
      return target === "basket" ? state.marketComparison.basketSymbols : state.marketComparison.comparisonSymbols;
    }

    function marketRequestedSymbols(){
      return [...new Set([
        ...state.marketComparison.basketSymbols,
        ...state.marketComparison.comparisonSymbols
      ].map(normalizeMarketSymbolInput).filter(Boolean))];
    }

    function marketSelectionHasContent(){
      return marketRequestedSymbols().length > 0;
    }

    function marketSearchDomId(target,suffix){
      const prefix = target === "basket" ? "marketBasket" : "marketComparison";
      return `${prefix}${suffix}`;
    }

    function renderMarketAssetPicker(target="comparison"){
      const comparison = state.marketComparison;
      const basketTarget = target === "basket";
      const inputId = marketSearchDomId(target,"SymbolInput");
      const suggestionsId = marketSearchDomId(target,"SymbolSuggestions");
      const value = comparison.searchTarget === target ? comparison.searchQuery : "";
      return `<div class="form-field market-symbol-field"><label for="${inputId}">${basketTarget?"Ativo ou ETF da cesta":"Ativo ou ETF individual"}</label><div class="market-symbol-entry"><input class="input" id="${inputId}" data-market-symbol-input data-symbol-target="${target}" type="text" maxlength="40" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-controls="${suggestionsId}" aria-expanded="false" value="${escapeHtml(value)}" placeholder="Digite PRIO, PETR, BOVA..." /><button class="btn soft" data-action="add-market-symbol" data-symbol-target="${target}">Adicionar</button></div><div class="market-symbol-suggestions" id="${suggestionsId}" role="listbox" aria-label="Sugestões de ativos e ETFs" hidden></div></div>`;
    }

    function renderMarketSelectedSymbols(target="comparison"){
      const basketTarget = target === "basket";
      const symbols = marketSymbolCollection(target);
      if(!symbols.length) return `<div class="market-symbol-empty">${basketTarget?"Escolha os ativos que farão parte da cesta.":"Nenhum ativo individual selecionado."}</div>`;
      return `<div class="market-symbols" aria-label="${basketTarget?"Ativos da cesta":"Ativos individuais selecionados"}">${symbols.map(symbol => { const label=marketSymbolDisplayLabel(symbol); return `<span class="market-symbol-chip">${escapeHtml(label)}<button data-action="remove-market-symbol" data-symbol="${escapeHtml(symbol)}" data-symbol-target="${target}" aria-label="Excluir ${escapeHtml(label)} ${basketTarget?"da cesta":"da comparação"}" title="Excluir ${escapeHtml(label)}">×</button></span>`; }).join("")}</div>`;
    }

    function equalMarketAllocationValues(symbols = state.marketComparison.basketSymbols){
      const uniqueSymbols = [...new Set(symbols.map(normalizeMarketSymbolInput).filter(Boolean))];
      if(!uniqueSymbols.length) return {};
      const base = Math.floor((10000 / uniqueSymbols.length)) / 100;
      let assigned = 0;
      return Object.fromEntries(uniqueSymbols.map((symbol,index)=>{
        const value = index === uniqueSymbols.length-1 ? round(100-assigned) : base;
        assigned = round(assigned+value);
        return [symbol,value];
      }));
    }

    function ensureMarketAllocations(){
      const comparison = state.marketComparison;
      const allocations = comparison.allocations && typeof comparison.allocations === "object" && !Array.isArray(comparison.allocations)
        ? comparison.allocations
        : {};
      const missing = comparison.basketSymbols.some(symbol => !Number.isFinite(Number(allocations[symbol])));
      comparison.allocations = missing ? equalMarketAllocationValues(comparison.basketSymbols) : allocations;
      return comparison.allocations;
    }

    function resetMarketAllocations(){
      state.marketComparison.allocations = equalMarketAllocationValues(state.marketComparison.basketSymbols);
    }

    function marketAllocationStatus(){
      const allocations = ensureMarketAllocations();
      const total = round(state.marketComparison.basketSymbols.reduce((sum,symbol)=>sum+(Number(allocations[symbol])||0),0));
      const difference = round(100-total);
      const valid = Math.abs(difference) <= .05;
      const formattedDifference = new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(difference));
      return {
        difference,
        hint:valid ? "Cesta completa para simular." : difference > 0 ? `Distribua mais ${formattedDifference}%.` : `Reduza ${formattedDifference}%.`,
        total,
        valid
      };
    }

    function marketSeriesForSymbol(comparison,symbol){
      const normalized = normalizeMarketSymbolInput(symbol);
      return comparison.series.find(series => series.kind !== "benchmark" && normalizeMarketSymbolInput(series.symbol || series.id) === normalized) || null;
    }

    function marketBasketFromComparison(comparison){
      const allocations = ensureMarketAllocations();
      return buildWeightedMarketBasket({
        entries:state.marketComparison.basketSymbols.map(symbol => ({
          series:marketSeriesForSymbol(comparison,symbol),
          symbol:marketSymbolDisplayLabel(symbol),
          weight:Number(allocations[symbol]) || 0
        }))
      });
    }

    function marketSeriesDisplayLabel(series){
      if(series?.kind === "basket") return "Minha cesta";
      if(series?.kind === "benchmark") return series.name || selectedMarketBenchmark().name;
      return marketSymbolDisplayLabel(series?.symbol || series?.name);
    }

    function renderMarketBasketEditor(){
      if(!state.marketComparison.basketOpen){
        return `<div class="market-basket-launch"><button type="button" class="btn primary" data-action="open-market-basket">Montar a cesta</button></div>`;
      }
      const allocations = ensureMarketAllocations();
      const status = marketAllocationStatus();
      return `<section class="market-basket-editor" aria-labelledby="marketBasketEditorTitle">
        <div class="market-basket-head"><div><strong id="marketBasketEditorTitle">Monte sua cesta</strong><span>Escolha aqui somente os componentes da cesta e distribua 100% entre eles.</span></div><div class="market-basket-actions">${state.marketComparison.basketSymbols.length?`<button type="button" class="btn soft" data-action="equal-market-allocations">Dividir igualmente</button>`:""}<button type="button" class="btn soft" data-action="delete-market-basket">Excluir cesta</button></div></div>
        ${renderMarketAssetPicker("basket")}
        ${renderMarketSelectedSymbols("basket")}
        ${state.marketComparison.basketSymbols.length?`<div class="market-allocation-grid">${state.marketComparison.basketSymbols.map(symbol=>{const label=marketSymbolDisplayLabel(symbol);return `<div class="market-allocation-field"><label for="marketAllocation-${escapeHtml(symbol)}" title="${escapeHtml(label)}">${escapeHtml(label)}</label><div class="market-allocation-input"><input class="input" id="marketAllocation-${escapeHtml(symbol)}" data-market-allocation data-symbol="${escapeHtml(symbol)}" type="number" min="0" max="100" step="0.01" value="${Number(allocations[symbol])||0}" aria-label="Percentual de ${escapeHtml(label)} na cesta" /><span>%</span></div></div>`;}).join("")}</div>
        <div class="market-allocation-total ${status.valid?"":"is-invalid"}" id="marketAllocationTotal" aria-live="polite"><span id="marketAllocationTotalHint">${escapeHtml(status.hint)}</span><strong id="marketAllocationTotalValue">Total: ${new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(status.total)}%</strong></div>`:""}
      </section>`;
    }

    function updateMarketAllocationDraft(field){
      const symbol = normalizeMarketSymbolInput(field.dataset.symbol);
      if(!symbol || !state.marketComparison.basketSymbols.includes(symbol)) return;
      ensureMarketAllocations()[symbol] = Math.min(100,Math.max(0,number(field.value)));
      const status = marketAllocationStatus();
      const total = document.getElementById("marketAllocationTotal");
      const value = document.getElementById("marketAllocationTotalValue");
      const hint = document.getElementById("marketAllocationTotalHint");
      if(total) total.classList.toggle("is-invalid",!status.valid);
      if(value) value.textContent=`Total: ${new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(status.total)}%`;
      if(hint) hint.textContent=status.hint;
    }

    function refreshMarketBasketResults(){
      const comparison = state.marketComparison;
      const currentResults = document.querySelector("#marketComparisonChapter > .market-comparison-results");
      if(comparison.status !== "success" || !comparison.data || !currentResults) return;
      charts.marketComparisonChart?.destroy();
      currentResults.outerHTML = renderMarketComparisonResults(comparison.data);
      charts.marketComparisonChart = makeMarketComparisonChart("marketComparisonChart");
    }

    function renderMarketSymbolSuggestions(){
      const comparison = state.marketComparison;
      const target = comparison.searchTarget === "basket" ? "basket" : "comparison";
      const container = document.getElementById(marketSearchDomId(target,"SymbolSuggestions"));
      const input = document.getElementById(marketSearchDomId(target,"SymbolInput"));
      document.querySelectorAll(".market-symbol-suggestions").forEach(element=>{
        if(element !== container){ element.hidden=true; element.innerHTML=""; }
      });
      if(!container || !input) return;
      const suggestions = Array.isArray(comparison.suggestions) ? comparison.suggestions : [];
      const show = comparison.searchQuery.trim().length >= 2
        && ["loading","success","error"].includes(comparison.searchStatus);
      container.hidden = !show;
      input.setAttribute("aria-expanded",show ? "true" : "false");
      input.setAttribute("aria-activedescendant",comparison.activeSuggestionIndex >= 0
        ? `marketSuggestion-${target}-${comparison.activeSuggestionIndex}`
        : "");
      if(!show){ container.innerHTML = ""; return; }
      if(comparison.searchStatus === "loading"){
        container.innerHTML = `<div class="market-symbol-suggestion-status">Buscando ativos e ETFs...</div>`;
        return;
      }
      if(comparison.searchStatus === "error"){
        container.innerHTML = `<div class="market-symbol-suggestion-status">Busca indisponível. Digite o código completo e use Adicionar.</div>`;
        return;
      }
      if(!suggestions.length){
        container.innerHTML = `<div class="market-symbol-suggestion-status">Nenhum ativo ou ETF encontrado.</div>`;
        return;
      }
      container.innerHTML = suggestions.map((suggestion,index)=>`<button type="button" id="marketSuggestion-${target}-${index}" class="market-symbol-suggestion ${comparison.activeSuggestionIndex===index?"is-active":""}" data-action="select-market-symbol" data-symbol="${escapeHtml(suggestion.symbol)}" data-symbol-target="${target}" role="option" aria-selected="${comparison.activeSuggestionIndex===index?"true":"false"}" tabindex="-1"><strong>${escapeHtml(suggestion.displaySymbol || suggestion.symbol)}</strong><span>${escapeHtml(suggestion.name || "Ativo B3")}</span><small>${escapeHtml(suggestion.type || "B3")}</small></button>`).join("");
    }

    function queueMarketSymbolSearch(value,target="comparison"){
      const comparison = state.marketComparison;
      comparison.searchTarget = target === "basket" ? "basket" : "comparison";
      comparison.searchQuery = String(value || "").toUpperCase().slice(0,40);
      comparison.suggestions = [];
      comparison.activeSuggestionIndex = -1;
      comparison.searchRequestId = `search_pending_${Date.now()}`;
      clearTimeout(marketSearchTimer);
      const query = comparison.searchQuery.trim();
      if(query.length < 2){
        comparison.searchStatus = "idle";
        renderMarketSymbolSuggestions();
        return;
      }
      comparison.searchStatus = "loading";
      renderMarketSymbolSuggestions();
      marketSearchTimer = setTimeout(()=>{
        if(state.marketComparison.searchQuery.trim() !== query) return;
        comparison.searchStatus = "error";
        comparison.searchRequestId = "";
        renderMarketSymbolSuggestions();
      },260);
    }

    function clearMarketSymbolSearch(){
      clearTimeout(marketSearchTimer);
      state.marketComparison.searchQuery = "";
      state.marketComparison.searchStatus = "idle";
      state.marketComparison.suggestions = [];
      state.marketComparison.activeSuggestionIndex = -1;
    }

    function requestMarketComparison(){
      const comparison = state.marketComparison;
      const symbols = marketRequestedSymbols();
      if(!symbols.length){
        comparison.status = "idle";
        comparison.data = null;
        comparison.error = "";
        comparison.requestId = "";
        render();
        return;
      }
      comparison.status = "loading";
      comparison.error = "";
      comparison.requestId = `market_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
      render();
      comparison.status = "error";
      comparison.error = "A comparação com dados de mercado ficará disponível quando o serviço independente estiver conectado.";
      comparison.requestId = "";
      render();
    }

    function addMarketSymbol(preferredSymbol="",target="comparison"){
      const resolvedTarget = target === "basket" ? "basket" : "comparison";
      const input = document.getElementById(marketSearchDomId(resolvedTarget,"SymbolInput"));
      const rawValue = preferredSymbol || input?.value;
      const benchmark = marketBenchmarkFromValue(rawValue);
      if(benchmark){
        if(resolvedTarget === "basket"){
          toast("Escolha um ativo ou ETF para a cesta; o indexador fica na comparação externa");
          return;
        }
        state.marketComparison.benchmark = benchmark.id;
        clearMarketSymbolSearch();
        requestMarketComparison();
        return;
      }
      const symbol = normalizeMarketSymbolInput(rawValue);
      if(!symbol){ toast("Selecione uma sugestão ou informe um código, como BOVA11 ou PETR4"); return; }
      const symbols = marketSymbolCollection(resolvedTarget);
      if(symbols.includes(symbol)){ toast(`${marketSymbolDisplayLabel(symbol)} já está ${resolvedTarget==="basket"?"na cesta":"na comparação externa"}`); return; }
      if(!marketRequestedSymbols().includes(symbol) && marketRequestedSymbols().length >= 8){ toast("Use no máximo 8 códigos diferentes entre a cesta e a comparação"); return; }
      clearMarketSymbolSearch();
      symbols.push(symbol);
      if(resolvedTarget === "basket") resetMarketAllocations();
      requestMarketComparison();
    }

    function removeMarketSymbol(symbol,target="comparison"){
      const key = target === "basket" ? "basketSymbols" : "comparisonSymbols";
      state.marketComparison[key] = state.marketComparison[key].filter(item => item !== symbol);
      if(key === "basketSymbols") resetMarketAllocations();
      requestMarketComparison();
    }

    function selectMarketBenchmark(value){
      const benchmark = marketBenchmarkFromValue(value);
      if(!benchmark) return;
      state.marketComparison.benchmark = benchmark.id;
      requestMarketComparison();
    }

    function openMarketBasket(){
      state.marketComparison.basketOpen = true;
      state.marketComparison.searchTarget = "basket";
      clearMarketSymbolSearch();
      render();
    }

    function deleteMarketBasket(){
      const comparison = state.marketComparison;
      if(comparison.basketSymbols.length && !confirm("Excluir a cesta e todos os percentuais definidos nela?")) return;
      comparison.basketOpen = false;
      comparison.basketSymbols = [];
      comparison.allocations = {};
      if(comparison.searchTarget === "basket"){
        comparison.searchTarget = "comparison";
        clearMarketSymbolSearch();
      }
      requestMarketComparison();
    }

    function formatMarketPrice(series){
      if(series?.kind === "basket") return "Carteira ponderada";
      if(!Number.isFinite(series?.lastPrice)) return `Referência ${series?.name || selectedMarketBenchmark().name}`;
      if(series.unit === "points" || series.kind === "index") return `${new Intl.NumberFormat("pt-BR",{maximumFractionDigits:2}).format(series.lastPrice)} pontos`;
      if(series.unit === "exchange") return `${toBRL(series.lastPrice)} por US$ 1`;
      try{
        const price = new Intl.NumberFormat("pt-BR",{
          style:"currency",
          currency:series.currency || "BRL",
          maximumFractionDigits:2
        }).format(series.lastPrice);
        return series.proxySymbol ? `ETF ${series.proxySymbol} · ${price}` : price;
      }catch{
        return `${series.currency || ""} ${new Intl.NumberFormat("pt-BR",{maximumFractionDigits:2}).format(series.lastPrice)}`.trim();
      }
    }

    function renderMarketReturnCard(series){
      const simulation = series.simulation || {};
      const finalValue = Number(simulation.finalValue || 0);
      const totalContributed = Number(simulation.totalContributed || 0);
      const gain = Number(simulation.gain || 0);
      const cardKind = series.kind === "basket" ? "basket" : series.kind === "benchmark" || series.kind === "index" ? "benchmark" : "asset";
      return `<article class="market-return-card" data-kind="${cardKind}">
        <small>${escapeHtml(marketSeriesDisplayLabel(series))}</small>
        <strong class="${investmentResultTone(gain)}">${toBRL(finalValue)}</strong>
        <span title="${escapeHtml(series.name)}">Quanto teria hoje · ${escapeHtml(series.kind === "basket" ? "carteira completa" : series.name)}</span>
        <span class="market-return-performance">Rentabilidade histórica: ${formatInvestmentPercent(series.returnPercent)}</span>
        <span>Total aportado: ${toBRL(totalContributed)}</span>
        <span class="${investmentResultTone(gain)}">Ganho sobre os aportes: ${toBRL(gain)} (${formatInvestmentPercent(simulation.gainPercent)})</span>
        <span>${escapeHtml(formatMarketPrice(series))}</span>
        ${series.note?`<span title="${escapeHtml(series.note)}">${escapeHtml(series.note)}</span>`:""}
      </article>`;
    }

    function formatMarketPercentagePoints(value){
      const amount = Number(value) || 0;
      const sign = amount > 0 ? "+" : amount < 0 ? "−" : "";
      return `${sign}${new Intl.NumberFormat("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(amount))} p.p.`;
    }

    function renderMarketBasketSummary(comparison,basket){
      if(!state.marketComparison.basketOpen || !basket.valid) return "";
      const benchmark = comparison.series.find(series=>series.kind === "benchmark");
      const basketSimulation = basket.series.simulation;
      const benchmarkSimulation = benchmark?.simulation || {};
      const difference = basketSimulation.finalValue-(Number(benchmarkSimulation.finalValue)||0);
      const benchmarkName = benchmark?.name || selectedMarketBenchmark().name;
      const weights = ensureMarketAllocations();
      const allocationLabel = state.marketComparison.basketSymbols.filter(symbol=>(Number(weights[symbol])||0)>0).map(symbol=>`${marketSymbolDisplayLabel(symbol)} ${new Intl.NumberFormat("pt-BR",{maximumFractionDigits:2}).format(Number(weights[symbol])||0)}%`).join(" · ");
      return `<section class="market-basket-summary" aria-label="Resultado consolidado da cesta comparado ao ${escapeHtml(benchmarkName)}">
        <div><small>Quanto sua cesta teria hoje</small><strong class="${investmentResultTone(basketSimulation.gain)}">${toBRL(basketSimulation.finalValue)}</strong><span>${escapeHtml(allocationLabel)}</span></div>
        <div><small>Total aportado</small><strong>${toBRL(basketSimulation.totalContributed)}</strong><span>Patrimônio inicial mais aportes.</span></div>
        <div><small>Ganho da cesta</small><strong class="${investmentResultTone(basketSimulation.gain)}">${toBRL(basketSimulation.gain)}</strong><span>${formatInvestmentPercent(basketSimulation.gainPercent)} sobre os aportes.</span></div>
        <div><small>Quanto teria no ${escapeHtml(benchmarkName)}</small><strong>${toBRL(Number(benchmarkSimulation.finalValue)||0)}</strong><span>${formatInvestmentPercent(Number(benchmarkSimulation.gainPercent)||0)} sobre os aportes.</span></div>
        <div><small>Diferença para ${escapeHtml(benchmarkName)}</small><strong class="${investmentResultTone(difference)}">${difference>0?"+ ":difference<0?"− ":""}${toBRL(Math.abs(difference))}</strong><span>${formatMarketPercentagePoints(basket.series.returnPercent-(Number(benchmark?.returnPercent)||0))} na rentabilidade histórica.</span></div>
      </section>`;
    }

    function marketComparisonSeriesForDisplay(comparison){
      const selected = new Set(state.marketComparison.comparisonSymbols.map(normalizeMarketSymbolInput));
      return comparison.series.filter(series => series.kind === "benchmark" || selected.has(normalizeMarketSymbolInput(series.symbol || series.id)));
    }

    function renderMarketComparisonResults(comparison){
      const partialErrors = Array.isArray(comparison.errors) ? comparison.errors : [];
      const basket = marketBasketFromComparison(comparison);
      const comparisonSeries = marketComparisonSeriesForDisplay(comparison);
      const displayedSeries = basket.valid ? [basket.series,...comparisonSeries] : comparisonSeries;
      return `<section class="market-comparison-results">
        ${partialErrors.length ? `<div class="market-comparison-warning" role="status"><b>Alguns códigos não foram carregados:</b> ${partialErrors.map(item => `${escapeHtml(item.symbol)} — ${escapeHtml(item.message)}`).join(" · ")}</div>` : ""}
        ${comparison.historyAdjusted ? `<div class="market-comparison-info" role="status"><b>Histórico ajustado automaticamente:</b> você pediu ${Number(comparison.requestedYears)||state.marketComparison.years} ano(s), mas a comparação começou em ${formatDate(comparison.startDate)}, primeira data comum disponível entre os ativos carregados e ${escapeHtml(selectedMarketBenchmark().name)}.</div>` : ""}
        ${renderMarketBasketSummary(comparison,basket)}
        <div class="market-return-grid">${displayedSeries.map(renderMarketReturnCard).join("")}</div>
        <section class="market-comparison-chart-card">
          <div><span class="investment-step">Rentabilidade acumulada</span><h3>Todos começam em 0%</h3><p>Assim, a distância entre as linhas mostra o desempenho de cada ativo no mesmo período.</p></div>
          <div class="market-comparison-chart-wrap"><canvas id="marketComparisonChart" role="img" aria-label="Rentabilidade histórica da cesta, dos ativos externos e do indexador selecionado"></canvas></div>
        </section>
        <div class="market-comparison-note"><b>Período comum:</b> ${formatDate(comparison.startDate)} a ${formatDate(comparison.endDate)} (${new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1}).format(Number(comparison.effectiveYears)||0)} ano(s)). <b>Simulação:</b> patrimônio aplicado na primeira data e cada aporte mensal incluído no primeiro dia disponível dos meses seguintes. <b>Fontes:</b> ${escapeHtml(comparison.sources?.assets || "Yahoo Finance")} e ${escapeHtml(comparison.sources?.benchmark || "Banco Central do Brasil")}. Cotações podem ter atraso. Rentabilidade passada não garante resultados futuros; conteúdo educativo, não recomendação.</div>
      </section>`;
    }

    function renderMarketComparison(){
      const comparison = state.marketComparison;
      const benchmark = selectedMarketBenchmark();
      let content = `<div class="market-comparison-status"><div><strong>Escolha o que deseja comparar</strong>${comparison.basketOpen?"Escolha os ativos da cesta ou adicione um ativo individual para gerar o gráfico.":"Adicione um ativo individual para gerar o gráfico."}</div></div>`;
      if(comparison.status === "loading"){
        content = `<div class="market-comparison-status" aria-live="polite"><div><div class="market-comparison-loader" aria-hidden="true"></div><strong>Buscando preços e ${escapeHtml(benchmark.name)}</strong>Consultando os históricos necessários...</div></div>`;
      }else if(comparison.status === "error"){
        content = `<div class="market-comparison-status" role="alert"><div><strong>Não foi possível atualizar</strong>${escapeHtml(comparison.error)}<button class="btn primary" data-action="refresh-market-comparison">Tentar novamente</button></div></div>`;
      }else if(comparison.status === "success" && comparison.data){
        content = renderMarketComparisonResults(comparison.data);
      }
      return `<section class="market-comparison-view" id="marketComparisonChapter">
        <section class="market-comparison-controls">
          <div><span class="investment-step">Bolsa e indexadores</span><h3>Compare estratégias com escolhas independentes</h3><p>Adicione ativos individuais e escolha o indexador de referência que deseja analisar.</p></div>
          ${renderMarketBasketEditor()}
          <section class="market-external-selection" aria-labelledby="marketExternalSelectionTitle">
            <div><strong id="marketExternalSelectionTitle">Ativos individuais</strong><span>Cada código selecionado aparece como uma linha própria no gráfico.</span></div>
            ${renderMarketAssetPicker("comparison")}
            ${renderMarketSelectedSymbols("comparison")}
          </section>
          <section class="market-parameters-panel" aria-labelledby="marketParametersTitle">
            <div class="market-parameters-head"><strong id="marketParametersTitle">Parâmetros da simulação</strong><span>Defina o prazo e os valores aplicados em todas as comparações.</span></div>
            <div class="market-parameters-grid">
              <div class="form-field"><label for="marketYearsInput">Período em anos</label><input class="input" id="marketYearsInput" data-market-years type="number" min="1" max="30" step="1" value="${Math.max(1,Math.min(30,Math.round(Number(comparison.years)||1)))}" /></div>
              <div class="form-field"><label for="marketInitialAmount">Patrimônio inicial</label><input class="input" id="marketInitialAmount" data-market-money="initialAmount" type="text" inputmode="decimal" autocomplete="off" value="${formatInvestmentCurrencyInput(comparison.initialAmount)}" /><small>Valor aplicado no começo do período.</small></div>
              <div class="form-field"><label for="marketMonthlyContribution">Aporte por mês</label><input class="input" id="marketMonthlyContribution" data-market-money="monthlyContribution" type="text" inputmode="decimal" autocomplete="off" value="${formatInvestmentCurrencyInput(comparison.monthlyContribution)}" /><small>Somado uma vez a cada mês.</small></div>

    function updateInvestmentSimulation(){
      document.querySelectorAll("[data-investment-simulation]").forEach(field => {

          ? parseInvestmentCurrencyInput(field.value)

      });
      state.investmentSimulation.scenarioRates = state.investmentSimulation.scenarioRates || {};
      document.querySelectorAll("[data-fixed-income-rate]").forEach(field => {
        state.investmentSimulation.scenarioRates[field.dataset.fixedIncomeRate] = Math.min(1000,Math.max(-99,number(field.value)));
      });
      const comparison=fixedIncomeComparisonFromState();
      const selected=selectedFixedIncomeScenario(comparison);
      const best=comparison.bestScenario || selected;
      const spread=fixedIncomeSpread(fixedIncomeChartScenarios(comparison));

      setText("investmentBestReturn",`Ganho líquido estimado de ${toBRL(best.netGainMinor / 100)} (${formatInvestmentPercent(best.netReturnPercent)}).`);
      setText("investmentSelectedRate",`${selected.rateLabel} · ${investmentAnnualRateLabel(selected.annualRate)}`);
      setText("investmentSelectedTax",selected.taxLabel);
      setText("investmentSimulationContributed",toBRL(selected.contributedMinor / 100));
      setText("investmentSimulationProjected",toBRL(selected.netProjectedMinor / 100));
      setText("investmentSimulationGain",toBRL(selected.netGainMinor / 100),selected.netGainMinor);
      setText("investmentSimulationReturn",`${formatInvestmentPercent(selected.netReturnPercent)} sobre o aplicado`,selected.netGainMinor);
      setText("investmentJourneyDuration",`${comparison.months} meses`);

      setText("investmentJourneyTax",toBRL(selected.taxMinor/100));

      setText("investmentJourneyContributions",toBRL(Math.max(0,selected.contributedMinor-comparison.initialMinor)/100));
      setText("investmentJourneyNetGain",toBRL(selected.netGainMinor/100),selected.netGainMinor);

      const returnBar=document.getElementById("investmentCompositionReturn");

      if(returnBar) returnBar.style.width=`${composition.returnPercent}%`;
      comparison.scenarios.forEach(scenario=>{
        const row=document.getElementById(`investmentTableRow-${scenario.id}`);
        if(row) row.classList.toggle("is-best",scenario.id===best.id);
        const bestLabel=document.getElementById(`investmentTableBest-${scenario.id}`);
        if(bestLabel) bestLabel.hidden=scenario.id!==best.id;
        setText(`investmentTableRate-${scenario.id}`,scenario.rateLabel);
        setText(`investmentTableAnnualRate-${scenario.id}`,`${investmentAnnualRateLabel(scenario.annualRate)} efetiva`);
        setText(`investmentTableContributed-${scenario.id}`,toBRL(scenario.contributedMinor/100));
        setText(`investmentTableGrossGain-${scenario.id}`,toBRL(fixedIncomeGrossGainMinor(scenario)/100),fixedIncomeGrossGainMinor(scenario));
        setText(`investmentTableTax-${scenario.id}`,toBRL(scenario.taxMinor/100));
        setText(`investmentTableTaxLabel-${scenario.id}`,scenario.taxLabel);
        setText(`investmentTableNetGain-${scenario.id}`,toBRL(scenario.netGainMinor/100),scenario.netGainMinor);
        setText(`investmentTableNetValue-${scenario.id}`,toBRL(scenario.netProjectedMinor/100));
      });
      const comparisonChart=charts.investmentComparisonChart;
      if(comparisonChart){ comparisonChart.data.labels=comparison.scenarios.map(scenario=>scenario.shortName); comparisonChart.data.datasets[0].data=comparison.scenarios.map(scenario=>scenario.netProjectedMinor/100); comparisonChart.data.datasets[0].backgroundColor=comparison.scenarios.map(scenario=>scenario.id===selected.id?"#4F7CFF":"rgba(255,255,255,.16)"); comparisonChart.update("none"); }

    function trapDialogFocus(event, container){
      const focusable = [...container.querySelectorAll('button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
        .filter(element => !element.closest(".hidden") && element.getClientRects().length);
      if(!focusable.length){
        event.preventDefault();
        container.focus();
        return;
      }
      const first = focusable[0];
      const last = focusable.at(-1);
      if(event.shiftKey && document.activeElement === first){
        event.preventDefault();
        last.focus();
      } else if(!event.shiftKey && document.activeElement === last){
        event.preventDefault();
        first.focus();
      }
    }

      if(!input || !date) return;

    function openEntryModal(id = "", categoryName = "", options = {}){
      const item = id ? data.entries.find(e=>e.id===id) : null;
      const isQuick = options.quick === true && !item;
      const defaultDate = isQuick ? financeVisibleDate() : isoToday();
      openModal(item ? "Editar entrada" : "Nova entrada", entryForm(item || (categoryName ? {category:categoryName} : {}), {quick:isQuick}), (fd) => {
        const undoSnapshot = createUndoSnapshot();
        const explicitCategory = isQuick ? "Outros" : String(fd.get("category") || "");
        const category = resolveSuggestedCategory(fd.get("description"), "entrada", explicitCategory);
        const payload = {
          description: String(fd.get("description") || "").trim(),
          category: category.name,
          categoryId: category.categoryId || categoryForName(category.name)?.id || null,
          value: round(fd.get("value")),
          plannedDate: fd.get("plannedDate") || defaultDate,
          receivedDate: fd.get("receivedDate") || "",
          status: fd.get("status") === "pending" ? "pending" : "received",
          recurrence: isQuick ? "única" : (fd.get("recurrence") || "única"),
          notes: String(fd.get("notes") || "")
        };
        if(payload.status === "received" && !payload.receivedDate) payload.receivedDate = defaultDate;
        if(payload.status === "pending") payload.receivedDate = "";
        const candidate = payload.status === "received" ? canonicalMovement({
          legacyId:item?.id || "",
          type:"income",
          value:payload.value,
          date:payload.receivedDate,
          description:payload.description,
          categoryName:payload.category
        }) : null;
        if(candidate && !confirmPossibleDuplicate(candidate, item?.id || "")) return;
        const expected = candidate && !item ? requestExpectedReconciliation(candidate) : null;
        if(candidate && !item && !isQuick && confirmRecurringPattern(candidate)) payload.recurrence = "mensal";
        let reconciled = false;
        if(item){
          Object.assign(item, payload);
        } else if(expected?.legacyId){
          const planned = data.entries.find(entry => entry.id === expected.legacyId);
          if(planned){
            Object.assign(planned, payload, {
              plannedDate:planned.plannedDate || expected.dueDate,
              receivedDate:payload.receivedDate || defaultDate,
              status:"received"
            });
            reconciled = true;
          }
        }
        if(!item && !reconciled) data.entries.push({id:uid("ent"), ...payload});
        if(explicitCategory && !isQuick) learnSelectedCategory(payload.description, payload.category);
        recordFinanceAudit(reconciled ? "expected_item_reconciled" : (item ? "entry_updated" : "entry_created"), {
          entityId:item?.id || expected?.legacyId || data.entries.at(-1)?.id,
          category:payload.category
        });
        if(!item){
          state.filters.search = "";
          state.filters.category = "all";
          state.filters.kind = "entry";
        }
        const undoLabel = reconciled ? "Conciliação" : (item ? "Alteração da entrada" : "Criação da entrada");
        const feedback = projectedFreeFeedback(
          reconciled
            ? `Recebimento de ${toBRL(payload.value)} conciliado.`
            : (item ? `Recebimento de ${toBRL(payload.value)} atualizado.` : `Recebimento de ${toBRL(payload.value)} registrado.`),
          payload.category
        );
        closeModal(); autosave(); render(); registerUndo(undoSnapshot, undoLabel); toast(feedback, {undo:true});
      }, {submitLabel:item ? "Salvar alterações" : "Registrar recebimento"});
      syncEntryReceivedDateField(document.getElementById("modalForm"));
    }

    function openPurchaseModal(cardId, purchaseId = ""){
      const purchase = purchaseId ? data.cardPurchases.find(p=>p.id===purchaseId) : null;
      openModal(purchase ? "Editar compra do cartão" : "Nova compra no cartão", purchaseForm(cardId, purchase || {}), (fd) => {
        const undoSnapshot = createUndoSnapshot();
        const amountMinor = toMinorUnits(Math.abs(number(fd.get("totalValue"))));
        if(amountMinor <= 0) return;
        const selectedCardId = String(fd.get("cardId") || cardId);
        const card = data.cards.find(c => c.id === selectedCardId);
        if(!card) return;
        const explicitCategory = String(fd.get("category") || "");
        const category = resolveSuggestedCategory(fd.get("description"), "saida", explicitCategory);
        const transactionType = normalizeCardPurchaseTransactionType(fd.get("transactionType"));
        const installments = Math.max(1, Number(fd.get("installments") || 1));
        const type = installments > 1 ? "parcelado" : "à vista";
        const isInstallmentPlan = installments > 1;
        const currentInstallment = Math.min(installments, Math.max(1, Number(fd.get("currentInstallment") || 1)));
        const purchaseDate = fd.get("date") || isoToday();
        const billAssignment = assignCardPurchaseToBill(card, purchaseDate);
        const invoiceDueDate = fd.get("invoiceDueDate") || billAssignment?.dueDate || purchaseDate;
        const schedule = buildInstallmentSchedule(amountMinor, installments, invoiceDueDate, currentInstallment);
        const candidate = canonicalMovement({
          legacyId:purchase?.id || "",
          type:transactionType === "credit" ? "refund" : "card_purchase",
          value:amountMinor / 100,
          date:purchaseDate,
          description:fd.get("description"),
          categoryName:category.name,
          cardId:selectedCardId,
          installmentPlan:{count:installments, current:currentInstallment, schedule}
        });
        if(!confirmPossibleDuplicate(candidate, purchase?.id || "")) return;
        const payload = {
          cardId:selectedCardId,
          date: purchaseDate,
          invoiceDueDate,
          description:String(fd.get("description") || "").trim(),
          category:category.name,
          categoryId:category.categoryId || categoryForName(category.name)?.id || null,
          subcategory: cleanSubcategory(fd.get("subcategory")),
          totalValue:amountMinor / 100,
          amountMode:"total",
          type,
          transactionType,
          installments,
          currentInstallment,
          installmentValue:(schedule[0]?.amountMinor || amountMinor) / 100,
          recurrence:fd.get("recurrence") || "única",
          status:fd.get("status") || "open",
          paidInstallments: purchase?.paidInstallments || [],
          notes:String(fd.get("notes") || "")
        };
        if(!purchase && confirmRecurringPattern(candidate)) payload.recurrence = "mensal";
        if(!payload.subcategory) payload.subcategory = inferSubcategoryForCardPurchase(payload);
        if(purchase){
          delete purchase.importedInvoiceMonth;
          Object.assign(purchase, payload);
        } else {
          data.cardPurchases.push({id:uid("pur"), ...payload});
        }
        if(explicitCategory) learnSelectedCategory(payload.description, payload.category);
        data.settings.defaultCardId = selectedCardId;
        recordFinanceAudit(purchase ? "card_purchase_updated" : "card_purchase_created", {
          entityId:purchase?.id || data.cardPurchases.at(-1)?.id,
          cardId:selectedCardId,
          billMonth:invoiceDueDate.slice(0,7),
          installments
        });
        state.filters.search = "";
        state.filters.category = "all";
        state.filters.kind = "expense";
        const normalized = migrateFinancialData(data, {now:new Date().toISOString()});
        const summary = getMonthSummary(normalized, getMonthKey());
        const monthLabel = invoiceDueDate.slice(0,7).split("-").reverse().join("/");
        const installmentText = installments > 1
          ? `${installments} parcelas; a atual é ${toBRL((schedule[0]?.amountMinor || 0) / 100)}`
          : `parcela de ${toBRL((schedule[0]?.amountMinor || amountMinor) / 100)}`;
        const feedback = `${purchase ? "Compra atualizada" : "Compra registrada"}: ${toBRL(amountMinor / 100)} na fatura ${monthLabel}, ${installmentText}. Categoria: ${payload.category}. Livre projetado: ${toBRL(summary.projectedFreeMinor / 100)}.`;
        const undoLabel = purchase ? "Alteração da compra" : "Criação da compra";
        closeModal(); autosave(); render(); registerUndo(undoSnapshot, undoLabel);
        if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true);
        toast(feedback, {undo:true});
      }, {submitLabel:purchase ? "Salvar alterações" : "Adicionar à fatura"});
      syncPurchaseInvoiceDueDate(document.getElementById("modalForm"));
    }

    function monthPartsFromKey(monthKey){
      const [year, month] = String(monthKey || "").split("-").map(Number);
      return {year, monthIndex:MONTH_NUMBERS.indexOf(month)};
    }

    function getCardDrawerRowsForMonth(cardId, monthKey = getMonthKey()){
      const {year, monthIndex} = monthPartsFromKey(monthKey);
      if(monthIndex < 0 || !year) return [];
      const rows = [];
      data.cardPurchases.filter(p => p.cardId === cardId).forEach(p => {
        getPurchaseInstallments(p)
          .filter(inst => inst.key === monthKey)
          .forEach(inst => rows.push({source:"purchase", purchase:p, inst}));
      });
      rows.push(...getLinkedExpenseRowsForCard(cardId, monthIndex, year));
      return rows;
    }

    function buildCardDrawerInvoiceRow(invoice){
      if(!invoice?.overrideEnabled) return null;
      const label = "Fatura cadastrada";
      const description = `${label} ${invoice.monthKey}`;
      return {
        source:"invoice",
        purchase:{
          ...invoice,
          description,
          subcategory:"",
          status:invoice.status || "pending"
        },
        inst:{
          key:invoice.monthKey,
          installmentKey:invoice.payKey,
          number:1,
          total:1,
          label,
          value:round(invoice.overrideAmount),
          displayValue:round(invoice.overrideAmount),
          dueDate:invoice.dueDate,
          status:invoice.status === "paid" ? "paid" : "open"
        }
      };
    }

    function getCardInvoiceTimeline(card){
      const start = financeMonthPositionFromKey(financeProjectionStartMonthKey());
      if(!start) return [];
      const visibleKey = getMonthKey();
      return Array.from({length:MAX_RECURRING_PROJECTION_MONTHS}, (_, offset) => {
        const position = monthPositionFromOffset(start.monthIndex, start.year, offset);
        const dates = getCardBillingDates(card, position.monthIndex, position.year);
        const commitment = getCardInvoiceCommitment(card, position.key);
        const payment = getInvoicePaymentRecord(card.id, position.key);
        const override = getInvoiceOverride(card.id, position.key);
        const hasPaymentHistory = payment.status === "paid"
          || payment.status === "partial"
          || number(payment.paidAmount) > 0
          || Boolean(payment.paymentDate);
        const hasRecord = commitment.invoice > 0 || commitment.open > 0 || override.enabled || hasPaymentHistory;
        const isPaid = payment.status === "paid" || (commitment.invoice > 0 && commitment.open <= 0);
        const status = isPaid
          ? "Paga"
          : (payment.status === "partial" ? "Parcial" : (position.key > visibleKey ? "Prevista" : "Em aberto"));
        return {
          ...position,
          closingDate:dates.closingDate,
          dueDate:dates.dueDate,
          total:commitment.invoice,
          status,
          statusClass:isPaid ? "is-paid" : (payment.status === "partial" ? "is-partial" : ""),
          hasRecord
        };
      }).filter(item => item.hasRecord);
    }

    function renderCardInvoiceTimeline(card, timeline = getCardInvoiceTimeline(card)){
      const rows = timeline.map(item => `
        <div class="card-invoice-timeline-row ${item.statusClass}" role="row" title="Fecha ${formatDate(item.closingDate)} · vence ${formatDate(item.dueDate)}">
          <span class="card-invoice-timeline-month" role="cell">${escapeHtml(item.label)}</span>
          <span class="card-invoice-timeline-status" role="cell">${escapeHtml(item.status)}</span>
          <strong class="card-invoice-timeline-value" role="cell">${toBRL(item.total)}</strong>
        </div>
      `).join("");
      return `
        <section class="card-invoice-timeline" role="table" aria-label="Histórico e próximas faturas do cartão ${escapeHtml(card.name)}">
          <div class="card-invoice-timeline-head" role="row"><span role="columnheader">Mês</span><span role="columnheader">Fatura</span><span role="columnheader">Valor</span></div>
          <div class="card-invoice-timeline-list" role="rowgroup">
            ${rows || `<div class="card-invoice-timeline-empty">Nenhuma fatura registrada neste cartão.</div>`}
          </div>
        </section>
      `;
    }

    function openCardDrawer(cardId, silent = false){
      const card = data.cards.find(c=>c.id===cardId);
      if(!card) return;
      if(!silent) lastDrawerTrigger = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      activeDrawerCardId = cardId;
      const timeline = getCardInvoiceTimeline(card);
      charts.cardInvoiceTimelineChart?.destroy?.();
      delete charts.cardInvoiceTimelineChart;
      document.getElementById("drawerTitle").textContent = `Faturas • ${card.name}`;
      document.getElementById("drawerBody").innerHTML = `
        <div class="card-invoice-overview">
          ${timeline.length ? `
            <section class="card-invoice-chart" aria-labelledby="cardInvoiceChartTitle">
              <div class="card-invoice-chart-head"><strong id="cardInvoiceChartTitle">Evolução das faturas</strong><span>Histórico e próximos meses</span></div>
              <div class="card-invoice-chart-wrap"><canvas id="cardInvoiceTimelineChart" role="img" aria-label="Gráfico de linha com os valores mensais das faturas"></canvas></div>
            </section>
          ` : ""}
          ${renderCardInvoiceTimeline(card, timeline)}

      requestAnimationFrame(() => {
        if(timeline.length && typeof Chart !== "undefined"){
          charts.cardInvoiceTimelineChart = makeCardInvoiceTimelineChart("cardInvoiceTimelineChart", timeline);
        }
      });
      if(!silent){
        document.querySelector("#drawerBackdrop .drawer")?.focus({preventScroll:true});
        toast(`Cartão ${card.name} aberto`);
      }
    }

    function findInvoiceByCardMonth(cardId, monthKey){
      const [year, month] = String(monthKey || "").split("-").map(Number);
      const monthIndex = MONTH_NUMBERS.indexOf(month);
      if(monthIndex < 0 || !year) return null;
      const virtualInvoice = getVirtualInvoicesForMonth(monthIndex, year).find(invoice => invoice.cardId === cardId);
      if(virtualInvoice) return virtualInvoice;
      const card = data.cards.find(item => item.id === cardId);
      if(!card) return null;
      const purchaseStats = getCardPurchaseStats(card, monthIndex, year);
      const linkedStats = getLinkedExpenseStats(card, monthIndex, year);
      const computedValue = round(purchaseStats.invoice + linkedStats.invoice);
      const override = getInvoiceOverride(cardId, monthKey);
      const value = round(computedValue + (override.enabled ? override.amount : 0));
      const payKey = invoicePaymentKey(cardId, monthKey);
      const payment = data.invoicePayments[payKey] || {};
      return {
        id:`invoice_${cardId}_${monthKey}`,
        virtual:true,
        source:"cardInvoice",
        monthKey,
        payKey,
        cardId,
        description:`Fatura ${card.name}`,
        category:"Cartao de Credito",
        value,
        computedValue,
        overrideEnabled:override.enabled,
        overrideAmount:override.enabled ? override.amount : "",
        overrideMode:override.mode,
        overrideIncludesLinked:override.includesLinked,
        overrideNotes:override.notes,
        displayValue:value,
        paidAmount:0,
        remainingAmount:value,
        renegotiationInstallments:Number(payment.renegotiationInstallments || 0),
        renegotiationFirstDueDate:payment.renegotiationFirstDueDate || "",
        dueDate:dateFromDay(card.dueDay || 1, monthIndex, year),
        paymentDate:payment.paymentDate || "",
        status:payment.status || "pending",
        paymentMethod:"cartao de credito",
        installments:1,
        currentInstallment:1,
        recurrence:"unica",
        notes:"Fatura manual criada pela visao do cartao."
      };
    }

    function upsertManualInvoiceEntry(cardId, targetMonthKey, manualEntryAmount, updatedAt){
      const targetInvoice = findInvoiceByCardMonth(cardId, targetMonthKey);
      if(!targetInvoice) return false;
      const payKey = invoicePaymentKey(cardId, targetMonthKey);
      const previous = data.invoicePayments[payKey] || {};
      const invoiceTotal = round(number(targetInvoice.computedValue) + manualEntryAmount);
      const previousStatus = previous.status || "pending";
      const paidAmount = previousStatus === "paid"
        ? invoiceTotal
        : Math.min(invoiceTotal, Math.max(0, round(previous.paidAmount)));
      const remainingAmount = previousStatus === "pending" ? undefined : Math.max(0, round(invoiceTotal - paidAmount));
      const nextPayment = {
        ...previous,
        ...(previousStatus === "paid" ? {paidAmount:invoiceTotal, remainingAmount:0} : {}),
        ...(previousStatus === "partial" ? {
          status:remainingAmount <= 0 ? "paid" : "partial",
          paidAmount,
          remainingAmount,
          renegotiationInstallments:remainingAmount > 0 ? Math.max(1, Number(previous.renegotiationInstallments || 1)) : 0
        } : {}),
        manualEntryEnabled:true,
        manualEntryAmount,
        manualEntryUpdatedAt:updatedAt
      };
      ["overrideEnabled","overrideAmount","overrideMode","overrideNotes","overrideUpdatedAt"].forEach(key => delete nextPayment[key]);
      data.invoicePayments[payKey] = nextPayment;
      recordFinanceAudit("card_bill_manual_entry_updated", {cardId, monthKey:targetMonthKey, amount:manualEntryAmount});
      return true;
    }

    function openInvoiceOverrideModal(cardId, monthKey){
      const invoice = findInvoiceByCardMonth(cardId, monthKey);
      if(!invoice) return toast("Fatura não encontrada");
      openModal("Adicionar fatura", invoiceOverrideForm(invoice), (fd) => {
        const monthKeys = fd.getAll("overrideMonthKey").map(value => String(value || ""));
        const amounts = fd.getAll("overrideAmount");
        if(!monthKeys.length || monthKeys.length !== amounts.length) return toast("Preencha ao menos uma fatura");
        const seen = new Set();
        const entries = [];
        for(let index = 0; index < monthKeys.length; index += 1){
          const targetMonthKey = normalizeMonthKey(monthKeys[index], "");
          const manualEntryAmount = Math.max(0, round(amounts[index]));
          if(!targetMonthKey || targetMonthKey < financeProjectionStartMonthKey() || targetMonthKey > financeProjectionEndMonthKey()) return toast("Selecione meses dentro dos 24 meses do planejamento");
          if(seen.has(targetMonthKey)) return toast(`O mês ${targetMonthKey} foi adicionado mais de uma vez`);
          if(manualEntryAmount <= 0) return toast(`Informe um valor maior que zero para ${targetMonthKey}`);
          seen.add(targetMonthKey);
          entries.push({monthKey:targetMonthKey, amount:manualEntryAmount});
        }
        const undoSnapshot = createUndoSnapshot();
        const updatedAt = new Date().toISOString();
        if(entries.some(entry => !upsertManualInvoiceEntry(cardId, entry.monthKey, entry.amount, updatedAt))){
          return toast("Não foi possível preparar uma das faturas");
        }
        closeModal(); autosave(); render();
        if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true);
        registerUndo(undoSnapshot, entries.length === 1 ? "Cadastro da fatura" : "Cadastro das faturas");
        toast(entries.length === 1 ? "Fatura adicionada ao mês" : `${entries.length} faturas adicionadas aos meses correspondentes`, {undo:true});
      }, {submitLabel:"Salvar faturas"});
    }

          ...previous,
          status:remainingAmount <= 0 ? "paid" : "partial",

          remainingAmount,
          renegotiationInstallments:installments,
          renegotiationFirstDueDate:remainingAmount > 0 ? (fd.get("renegotiationFirstDueDate") || addMonths(invoice.dueDate, 1)) : "",
          renegotiationNotes:fd.get("renegotiationNotes") || "",

    function markRenegotiationInstallment(id, status){
      const [, payKey, installmentNumber] = String(id || "").split("__");
      const payment = data.invoicePayments[payKey];
      if(!payment) return;
      const undoSnapshot = createUndoSnapshot();
      const installmentKey = `reneg_${installmentNumber}`;
      payment.renegotiationPayments = payment.renegotiationPayments || {};
      if(status === "paid"){
        payment.renegotiationPayments[installmentKey] = {status:"paid", paymentDate:isoToday()};
      } else {
        delete payment.renegotiationPayments[installmentKey];
      }
      recordFinanceAudit("renegotiation_installment_changed", {payKey, installmentNumber, status});
      autosave(); render(); registerUndo(undoSnapshot, "Alteração da renegociação"); toast(status === "paid" ? "Parcela da renegociação paga" : "Parcela da renegociação voltou para pendente", {undo:true});
    }

    function markEntry(id, status){
      const item = data.entries.find(e=>e.id===id);
      if(!item) return;
      const undoSnapshot = createUndoSnapshot();
      item.status = status;
      item.receivedDate = status === "received" ? (item.receivedDate || isoToday()) : "";
      recordFinanceAudit("entry_status_changed", {entityId:id, status});
      autosave(); render();
      registerUndo(undoSnapshot, "Alteração da entrada");
      toast(status === "received" ? "Entrada marcada como recebida" : "Entrada voltou para pendente", {undo:true});
    }

    function markExpense(id, status){
      if(id.startsWith("reneg__")){
        markRenegotiationInstallment(id, status);
        return;
      }
      if(id.startsWith("invoice_")){
        const parts = id.split("_");
        const cardId = parts.slice(1,-1).join("_");
        const key = parts[parts.length-1];
        if(status === "paid") payInvoiceFull(cardId, key);
        else resetInvoicePayment(cardId, key);
        return;
      }
      const item = data.expenses.find(e=>e.id===id);
      if(!item) return;
      const undoSnapshot = createUndoSnapshot();
      item.status = status;
      item.paymentDate = status === "paid" ? (item.paymentDate || isoToday()) : "";
      recordFinanceAudit("expense_status_changed", {entityId:id, status});
      autosave(); render();
      if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true);
      registerUndo(undoSnapshot, "Alteração da saída");
      toast(status === "paid" ? "Saída marcada como paga" : "Saída voltou para pendente", {undo:true});
    }

    function invoicePaymentHasManualOverride(payment = {}){
      return payment.manualEntryEnabled === true
        || payment.manualEntryAmount !== undefined
        || payment.manualEntryUpdatedAt !== undefined
        || payment.overrideEnabled === true
        || payment.overrideAmount !== undefined
        || payment.overrideMode !== undefined
        || payment.overrideNotes !== undefined
        || payment.overrideUpdatedAt !== undefined;
    }

    function removeInvoicePaymentManualOverride(payment = {}){
      ["manualEntryEnabled","manualEntryAmount","manualEntryUpdatedAt","overrideEnabled","overrideAmount","overrideMode","overrideNotes","overrideUpdatedAt"].forEach(key => delete payment[key]);
      return payment;
    }

    function getCardManualCleanupCounts(cardId){
      let overrideCount = 0;
      Object.entries(data.invoicePayments || {}).forEach(([payKey, payment]) => {
        const parsed = parseInvoicePaymentKey(payKey);
        if(parsed.cardId === cardId && invoicePaymentHasManualOverride(payment)) overrideCount += 1;
      });
      return {
        expenseCount:data.expenses.filter(expense => expense.cardId === cardId).length,
        overrideCount
      };
    }

    function deleteCardManualLaunches(cardId){
      const card = data.cards.find(item => item.id === cardId);
      if(!card) return;
      const counts = getCardManualCleanupCounts(cardId);
      if(!counts.expenseCount && !counts.overrideCount){
        toast("Nenhum lancamento manual deste cartao para excluir");
        return;
      }
      const message = [
        `Excluir todos os lancamentos manuais do cartao ${card.name}?`,
        `Serao removidas ${counts.expenseCount} saida(s) manual(is) vinculada(s) e ${counts.overrideCount} linha(s) de fatura cadastrada(s).`,
        "Compras do cartao importadas ou adicionadas como compra serao mantidas."
      ].join("\n\n");
      if(!confirm(message)) return;
      const undoSnapshot = createUndoSnapshot();
      data.expenses = data.expenses.filter(expense => expense.cardId !== cardId);
      Object.entries(data.invoicePayments || {}).forEach(([payKey, payment]) => {
        const parsed = parseInvoicePaymentKey(payKey);
        if(parsed.cardId !== cardId || !invoicePaymentHasManualOverride(payment)) return;
        removeInvoicePaymentManualOverride(payment);
        if(!Object.keys(payment).length) delete data.invoicePayments[payKey];
      });
      recordFinanceAudit("card_manual_items_deleted", {cardId, ...counts});
      autosave(); render();
      if(activeDrawerCardId === cardId) openCardDrawer(cardId, true);
      registerUndo(undoSnapshot, "Exclusão dos lançamentos do cartão");
      toast("Lançamentos manuais do cartão excluídos", {undo:true});
    }

      registerUndo(undoSnapshot, `Exclusão da ${label}`);
      toast("Item excluído", {undo:true});
