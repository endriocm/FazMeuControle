    }

    function renderProjectedBreakdown(summary){
      const rows = [
        ["Recebidos", summary.receivedMinor, "positive", "+"],
        ["Reembolsos", summary.refundsMinor, "positive", "+"],
        ["Entradas esperadas", summary.expectedIncomeMinor, "positive", "+"],
        ["Gastos pagos", summary.paidMinor, "negative", "−"],
        ["Compromissos restantes", summary.committedMinor, "negative", "−"]
      ];
      return `
        <div class="guidance-breakdown" aria-label="Composição do livre projetado">
          <h3>Como chegamos neste valor</h3>
          ${rows.map(([label,value,tone,operator]) => `
            <div class="guidance-breakdown-row">
              <span>${operator} ${label}</span>
              <strong class="${tone}">${toBRL(value / 100)}</strong>
            </div>
          `).join("")}
          <div class="guidance-breakdown-row total">
            <span>= Livre projetado</span>
            <strong class="${summary.projectedFreeMinor < 0 ? "negative" : "positive"}">${toBRL(summary.projectedFreeMinor / 100)}</strong>
          </div>
        </div>
      `;
    }

    function renderMonthChange(change){
      const difference = number(change.differenceMinor);
      const comparisonText = difference === 0
        ? "Sem mudança em relação ao mês anterior."
        : `${toBRL(Math.abs(difference) / 100)} ${difference > 0 ? "a mais" : "a menos"} que no mês anterior.`;
      return `
        <article class="guidance-change">
          <small>${escapeHtml(change.title)}</small>
          <strong>${toBRL(change.currentMinor / 100)}</strong>
          <span>${comparisonText}</span>
        </article>
      `;
    }

    function getFinanceProjectionMonths(count = 12){
      return forwardMonthWindow(count).map(month => {
        const summary = getMonthSummary(data, month.key);
        return {
          ...month,
          receivedMinor:summary.receivedMinor + summary.refundsMinor + summary.expectedIncomeMinor,
          spentMinor:summary.paidMinor + summary.committedMinor,
          projectedFreeMinor:summary.projectedFreeMinor
        };
      });
    }

    function renderFinanceProjectionMonths(){
      return getFinanceProjectionMonths(12).map(month => `
        <article class="projection-month-card">
          <small>${month.label}</small>
          <div class="projection-month-row"><span>Recebimentos</span><strong>${toBRL(month.receivedMinor / 100)}</strong></div>
          <div class="projection-month-row"><span>Gastos</span><strong>${toBRL(month.spentMinor / 100)}</strong></div>
          <div class="projection-month-row total"><span>Livre projetado</span><strong class="${month.projectedFreeMinor < 0 ? "negative" : "positive"}">${toBRL(month.projectedFreeMinor / 100)}</strong></div>
        </article>
      `).join("");
    }

    function dashboardShortDate(date){
      const parts = String(date || "").split("-");
      if(parts.length !== 3) return "--";
      const monthIndex = Number(parts[1]) - 1;
      return `${parts[2]} ${MONTHS[monthIndex] || ""}`.trim();
    }

    function getExpenseTagTotals(monthIndex = state.month, planningYear = state.year){
      const groups = new Map();
      getExpenseDetailRowsForMonth(monthIndex, planningYear).forEach(item => {
        const rawValue = Math.abs(number(item.displayValue ?? item.value));
        const signedValue = item.source === "cardPurchase" && item.transactionType === "credit" ? -rawValue : rawValue;
        const category = item.category || "Sem categoria";
        const current = groups.get(category) || {name:category,value:0,count:0,color:categoryForName(category)?.color || "#4F7CFF"};
        current.value = round(current.value + signedValue);
        current.count += 1;
        groups.set(category, current);
      });
      return [...groups.values()].filter(item => item.value > 0).sort((a,b) => b.value - a.value);
    }

    function dashboardExpenseCategories(){
      return getExpenseTagTotals().slice(0, 6);
    }

    function renderDashboardRecentItems(){
      const rows = financeOsRecentItems(7, true);
      if(!rows.length) return `<div class="reference-empty">Nenhuma movimentação encontrada para o mês selecionado.</div>`;
      return rows.map(item => {
        const openAction = item.kind === "entry" ? "edit-entry" : item.kind === "expense" ? "edit-expense" : "open-card";
        const deleteAction = item.kind === "entry" ? "delete-entry" : item.kind === "expense" ? "delete-expense" : "";
        const icon = item.kind === "entry" ? "↗" : item.kind === "card" ? "▭" : "↓";
        return `
          <article class="reference-tx" role="listitem">
            <span class="reference-tx-icon ${item.kind}" aria-hidden="true">${icon}</span>
            <div class="reference-tx-name">
              <strong>${escapeHtml(item.description)}</strong>
              <span>${escapeHtml(item.account || item.type || "Movimentação")}</span>
            </div>
            <span class="reference-tx-category">${escapeHtml(item.category || "Sem categoria")}</span>
            <time datetime="${escapeHtml(item.date || "")}">${formatDate(item.date)}</time>
            <strong class="reference-tx-value ${item.value >= 0 ? "positive" : "negative"}">${toBRL(item.value)}</strong>
            <details class="reference-tx-menu">
              <summary aria-label="Opções de ${escapeHtml(item.description)}">•••</summary>
              <div>
                <button type="button" data-action="${openAction}" data-id="${escapeHtml(item.openId || item.id)}">Abrir</button>
                ${deleteAction ? `<button type="button" class="negative" data-action="${deleteAction}" data-id="${escapeHtml(item.id)}">Excluir</button>` : ""}
              </div>
            </details>
          </article>
        `;

              <span class="reference-eyebrow">Cartão principal</span>

            <div class="reference-credit-number">•••• •••• •••• ••••</div>
            <div class="reference-credit-bottom"><div><span>VENCIMENTO</span><strong>${dashboardShortDate(dueDate)}</strong></div><div class="reference-credit-brand">${escapeHtml(visual.brand.label)}</div></div>
          </div>
          <div class="reference-invoice">
            <div class="reference-invoice-top"><div><span class="reference-eyebrow">Fatura de ${financeOsMonthName()}</span><strong>${toBRL(stats.invoice)}</strong></div><span class="reference-status ${payment.status === "paid" ? "paid" : ""}">${invoiceStatus}</span></div>
            <div class="reference-progress" aria-label="${stats.percent.toFixed(0)}% do limite utilizado"><span style="width:${Math.min(100, stats.percent)}%"></span></div>
            <div class="reference-limit-note"><span>${stats.percent.toFixed(0)}% do limite usado</span><strong>${toBRL(stats.available)} de limite disponível</strong></div>

          </div>

    function renderDashboardCommitments(commitments){
      if(!commitments.length) return `<div class="reference-empty compact">Nenhum compromisso futuro em aberto.</div>`;
      return commitments.slice(0, 3).map(item => `
        <article class="reference-upcoming-item">
          <time datetime="${escapeHtml(item.dueDate || "")}"><strong>${String(item.dueDate || "").slice(8,10) || "--"}</strong><span>${MONTHS[(Number(String(item.dueDate || "").slice(5,7)) || 1) - 1] || ""}</span></time>
          <div><strong>${escapeHtml(item.description)}</strong><span>${item.kind === "card_bill" ? "Fatura do cartão" : "Compromisso previsto"}</span></div>
          <strong>${toBRL(item.amountMinor / 100)}</strong>
        </article>
      `).join("");
    }

    function renderDashboardCategoryBars(){
      const categories = dashboardExpenseCategories();
      if(!categories.length) return `<div class="reference-empty">Registre gastos para visualizar a distribuição por categoria.</div>`;
      const total = round(categories.reduce((sum,item) => sum + item.value, 0));
      const max = Math.max(...categories.map(item => item.value), 1);
      return `
        <div class="reference-spend-summary"><div><h2>Para onde foi seu dinheiro</h2><p>Pagamentos e parcelas do cartão, sem dupla contagem.</p></div><div><span class="reference-eyebrow">Gastos registrados</span><strong>${toBRL(total)}</strong></div></div>
        <div class="reference-spend-bars">
          ${categories.map((item,index) => {
            const percent = total ? Math.round((item.value / total) * 100) : 0;
            return `
              <div class="reference-bar-row">
                <div><strong>${escapeHtml(item.name)}</strong><span>${item.count} ${item.count === 1 ? "lançamento" : "lançamentos"}</span></div>
                <div class="reference-bar-track"><span class="tone-${index % 6}" style="width:${Math.max(3,(item.value / max) * 100)}%"></span></div>
                <div><strong>${toBRL(item.value)}</strong><span>${percent}% do total</span></div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderLegacyReferenceDashboard(){
      const monthKey = getMonthKey();
      const summary = getMonthSummary(data, monthKey);
      const commitments = getUpcomingCommitments(data, `${monthKey}-01`, 5);
      const receivedWithRefunds = summary.receivedMinor + summary.refundsMinor;
      const cardSummary = getDashboardCardSummary();
      const incomeBaseMinor = receivedWithRefunds + summary.expectedIncomeMinor;
      const commitmentPercent = incomeBaseMinor ? Math.round((summary.committedMinor / incomeBaseMinor) * 100) : (summary.committedMinor ? 100 : 0);
      const now = new Date();
      const currentSelection = state.month === now.getMonth() && state.year === now.getFullYear();
      const daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
      const remainingDays = Math.max(1, currentSelection ? daysInMonth - now.getDate() + 1 : daysInMonth);
      const dailyMinor = Math.round(summary.projectedFreeMinor / remainingDays);
      return `
        <section class="page reference-dashboard">
          <section class="reference-summary-grid" aria-label="Resumo do mês">
            <article class="reference-hero-card">
              <span class="reference-eyebrow">Disponível em ${financeOsMonthName()}</span>
              <strong class="reference-hero-value ${summary.projectedFreeMinor < 0 ? "negative" : ""}" data-currency="${summary.projectedFreeMinor / 100}">${toBRL(summary.projectedFreeMinor / 100)}</strong>
              <p>Receitas menos gastos pagos e compromissos que ainda vencem no mês.</p>
              <div class="reference-hero-meta"><span>${toBRL(dailyMinor / 100)} por dia nos próximos ${remainingDays} dias</span><span>${commitmentPercent}% da renda está comprometida</span></div>
              <details class="reference-formula"><summary>Como calculamos</summary>${renderProjectedBreakdown(summary)}</details>
            </article>
            <article class="reference-metric-card"><div class="reference-metric-top"><span class="reference-eyebrow">Entrou</span><span class="reference-metric-icon positive">↗</span></div><div><strong class="positive">${toBRL(receivedWithRefunds / 100)}</strong><p>Entradas recebidas no mês</p></div></article>
            <article class="reference-metric-card"><div class="reference-metric-top"><span class="reference-eyebrow">Já saiu</span><span class="reference-metric-icon negative">↓</span></div><div><strong class="negative">${toBRL(summary.paidMinor / 100)}</strong><p>Pagamentos já realizados</p></div></article>
            <article class="reference-metric-card"><div class="reference-metric-top"><span class="reference-eyebrow">No cartão</span><span class="reference-metric-icon">▭</span></div><div><strong>${toBRL(cardSummary.invoice)}</strong><p>Compras que compõem a fatura do mês</p></div></article>
          </section>

          <section class="reference-quick-shell" aria-label="Adicionar movimentação rapidamente">
            <button type="button" class="reference-quick-action" data-action="add-entry"><span class="reference-quick-icon positive">＋</span><span><strong>Recebi</strong><small>Salário, Pix ou outra entrada</small></span></button>
            <button type="button" class="reference-quick-action" data-action="add-expense"><span class="reference-quick-icon negative">−</span><span><strong>Paguei</strong><small>Conta, Pix, débito ou dinheiro</small></span></button>
            <button type="button" class="reference-quick-action" data-action="add-card-purchase"><span class="reference-quick-icon">▭</span><span><strong>Cartão</strong><small>Compra à vista ou parcelada</small></span></button>
          </section>

          <section class="reference-main-grid">
            <article class="panel reference-transactions">
              <div class="reference-section-head"><div><h2>Movimentações recentes</h2><p>O que aconteceu no mês selecionado</p></div><button class="reference-link" type="button" data-action="tab" data-tab="movements">Ver tudo</button></div>
              <div class="reference-search-row"><input class="input" data-filter="search" value="${escapeHtml(state.filters.search)}" placeholder="Buscar por nome..." aria-label="Buscar movimentação" /><select class="select" data-filter="kind" aria-label="Filtrar movimentações"><option value="all" ${state.filters.kind === "all" ? "selected" : ""}>Todas</option><option value="entry" ${state.filters.kind === "entry" ? "selected" : ""}>Entradas</option><option value="expense" ${state.filters.kind === "expense" ? "selected" : ""}>Pagamentos</option></select></div>
              <div class="reference-tx-list" role="list">${renderDashboardRecentItems()}</div>
            </article>

            <aside class="reference-side-stack">
              ${renderDashboardCardPanel()}
              <article class="panel reference-projection"><span class="reference-projection-icon" aria-hidden="true">◎</span><div><strong>Projeção do mês</strong><p>${incomeBaseMinor ? `Você comprometeu ${commitmentPercent}% do que entrou e ainda é esperado. ` : "Ainda não há renda registrada. "}${summary.projectedFreeMinor >= 0 ? `Restam ${toBRL(summary.projectedFreeMinor / 100)} após os compromissos.` : `Faltam ${toBRL(Math.abs(summary.projectedFreeMinor) / 100)} para cobrir os compromissos.`}</p></div></article>
              <article class="panel reference-upcoming"><div class="reference-section-head"><div><h2>Próximos compromissos</h2><p>O que vence a partir deste mês</p></div></div><div>${renderDashboardCommitments(commitments)}</div></article>
            </aside>
          </section>

          <section class="panel reference-spend-card">${renderDashboardCategoryBars()}</section>
        </section>
      `;
    }

    function getFinanceUnifiedEntryRows(){
      const selectedKey = getMonthKey();
      const pending = getEntriesForMonth()
        .map(item => {
          if(item.status !== "received") return item;
          const receivedKey = keyFromDate(item.receivedDate || item.plannedDate);
          if(receivedKey === selectedKey) return null;
          return {
            ...item,
            status:"pending",
            receivedDate:"",
            projectedOccurrence:true
          };
        })
        .filter(Boolean);
      const received = getReceivedEntriesForMonth();
      return uniqueRows(pending.concat(received), item =>
        `${item.id}|${item.cashDate || item.receivedDate || item.plannedDate}|${number(item.displayValue ?? item.value)}`
      );
    }

    function getFinanceUnifiedExpenseRows(){
      const pending = getManualExpensesForMonth()
        .filter(item => !item.cardId && item.status !== "paid");
      const paid = getPaidExpensesForMonth()
        .filter(item => !item.cardId && !item.virtual && item.status === "paid");
      return uniqueRows(pending.concat(paid), item =>
        `${item.id}|${item.cashDate || item.paymentDate || item.dueDate}|${number(item.displayValue ?? item.value)}`
      );
    }

    function financeUnifiedSearchMatches(item = {}, extraValues = []){
      const search = normalizeText(state.filters.search);
      if(!search) return true;
      return [
        item.description,
        item.category,
        item.subcategory,
        item.paymentMethod,
        item.notes,
        ...extraValues
      ].some(value => normalizeText(value).includes(search));
    }

    function financeBlockTextColor(color, preferred = ""){
      if(/^#[0-9a-f]{6}$/i.test(preferred)) return preferred;
      const safe = safeHexColor(color, "#4F7CFF").slice(1);
      const red = parseInt(safe.slice(0,2), 16);
      const green = parseInt(safe.slice(2,4), 16);
      const blue = parseInt(safe.slice(4,6), 16);
      return (red * .299 + green * .587 + blue * .114) > 168 ? "#080808" : "#FFFFFF";
    }

    function financeUnifiedRowDate(row, kind){
      if(kind === "entry") return row.cashDate || row.receivedDate || row.plannedDate || "";
      if(kind === "expense") return row.cashDate || row.paymentDate || row.dueDate || "";
      return row.purchase?.date || row.inst?.dueDate || "";
    }

    function financeBlockSupports(category, direction){
      const type = normalizeCategoryType(category?.type);
      return type === "ambos" || type === direction;
    }

    function financeBlockCategoryForName(name, direction){
      const normalized = normalizeText(name);
      return data.categories.find(category =>
        category.financeBlock === true
        && financeBlockSupports(category, direction)
        && normalizeText(category.name) === normalized
      ) || null;
    }

    function getCardFutureInvoicePreview(card, count = 3){
      return Array.from({length:count}, (_,index) => {
        const position = monthPositionFromOffset(state.month, state.year, index + 1);
        const stats = getCardStats(card, position.monthIndex, position.year);
        return {
          ...position,
          value:stats.invoice,
          dueDate:getCardBillingDates(card, position.monthIndex, position.year).dueDate
        };
      });
    }

    function buildFinanceUnifiedModel(){
      const filterKind = state.filters.kind || "all";
      const search = normalizeText(state.filters.search);
      const allEntries = getFinanceUnifiedEntryRows();
      const allExpenses = getFinanceUnifiedExpenseRows();
      const cardSets = data.cards.map(card => {
        const invoiceRow = buildCardDrawerInvoiceRow(findInvoiceByCardMonth(card.id, getMonthKey()));
        return {
          card,
          rows:invoiceRow ? [invoiceRow, ...getCardDrawerRowsForMonth(card.id)] : getCardDrawerRowsForMonth(card.id)
        };
      });
      const primaryBlocks = [];
      const cardBlocks = [];
      const customCategories = data.categories.filter(category => category.financeBlock === true);

      if(filterKind !== "expense"){
        const rows = allEntries
          .filter(item => !financeBlockCategoryForName(item.category, "entrada"))
          .filter(item => financeUnifiedSearchMatches(item, ["entrada", "receita"]))
          .sort((a,b) => financeUnifiedRowDate(a, "entry").localeCompare(financeUnifiedRowDate(b, "entry")));
        if(rows.length){
          primaryBlocks.push({
            kind:"entry",
            eyebrow:"Bloco de entradas",
            title:"Entradas",
            color:"#008F42",
            textColor:"#FFFFFF",
            totalLabel:"Total de entradas",
            total:rows.reduce((sum,item) => sum + number(item.displayValue ?? item.value), 0),
            rows,
            addAction:"add-entry",
            addLabel:"Adicionar entrada",
            emptyTitle:"Nenhuma entrada neste mês",
            emptyText:"Registre salários, Pix ou outras receitas.",
            footerText:"Receitas previstas e recebidas no período",
            deleteKind:"entries",
            deleteName:"Entradas"
          });
        }
      }

      customCategories.forEach(category => {
        const supportsEntries = financeBlockSupports(category, "entrada");
        const supportsExpenses = financeBlockSupports(category, "saida");
        const entryRows = supportsEntries && filterKind !== "expense"
          ? allEntries
            .filter(item => normalizeText(item.category) === normalizeText(category.name))
            .filter(item => financeUnifiedSearchMatches(item, ["entrada", "receita", category.name]))
            .map(item => ({...item,financeKind:"entry"}))
          : [];
        const expenseRows = supportsExpenses && filterKind !== "entry"
          ? allExpenses
            .filter(item => normalizeText(item.category || "Despesas") === normalizeText(category.name))
            .filter(item => financeUnifiedSearchMatches(item, ["saída", "gasto", category.name]))
            .map(item => ({...item,financeKind:"expense"}))
          : [];
        const rows = entryRows.concat(expenseRows)
          .sort((a,b) => financeUnifiedRowDate(a, a.financeKind).localeCompare(financeUnifiedRowDate(b, b.financeKind)));
        if(search && !rows.length) return;
        const type = normalizeCategoryType(category.type);
        const kind = type === "ambos" ? "mixed" : (type === "entrada" ? "entry" : "expense");
        const entryTotal = entryRows.reduce((sum,item) => sum + number(item.displayValue ?? item.value), 0);
        const expenseTotal = expenseRows.reduce((sum,item) => sum + number(item.displayValue ?? item.value), 0);
        const color = safeHexColor(category.color, kind === "entry" ? "#008F42" : "#A94D4D");
        primaryBlocks.push({
          kind,
          eyebrow:type === "ambos" ? "Bloco de entradas e saídas" : (type === "entrada" ? "Bloco de entradas" : "Bloco de despesas"),
          title:category.name,
          color,
          textColor:financeBlockTextColor(color),
          totalLabel:type === "ambos" ? "Saldo do bloco" : (type === "entrada" ? "Total de entradas" : "Total do bloco"),
          total:type === "ambos" ? round(entryTotal - expenseTotal) : round(entryTotal + expenseTotal),
          rows,
          addAction:type === "ambos" ? "add-block-item" : (type === "entrada" ? "add-entry" : "add-expense"),
          addId:category.id,
          addCategory:category.name,
          addLabel:type === "ambos" ? "Adicionar lançamento" : (type === "entrada" ? "Adicionar entrada" : "Adicionar saída"),
          emptyTitle:type === "ambos" ? "Nenhum lançamento neste bloco" : (type === "entrada" ? "Nenhuma entrada neste bloco" : "Nenhuma saída neste bloco"),
          emptyText:type === "ambos" ? "Adicione uma entrada ou uma saída para começar." : (type === "entrada" ? "Adicione uma receita para começar." : "Adicione uma despesa para começar."),
          footerText:type === "ambos" ? "Entradas e saídas reunidas pela mesma tag" : (type === "entrada" ? "Receitas previstas e recebidas do período" : "Despesas pagas e pendentes do período"),
          footerAction:"edit-finance-block",
          footerActionId:category.id,
          footerActionLabel:"Editar bloco",
          deleteKind:"category",
          deleteId:category.id,
          deleteName:category.name
        });
      });

      if(filterKind !== "entry"){
        const expenseGroups = new Map();
        allExpenses.forEach(item => {
          if(financeBlockCategoryForName(item.category || "Despesas", "saida")) return;
          const category = item.category || "Despesas";
          if(!expenseGroups.has(category)) expenseGroups.set(category, []);
          expenseGroups.get(category).push(item);
        });
        expenseGroups.forEach((items, category) => {
          const rows = items
            .filter(item => financeUnifiedSearchMatches(item, ["saída", "gasto", category]))
            .sort((a,b) => financeUnifiedRowDate(a, "expense").localeCompare(financeUnifiedRowDate(b, "expense")));
          if(search && !rows.length) return;
          const categoryRecord = data.categories.find(item => item.name === category);
          const color = safeHexColor(categoryRecord?.color, "#A94D4D");
          primaryBlocks.push({
            kind:"expense",
            eyebrow:"Bloco de despesas",
            title:category,
            color,
            textColor:financeBlockTextColor(color),
            totalLabel:"Total do bloco",
            total:rows.reduce((sum,item) => sum + number(item.displayValue ?? item.value), 0),
            rows,
            addAction:"add-expense",
            addLabel:"Adicionar saída",
            emptyTitle:"Nenhuma saída neste bloco",
            emptyText:"Adicione uma despesa para começar.",
            footerText:"Despesas pagas e pendentes do período",
            footerAction:categoryRecord ? "edit-finance-block" : "",
            footerActionId:categoryRecord?.id || "",
            footerActionLabel:categoryRecord ? "Editar bloco" : "",
            deleteKind:"expense",
            deleteId:categoryRecord?.id || "",
            deleteName:category
          });
        });
        const firstUse = !hasFinancialData() && !data.settings.financeStarterBlockDeleted;
        if(!expenseGroups.size && !search && firstUse){
          primaryBlocks.push({
            kind:"expense",
            eyebrow:"Bloco de despesas",
            title:"Despesas",
            color:"#A94D4D",
            textColor:"#FFFFFF",
            totalLabel:"Total do bloco",
            total:0,
            rows:[],
            addAction:"add-expense",
            addLabel:"Adicionar saída",
            emptyTitle:"Nenhuma saída neste mês",
            emptyText:"Registre contas, Pix, débito ou dinheiro.",
            footerText:"As despesas serão organizadas por categoria",
            deleteKind:"starter",
            deleteName:"Despesas"
          });
        }

        cardSets.forEach(({card,rows:allRows}) => {
          const cardVisual = getCardVisual(card);
          const cardMatchesSearch = search && normalizeText(card.name).includes(search);
          const rows = allRows
            .filter(row => cardMatchesSearch || financeUnifiedSearchMatches(row.purchase, [
              card.name,
              row.inst?.label,
              row.inst?.transactionLabel
            ]))
            .sort((a,b) => financeUnifiedRowDate(a, "card").localeCompare(financeUnifiedRowDate(b, "card")));
          if(search && !rows.length) return;
          const stats = getCardStats(card);
          const billingDates = getCardBillingDates(card);
          cardBlocks.push({
            kind:"card",
            eyebrow:"Cartão de crédito",
            title:card.name,
            institutionMark:renderCardInstitutionMark(cardVisual),
            color:safeHexColor(cardVisual.color, "#6C2AB0"),
            textColor:financeBlockTextColor(cardVisual.color, cardVisual.text),
            totalLabel:"Fatura do mês",
            total:stats.invoice,
            rows,
            displayCount:rows.length,
            addAction:"add-purchase",
            addId:card.id,
            addLabel:"Adicionar compra",
            invoiceAction:"edit-invoice-override",
            invoiceCardId:card.id,
            invoiceMonthKey:getMonthKey(),
            invoiceLabel:"Adicionar fatura",
            emptyTitle:"Sem gastos nesta fatura",
            emptyText:"Adicione uma compra ou cadastre um valor de fatura.",
            footerText:"O limite utilizado considera faturas anteriores, o mês atual e todos os meses futuros ainda não pagos.",
            footerAction:"open-card",
            footerActionId:card.id,
            footerActionLabel:"Ver fatura",
            footerSecondaryAction:"edit-card",
            footerSecondaryActionId:card.id,
            footerSecondaryActionLabel:"Editar cartão",
            deleteKind:"card",
            deleteId:card.id,
            deleteName:card.name,
            cardMetrics:{
              ...stats,
              limit:Math.max(0,number(card.limit)),
              closingDate:billingDates.closingDate,
              dueDate:billingDates.dueDate,
              forecast:getCardFutureInvoicePreview(card)
            }
          });
        });
      }

      const allBlocks = primaryBlocks.concat(cardBlocks);
      const activeBlocks = allBlocks.filter(block => (block.displayCount ?? block.rows.length) > 0).length;
      const totalRows = allBlocks.reduce((sum,block) => sum + (block.displayCount ?? block.rows.length), 0);
      return {primaryBlocks,cardBlocks,activeBlocks,totalRows};
    }

    function renderFinanceEvolution(){
      const positions = forwardMonthWindow(12);
      const rows = positions.map(position => {
        const summary = getMonthSummary(data, position.key);
        const income = (summary.receivedMinor + summary.refundsMinor + summary.expectedIncomeMinor) / 100;
        const expenses = (summary.paidMinor + summary.committedMinor) / 100;
        return {
          ...position,
          income:round(income),
          expenses:round(expenses),
          due:round(summary.committedMinor / 100),
          balance:round(summary.projectedFreeMinor / 100)
        };
      });
      const max = Math.max(1, ...rows.flatMap(item => [Math.abs(item.income),Math.abs(item.expenses)]));
      const totalDue = round(forwardMonthWindow(MAX_RECURRING_PROJECTION_MONTHS)
        .reduce((total, position) => total + (getMonthSummary(data, position.key).billsMinor / 100), 0));
      return `
        <details class="finance-evolution">
          <summary>
            <span class="finance-evolution-copy"><strong>Evolução mensal das contas</strong><small>Gráfico de barras</small></span>
            <span class="finance-evolution-chevron" aria-hidden="true">⌄</span>
          </summary>
          <div class="finance-evolution-panel">
            <div class="finance-evolution-head">
              <div><h2>Entradas e saídas por mês</h2><p>Do mês selecionado em diante, sem incluir meses anteriores.</p></div>
              <div class="finance-evolution-total"><span>Total devido</span><strong class="${totalDue > 0 ? "negative" : "positive"}">${toBRL(totalDue)}</strong></div>
            </div>
            <div class="finance-evolution-bars" role="img" aria-label="Comparativo de entradas e saídas do mês selecionado em diante">
              ${rows.map(item => `
                <div class="finance-evolution-month ${item.key === getMonthKey() ? "is-current" : ""}" title="${escapeHtml(item.label)}: entradas ${toBRL(item.income)}, saídas ${toBRL(item.expenses)}, saldo ${toBRL(item.balance)}">
                  <div class="finance-evolution-columns">
                    <i style="height:${item.income ? Math.max(4,(Math.abs(item.income) / max) * 100) : 0}%"></i>
                    <i style="height:${item.expenses ? Math.max(4,(Math.abs(item.expenses) / max) * 100) : 0}%"></i>
                  </div>
                  <small>${escapeHtml(item.label)}</small>
                </div>
              `).join("")}
            </div>
          </div>
        </details>
      `;
    }

    function renderFinanceBlockRow(row, kind){
      const rowKind = kind === "mixed" ? (row.financeKind || "expense") : kind;
      let item = row;
      let date = "";
      let description = "";
      let category = "Outros";
      let subcategory = "";
      let value = 0;
      let typeLabel = "";
      let typeClass = "";
      let completed = false;
      let editAction = "";
      let deleteAction = "";
      let checkAction = "";
      let checkStatus = "";
      let extraAttributes = "";

      if(rowKind === "entry"){
        date = financeUnifiedRowDate(item, rowKind);
        description = item.description;
        category = item.category || "Outros";
        value = number(item.displayValue ?? item.value);
        typeLabel = item.projectedOccurrence ? "Recorrente" : "Entrada";
        typeClass = "income";
        completed = item.status === "received";
        editAction = "edit-entry";
        deleteAction = "delete-entry";
        checkAction = item.projectedOccurrence ? "" : "mark-entry";
        checkStatus = completed ? "pending" : "received";
      }else if(rowKind === "expense"){
        date = financeUnifiedRowDate(item, rowKind);
        description = item.description;
        category = item.category || "Outros";
        subcategory = item.subcategory || "";
        value = number(item.displayValue ?? item.value);
        typeLabel = item.fixedInstallment
          ? "Fixa"
          : Number(item.installments || 1) > 1
            ? (item.installmentLabel || `${item.currentInstallment || 1}/${item.installments}`)
            : "Saída";
        completed = item.status === "paid";
        editAction = "edit-expense";
        deleteAction = "delete-expense";
        checkAction = "mark-expense";
        checkStatus = completed ? "pending" : "paid";
      }else{
        const purchase = row.purchase || {};
        const installment = row.inst || {};
        item = purchase;
        date = financeUnifiedRowDate(row, rowKind);
        description = purchase.description;
        category = purchase.category || "Cartão de Crédito";
        subcategory = purchase.subcategory || "";
        value = number(installment.value);
        typeLabel = row.source === "invoice"
          ? "Fatura"
          : installment.total > 1
            ? `${installment.number}/${installment.total}`
            : isCardPurchaseCredit(purchase)
              ? "Estorno"
              : "Cartão";
        typeClass = "card";
        completed = installment.status === "paid";
        if(row.source === "invoice"){
          editAction = "edit-invoice-override";
          deleteAction = "clear-invoice-override";
          checkAction = completed ? "reset-invoice-payment" : "pay-invoice-full";
          extraAttributes = ` data-card="${escapeHtml(purchase.cardId || "")}" data-month-key="${escapeHtml(purchase.monthKey || "")}"`;
        }else if(row.source === "expense"){
          editAction = "edit-expense";
          deleteAction = "delete-expense";
          checkAction = "mark-expense";
          checkStatus = completed ? "pending" : "paid";
        }else{
          editAction = "edit-purchase";
          deleteAction = "delete-purchase";
          checkAction = "mark-installment-paid";
          checkStatus = completed ? "pending" : "paid";
          extraAttributes = ` data-card="${escapeHtml(purchase.cardId || "")}" data-inst="${escapeHtml(installment.installmentKey || "")}"`;
        }
      }

      const id = escapeHtml(item.id || "");
      const valueClass = rowKind === "entry" || (rowKind === "card" && value < 0) ? "positive" : "";
      const checkLabel = rowKind === "entry"
        ? (completed ? "Marcar entrada como pendente" : "Marcar entrada como recebida")
        : (completed ? "Desmarcar pagamento" : "Marcar como pago");
      return `
        <tr>
          <td>${formatDate(date)}</td>
          <td>
            <div class="finance-block-description">
              <button type="button" class="finance-block-edit" data-action="${editAction}" data-id="${id}"${extraAttributes}>${escapeHtml(description || "Sem descrição")}</button>
              <button type="button" class="finance-block-delete" data-action="${deleteAction}" data-id="${id}"${extraAttributes} data-skip-confirm="true" aria-label="Excluir ${escapeHtml(description || "lançamento")}">×</button>
            </div>
          </td>
          <td><div class="finance-block-tags"><span class="finance-block-tag" title="${escapeHtml(category)}">${escapeHtml(category)}</span>${subcategory ? `<span class="finance-block-tag secondary" title="${escapeHtml(subcategory)}">${escapeHtml(subcategory)}</span>` : ""}</div></td>
          <td><span class="finance-data-block-value ${valueClass}">${toBRL(value)}</span></td>
          <td><span class="finance-block-kind ${typeClass}">${escapeHtml(typeLabel)}</span></td>
          <td>
            <button type="button" class="finance-block-check ${completed ? "is-complete" : ""}" ${checkAction ? `data-action="${checkAction}" data-id="${id}"${checkStatus ? ` data-status="${checkStatus}"` : ""}${extraAttributes}` : "disabled"} aria-label="${checkLabel}" title="${checkLabel}">${completed ? "✓" : ""}</button>
          </td>
        </tr>
      `;
    }

    function renderFinanceCardLimitPanel(metrics){
      if(!metrics) return "";
      const usageWidth = metrics.limit ? Math.min(100, Math.max(0, metrics.percent)) : 0;
      const alert = metrics.overLimit > 0
        ? `Limite excedido em ${toBRL(metrics.overLimit)}`
        : (metrics.overdue > 0 ? `${toBRL(metrics.overdue)} de faturas anteriores ainda comprometem o limite` : "");
      return `
        <div class="finance-card-limit-panel">
          <div class="finance-card-limit-head">
            <div><span>Limite utilizado</span><strong>${toBRL(metrics.used)}</strong></div>
            <div><span>Disponível</span><strong>${toBRL(metrics.available)}</strong></div>
          </div>
          <div class="finance-card-limit-track" role="progressbar" aria-label="${metrics.percent.toFixed(1)}% do limite utilizado: gastos em vermelho e limite disponível em verde" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.min(100, usageWidth).toFixed(1)}"><span class="finance-card-limit-used" style="width:${usageWidth}%" aria-hidden="true"></span></div>
          <div class="finance-card-limit-stats">
            <div class="finance-card-limit-stat"><span>Limite total</span><strong>${toBRL(metrics.limit)}</strong></div>
            <div class="finance-card-limit-stat"><span>Fatura do mês</span><strong>${toBRL(metrics.invoice)}</strong></div>
            <div class="finance-card-limit-stat future"><span>Próximas faturas</span><strong>${toBRL(metrics.future)}</strong></div>
            <div class="finance-card-limit-stat"><span>Uso do limite</span><strong>${metrics.percent.toFixed(1)}%</strong></div>
          </div>
          <div class="finance-card-calendar"><span>Fecha ${formatDate(metrics.closingDate)}</span><span>Vence ${formatDate(metrics.dueDate)}</span></div>
          <div class="finance-card-forecast" aria-label="Projeção das próximas faturas">${metrics.forecast.map(item => `<span>${escapeHtml(item.label)}: ${toBRL(item.value)} · vence ${formatDate(item.dueDate)}</span>`).join("")}</div>
          ${alert ? `<div class="finance-card-limit-alert">${escapeHtml(alert)}</div>` : ""}
        </div>
      `;
    }

    function renderFinanceDataBlock(block){
      const color = safeHexColor(block.color, "#4F7CFF");
      const textColor = financeBlockTextColor(color, block.textColor);
      const count = block.displayCount ?? block.rows.length;
      const hasRows = block.rows.length > 0;
      const totalClass = block.kind === "entry" || (block.kind === "mixed" && block.total >= 0) ? "positive" : (block.kind === "mixed" ? "negative" : "");
      const sectionId = block.sectionId ? ` id="${escapeHtml(block.sectionId)}"` : "";
      const addId = block.addId ? ` data-id="${escapeHtml(block.addId)}"` : "";
      const addCategory = block.addCategory ? ` data-category="${escapeHtml(block.addCategory)}"` : "";
      const invoiceAction = block.invoiceAction
        ? `<button type="button" class="finance-data-block-add" data-action="${block.invoiceAction}" data-card="${escapeHtml(block.invoiceCardId || "")}" data-month-key="${escapeHtml(block.invoiceMonthKey || getMonthKey())}">＋ ${escapeHtml(block.invoiceLabel || "Adicionar fatura")}</button>`
        : "";
      const footerAction = block.footerAction
        ? `<button type="button" class="finance-block-footer-action" data-action="${block.footerAction}" data-id="${escapeHtml(block.footerActionId || "")}">${escapeHtml(block.footerActionLabel || "Abrir")}</button>`
        : "";
      const footerSecondaryAction = block.footerSecondaryAction
        ? `<button type="button" class="finance-block-footer-action" data-action="${block.footerSecondaryAction}" data-id="${escapeHtml(block.footerSecondaryActionId || "")}">${escapeHtml(block.footerSecondaryActionLabel || "Editar")}</button>`
        : "";
      const deleteAction = block.deleteKind
        ? `<button type="button" class="finance-block-footer-action danger" data-action="delete-finance-block" data-block-kind="${escapeHtml(block.deleteKind)}" data-block-id="${escapeHtml(block.deleteId || "")}" data-block-name="${escapeHtml(block.deleteName || block.title)}">Excluir bloco</button>`
        : "";
      const footerActions = footerSecondaryAction || footerAction || deleteAction
        ? `<div class="finance-data-block-footer-actions">${footerSecondaryAction}${footerAction}${deleteAction}</div>`
        : "";
      const title = block.institutionMark
        ? `<div class="finance-card-title-line">${block.institutionMark}<h2>${escapeHtml(block.title)}</h2></div>`
        : `<h2>${escapeHtml(block.title)}</h2>`;
      return `
        <article class="finance-data-block"${sectionId} data-block-kind="${block.kind}" style="--block-color:${color};--block-text:${textColor}">
          <div class="finance-data-block-hero">
            <div class="finance-data-block-head">
              <div class="finance-data-block-title"><small>${escapeHtml(block.eyebrow)}</small>${title}</div>
              <div class="finance-data-block-total"><small>${escapeHtml(block.totalLabel)}</small><strong class="${totalClass}">${toBRL(block.total)}</strong></div>
            </div>
            ${renderFinanceCardLimitPanel(block.cardMetrics)}
            <div class="finance-data-block-actions">
              <span class="finance-data-block-count">${count} ${count === 1 ? "lançamento" : "lançamentos"}</span>
              <div class="finance-data-block-action-buttons"><button type="button" class="finance-data-block-add" data-action="${block.addAction}"${addId}${addCategory}>＋ ${escapeHtml(block.addLabel)}</button>${invoiceAction}</div>
            </div>
          </div>
          ${hasRows ? `
            <div class="finance-data-block-table-wrap">
              <table>
                <colgroup><col class="finance-block-col-date" /><col class="finance-block-col-description" /><col class="finance-block-col-tag" /><col class="finance-block-col-value" /><col class="finance-block-col-type" /><col class="finance-block-col-status" /></colgroup>
                <thead><tr><th>Data</th><th>Descrição</th><th>Tag</th><th>Valor</th><th>Tipo</th><th>Pago</th></tr></thead>
                <tbody>${block.rows.map(row => renderFinanceBlockRow(row, block.kind)).join("")}</tbody>
              </table>
            </div>
          ` : `<div class="finance-block-empty"><strong>${escapeHtml(block.emptyTitle)}</strong><span>${escapeHtml(block.emptyText)}</span></div>`}
          <footer class="finance-data-block-footer"><span>${escapeHtml(block.footerText)}</span>${footerActions}</footer>
        </article>
      `;
    }

    function renderFinanceUnifiedBlockGroups(model){
      const blocks = model.primaryBlocks.concat(model.cardBlocks.map((block,index) => ({
        ...block,
        sectionId:index === 0 ? "financeCardsSection" : ""
      })));
      return `
        ${blocks.length ? `<div class="finance-blocks-grid" aria-label="Entradas, despesas e cartões">${blocks.map(renderFinanceDataBlock).join("")}</div>` : `<div class="finance-block-results-empty"><strong>Nenhum lançamento encontrado</strong><span>Altere a busca ou limpe os filtros para ver os blocos do mês.</span></div>`}
        ${model.cardBlocks.length ? "" : `<span class="finance-card-scroll-anchor" id="financeCardsSection" aria-hidden="true"></span>`}
      `;
    }

          <summary class="finance-tag-chart-summary" aria-controls="financeExpenseTagContent">
            <div>
              <strong id="financeTagChartTitle">Gastos por tag</strong>
              <small>${totals.length ? `${totals.length} ${totals.length === 1 ? "tag" : "tags"} · ${toBRL(totalValue)}` : "Sem gastos classificados neste mês"}</small>
            </div>
            <span class="finance-tag-chart-toggle" aria-hidden="true">⌄</span>
          </summary>
          <div class="finance-tag-chart-body" id="financeExpenseTagContent" aria-labelledby="financeTagChartTitle">
            <p class="finance-tag-chart-period">${financeOsMonthName()} de ${state.year}</p>
            ${totals.length

          </div>
        </details>
      `;

    function renderDashboard(){
      const summary = getMonthSummary(data, getMonthKey());
      const model = buildFinanceUnifiedModel();
      const projectionEndKey = financeProjectionEndMonthKey();
      const projectionEndYear = Number(projectionEndKey.slice(0,4));
      const projectionLimitReached = financeProjectionLimitReached();
      return `
        <section class="finance-blocks-page" id="financeOverviewSection">
          ${renderFinanceEvolution()}

          <nav class="finance-block-month-nav" aria-label="Navegação mensal">
            <button type="button" data-action="change-month" data-delta="-1" aria-label="Mês anterior">‹</button>
            <div class="finance-block-period">
              <select id="monthSelect" aria-label="Mês">${MONTHS.map((month,index) => `<option value="${index}" ${index === state.month ? "selected" : ""} ${getMonthKey(index, state.year) > projectionEndKey ? "disabled" : ""}>${financeOsMonthName(index)}</option>`).join("")}</select>
              <input id="yearInput" type="number" min="2000" max="${projectionEndYear}" value="${state.year}" aria-label="Ano" />
            </div>
            <button type="button" data-action="change-month" data-delta="1" aria-label="Próximo mês" ${projectionLimitReached ? 'disabled aria-disabled="true" title="Limite de 24 meses alcançado"' : ""}>›</button>
          </nav>

          <section class="finance-block-summary" aria-label="Resumo de ${financeOsMonthName()} de ${state.year}">
            <article><small>Saldo projetado</small><strong class="${summary.projectedFreeMinor < 0 ? "negative" : "positive"}">${toBRL(summary.projectedFreeMinor / 100)}</strong><p>Entradas menos todas as saídas do mês</p></article>
            <article><small>Blocos no mês</small><strong>${model.activeBlocks}</strong><p>Blocos com movimentação no período</p></article>
            <article><small>Lançamentos no mês</small><strong>${model.totalRows}</strong><p>Itens pertencentes ao período</p></article>
          </section>

        const markAction = item.kind === "entry" ? "mark-entry" : item.kind === "expense" ? "mark-expense" : "";
        const markStatus = item.kind === "entry" ? "received" : "paid";
        const duplicateAction = item.kind === "entry" ? "duplicate-entry" : item.kind === "expense" ? "duplicate-expense" : "";
        const deleteAction = item.kind === "entry" ? "delete-entry" : item.kind === "expense" ? "delete-expense" : "";

          <article class="movement-timeline-item ${item.filterKind === "entry" ? "is-entry" : "is-expense"}" role="listitem">

              <strong>${escapeHtml(item.description)}</strong>

            <div class="movement-timeline-side">
              <strong class="${item.value >= 0 ? "positive" : "negative"}">${toBRL(item.value)}</strong>

                <button class="finance-os-mini-btn" data-action="${editAction}" data-id="${item.openId || item.id}">Abrir</button>

    function refreshFinanceFilteredContent(){
      const unifiedBlocks = document.getElementById("financeUnifiedBlocks");
      if(unifiedBlocks){
        unifiedBlocks.innerHTML = renderFinanceUnifiedBlockGroups(buildFinanceUnifiedModel());
        const chips = document.getElementById("movementFilterChips");
        if(chips) chips.innerHTML = renderMovementFilterChips();
        return true;
      }
      const movementBody = document.getElementById("movementTimelineBody");
      if(movementBody){
        const rows = financeOsRecentItems(40, true);
        movementBody.innerHTML = renderMovementTimelineRows(rows);
        const count = document.getElementById("movementResultCount");
        if(count) count.textContent = rows.length === 40 ? "40 movimentações mais recentes exibidas." : `${rows.length} ${rows.length === 1 ? "movimentação encontrada" : "movimentações encontradas"}.`;
        const chips = document.getElementById("movementFilterChips");
        if(chips) chips.innerHTML = renderMovementFilterChips();
        return true;
      }
      return false;

    function getExpensePurchaseDate(item, allowLegacyFallback = true){
      const purchaseDate = item.purchaseDate || item.date || item.purchase?.date || "";
      if(purchaseDate) return purchaseDate;
      if(allowLegacyFallback && !item.virtual) return item.dueDate || "";
      return "";
    }

    function getFinanceItemDate(item, type){
      if(type === "entry"){
        return item.status === "received"
          ? (item.cashDate || item.receivedDate || item.plannedDate)
          : item.plannedDate;
      }
      const purchaseDate = getExpensePurchaseDate(item, true);
      if(purchaseDate) return purchaseDate;
      return item.status === "paid"
        ? (item.cashDate || item.paymentDate || item.dueDate)
        : item.dueDate;
    }

    function matchesExpenseCardFilter(item){
      const selected = state.filters.card || "all";
      if(selected === "all") return true;
      if(selected === "none") return !item.cardId;
      return item.cardId === selected;
    }

    function applyCommonFilters(items, type){
      const search = state.filters.search.trim().toLowerCase();
      let result = items.filter(item => {
        const date = getFinanceItemDate(item, type);
        const filterDate = type === "expense" ? getExpensePurchaseDate(item, true) : date;
        const okSearch = !search || [item.description, item.category, item.subcategory]
          .some(value => String(value || "").toLowerCase().includes(search));
        const okCategory = state.filters.category === "all" || item.category === state.filters.category;
        const okStatus = state.filters.status === "all" || item.status === state.filters.status;
        const okDate = !state.filters.date || filterDate === state.filters.date;
        const okMethod = type !== "expense" || state.filters.method === "all" || item.paymentMethod === state.filters.method;
        const okCard = type !== "expense" || matchesExpenseCardFilter(item);
        const okSubcategory = type !== "expense" || matchesSubcategoryValue(item, state.filters.subcategory);
        return okSearch && okCategory && okStatus && okDate && okMethod && okCard && okSubcategory;
      });
      result.sort((a,b) => {
        if(state.filters.sort === "value") return number(b.displayValue ?? b.value) - number(a.displayValue ?? a.value);
        if(state.filters.sort === "category") return String(a.category).localeCompare(String(b.category));
        const da = getFinanceItemDate(a, type);
        const db = getFinanceItemDate(b, type);
        return String(da).localeCompare(String(db));
      });
      return result;
    }

      const pending = applyCommonFilters(getEntriesForMonth().filter(e=>e.status==="pending"), "entry");
      const received = applyCommonFilters(getReceivedEntriesForMonth(), "entry");

                <h2 class="panel-title">Entradas</h2>

            </div>

              ${filterBar("entry")}

                <div class="drop-col" data-drop-type="entry" data-status="pending">

                </div>
                <div class="drop-col" data-drop-type="entry" data-status="received">

    function getInvoicePurchaseRows(invoice){
      const rows = [];
      data.cardPurchases
        .filter(purchase => purchase.cardId === invoice.cardId)
        .forEach(purchase => {
          getPurchaseInstallments(purchase)
            .filter(inst => inst.key === invoice.monthKey)
            .forEach(inst => rows.push({source:"purchase", purchase, inst}));
      });
      getLinkedExpenseRowsForCard(invoice.cardId, MONTH_NUMBERS.indexOf(Number(invoice.monthKey.slice(5,7))), Number(invoice.monthKey.slice(0,4)))
        .forEach(row => rows.push({source:"expense", purchase:row.purchase, inst:row.inst}));
      return rows;
    }

    function hasInvoiceDetailFilters(){
      return Boolean(
        state.filters.search.trim()
        || state.filters.category !== "all"
        || state.filters.subcategory !== "all"
        || state.filters.date
      );
    }

    function invoicePurchaseRowMatchesFilters(row){
      const search = state.filters.search.trim().toLowerCase();
      const purchase = row.purchase || {};
      const okSearch = !search || [purchase.description, purchase.category, purchase.subcategory, cardPurchaseTransactionLabel(purchase)]
        .some(value => String(value || "").toLowerCase().includes(search));
      const okCategory = state.filters.category === "all" || purchase.category === state.filters.category;
      const okSubcategory = matchesSubcategoryValue(purchase, state.filters.subcategory);
      const okDate = !state.filters.date || getExpensePurchaseDate(purchase, false) === state.filters.date;
      return okSearch && okCategory && okSubcategory && okDate;
    }

    function getInvoiceFilteredPurchaseRows(invoice){
      const rows = getInvoicePurchaseRows(invoice);
      return hasInvoiceDetailFilters() ? rows.filter(invoicePurchaseRowMatchesFilters) : rows;
    }

    function invoiceMatchesExpenseFilters(invoice){
      if(!matchesExpenseCardFilter(invoice)) return false;
      const rows = getInvoicePurchaseRows(invoice);
      const search = state.filters.search.trim().toLowerCase();
      const card = data.cards.find(item => item.id === invoice.cardId);
      const okSearch = !search || [
        invoice.description,
        card?.name,
        ...rows.flatMap(row => [row.purchase.description, row.purchase.category, row.purchase.subcategory])
      ].some(value => String(value || "").toLowerCase().includes(search));
      const okCategory = state.filters.category === "all"
        || invoice.category === state.filters.category
        || rows.some(row => row.purchase.category === state.filters.category);
      const okSubcategory = state.filters.subcategory === "all" || rows.some(row => matchesSubcategoryValue(row.purchase, state.filters.subcategory));
      const okStatus = state.filters.status === "all"
        || (state.filters.status === "paid" ? invoice.status === "paid" : invoice.status !== "paid");
      const okMethod = state.filters.method === "all" || invoice.paymentMethod === state.filters.method;
      const okDate = !state.filters.date || rows.some(row => getExpensePurchaseDate(row.purchase, false) === state.filters.date);
      return okSearch && okCategory && okSubcategory && okStatus && okMethod && okDate;
    }

    function renderCardInvoiceGroups(){
      const invoices = getVirtualInvoicesForMonth().filter(invoiceMatchesExpenseFilters);
      if(!invoices.length) return "";
      return `
        <section class="card-invoice-groups">
          <div class="finance-os-head invoice-groups-head">
            <div>
              <h2>Faturas por cartão</h2>
              <p>Controle pagamento total, parcial e saldo renegociado por fatura.</p>

            ${invoices.map(renderCardInvoiceGroup).join("")}

    function renderCardInvoiceGroup(invoice){
      const card = data.cards.find(item => item.id === invoice.cardId);
      const summary = getInvoicePaymentSummary(invoice);
      const filteredRows = getInvoiceFilteredPurchaseRows(invoice);
      const detailFilterActive = hasInvoiceDetailFilters();
      const filteredTotal = round(filteredRows.reduce((sum, row) => sum + number(row.inst?.value), 0));
      const isOverridden = invoice.overrideEnabled === true;
      const remaining = summary.remainingAmount;
      const paid = summary.paidAmount;
      const statusLabel = invoice.status === "paid" ? "Pago total" : invoice.status === "partial" ? "Parcial / renegociado" : "Pendente";
      const statusClass = invoice.status === "paid" ? "positive" : invoice.status === "partial" ? "warning" : "negative";
      const installmentText = remaining > 0
        ? `${summary.renegotiationInstallments}x de ${toBRL(summary.renegotiationInstallmentValue)}`
        : "Sem saldo renegociado";
      const firstDue = remaining > 0 && summary.renegotiationFirstDueDate ? formatDate(summary.renegotiationFirstDueDate) : "-";
      return `
        <article class="card-invoice-card">
          <header class="card-invoice-top">
            <div>
              <span class="finance-os-chip ${invoice.status === "paid" ? "received" : "pending"}">${statusLabel}</span>
              ${isOverridden ? `<span class="finance-os-chip override">Fatura cadastrada</span>` : ""}
              <h3>${escapeHtml(card?.name || "Cartão")}</h3>
              <p>${escapeHtml(invoice.monthKey)} • vence ${formatDate(invoice.dueDate)}</p>
            </div>
            <strong class="${statusClass}">${toBRL(detailFilterActive ? filteredTotal : invoice.value)}</strong>
          </header>
          <div class="card-invoice-metrics">
            <div><small>Total da fatura</small><strong>${toBRL(invoice.value)}</strong></div>
            ${detailFilterActive ? `<div><small>Filtrado</small><strong>${toBRL(filteredTotal)}</strong></div>` : ""}
            <div><small>Pago</small><strong class="positive">${toBRL(paid)}</strong></div>
            <div><small>Restante</small><strong class="${remaining > 0 ? "negative" : "positive"}">${toBRL(remaining)}</strong></div>
            <div><small>Renegociação</small><strong>${installmentText}</strong></div>
          </div>
          <div class="card-invoice-foot">
            <span>Primeira parcela: <strong>${firstDue}</strong></span>
            <div class="item-actions">
              <button class="btn primary small" data-action="edit-invoice-override" data-card="${invoice.cardId}" data-month-key="${invoice.monthKey}">Adicionar fatura</button>

    function renderExpensesPage(){

          <div class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Saídas</h2>

              <button class="btn primary" data-action="add-expense">+ Nova saída</button>
            </div>
            <div class="panel-body">

              ${renderCardInvoiceGroups()}

                <div class="drop-col" data-drop-type="expense" data-status="pending">

    function renderEntryCard(item){
      const date = getFinanceItemDate(item, "entry");
      return `
        <article class="item-card" draggable="true" data-drag-type="entry" data-id="${item.id}">
          <div class="item-main">
            <div class="item-title">${escapeHtml(item.description)}</div>
            <div class="item-meta">
              <span class="tag green">● ${escapeHtml(item.category)}</span>
              <span class="tag ${item.status==="received"?"green":"yellow"}">${item.status==="received"?"Recebido":"Pendente"}</span>
              <span class="tag dark">📅 ${formatDate(date)}</span>
              ${item.occurrences > 1 ? `<span class="tag">×${item.occurrences}</span>` : ""}
            </div>
          </div>
          <div>
            <div class="item-value positive">${toBRL(item.displayValue ?? item.value)}</div>
            <div class="item-actions">
              ${item.status==="pending" ? `<button class="btn green small" data-action="mark-entry" data-id="${item.id}" data-status="received">Recebido</button>` : `<button class="btn soft small" data-action="mark-entry" data-id="${item.id}" data-status="pending">Pendente</button>`}
              <button class="btn soft small" data-action="edit-entry" data-id="${item.id}">Editar</button>
              <button class="btn soft small" data-action="duplicate-entry" data-id="${item.id}">Duplicar</button>
              <button class="btn red small" data-action="delete-entry" data-id="${item.id}">Excluir</button>
            </div>
          </div>
        </article>
      `;
    }

    function renderExpenseCard(item){
      const cardName = item.cardId ? data.cards.find(c=>c.id===item.cardId)?.name : "";
      const date = getFinanceItemDate(item, "expense");
      const purchaseDate = getExpensePurchaseDate(item, true);
      const dueDate = item.dueDate || "";
      const primaryDateLabel = purchaseDate
        ? `Compra ${formatDate(purchaseDate)}`
        : item.partialPayment
          ? `Pago ${formatDate(date)}`
          : `Vence ${formatDate(date)}`;
      const statusLabel = item.status === "paid" ? "Pago" : item.status === "partial" ? "Parcial" : "Pendente";
      const statusTone = item.status === "paid" ? "green" : "yellow";
      const canTogglePayment = !item.partialPayment;
      const isCreditCardPurchase = item.source === "cardPurchase" && item.transactionType === "credit";
      return `
        <article class="item-card" draggable="true" data-drag-type="expense" data-id="${item.id}">
          <div class="item-main">
            <div class="item-title">${escapeHtml(item.description)}</div>
            <div class="item-meta">
              <span class="tag" style="background:${hexToSoft(getCategoryColor(item.category))};color:${getCategoryColor(item.category)}">● ${escapeHtml(item.category)}</span>
              ${getItemSubcategory(item) ? `<span class="tag green">Sub: ${escapeHtml(getItemSubcategory(item))}</span>` : ""}
              <span class="tag ${statusTone}">${statusLabel}</span>
              <span class="tag dark">${primaryDateLabel}</span>
              ${purchaseDate && dueDate && dueDate !== purchaseDate ? `<span class="tag">Vence ${formatDate(dueDate)}</span>` : ""}
              <span class="tag">${escapeHtml(item.paymentMethod || "outros")}</span>
              ${isCreditCardPurchase ? `<span class="tag green">Crédito / estorno</span>` : ""}
              ${item.fixedInstallment ? `<span class="tag dark">${escapeHtml(item.installmentLabel || "Parcela fixa")}</span>` : item.installments > 1 ? `<span class="tag dark">${item.installmentLabel || `${item.currentInstallment}/${item.installments}`}</span>` : item.occurrences > 1 ? `<span class="tag">×${item.occurrences}</span>` : ""}
              ${cardName ? `<span class="tag">💳 ${escapeHtml(cardName)}</span>` : ""}
              ${item.virtual ? `<span class="tag dark">automático</span>` : ""}
            </div>
          </div>
          <div>
            <div class="item-value ${isCreditCardPurchase ? "positive" : item.status==="paid"?"neutral":"negative"}">${isCreditCardPurchase ? "+ " : ""}${toBRL(isCreditCardPurchase ? Math.abs(number(item.displayValue ?? item.value)) : (item.displayValue ?? item.value))}</div>
            <div class="item-actions">
              ${canTogglePayment ? (item.status==="pending" ? `<button class="btn green small" data-action="mark-expense" data-id="${item.id}" data-status="paid">Marcar pago</button>` : `<button class="btn soft small" data-action="mark-expense" data-id="${item.id}" data-status="pending">Marcar pendente</button>`) : ""}
              ${item.virtual ? `<button class="btn soft small" data-action="open-card" data-id="${item.cardId}">Cartão</button>` : `<button class="btn soft small" data-action="edit-expense" data-id="${item.id}">Editar</button><button class="btn soft small" data-action="duplicate-expense" data-id="${item.id}">Duplicar</button><button class="btn red small" data-action="delete-expense" data-id="${item.id}">Excluir</button>`}
            </div>
          </div>
        </article>
      `;
    }

    function hexToSoft(hex){
      return hex ? `${hex}22` : "#2A2A2A";
    }
    function formatDate(date){
      if(!date) return "sem data";
      const [y,m,d] = date.split("-");
      return `${d}/${m}/${y}`;
    }

    function renderMiniCard(card){
      const s = getCardStats(card);
      const tone = s.percent >= 95 ? "danger" : s.percent >= 80 ? "warn" : "";
      const visual = getCardVisual(card);
      return `
        <div class="item-card">
          <div class="item-main">
            <div class="item-title"><span class="mini-card-mark" style="background:${visual.color};color:${visual.text}">${escapeHtml(visual.short)}</span>${escapeHtml(card.name)}</div>
            <div class="item-meta">
              <span class="tag dark">Fatura ${toBRL(s.invoice)}</span>
              <span class="tag">${escapeHtml(visual.brand.label)}</span>
              <span class="tag ${s.percent>=80?"red":"green"}">${s.percent.toFixed(0)}% usado</span>
            </div>
            <div class="progress ${tone}"><span style="width:${Math.min(100,s.percent)}%"></span></div>
          </div>
          <div>
            <div class="item-value">${toBRL(s.available)}</div>
            <div class="item-actions">
              <button class="btn soft small" data-action="open-card" data-id="${card.id}">Abrir</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderCardsPage(){
      return `
        <section class="page">
          <div class="panel">
            <div class="panel-header">
              <div>
                <h2 class="panel-title">Cartões de crédito</h2>
                <p class="panel-subtitle">Limite, fechamento, melhor dia de compra, fatura atual e parcelas futuras.</p>
              </div>
              <div class="toolbar" style="justify-content:flex-end">
                <button class="btn soft" data-action="import-nubank">Importar Nubank</button>
                <button class="btn primary" data-action="add-card">+ Novo cartão</button>
              </div>
            </div>
            <div class="panel-body">
              <div class="card-grid">
                ${data.cards.map(renderCreditCard).join("")}
              </div>
            </div>
          </div>
        </section>
