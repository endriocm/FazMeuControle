    function deleteFinanceBlock(kind, blockId = "", blockName = ""){
      const safeKind = String(kind || "");
      const name = String(blockName || "Bloco").trim() || "Bloco";
      const category = ["expense","category"].includes(safeKind)
        ? data.categories.find(item => item.id === blockId)
          || data.categories.find(item => normalizeText(item.name) === normalizeText(name))
        : null;
      const card = safeKind === "card" ? data.cards.find(item => item.id === blockId) : null;
      let confirmation = "";

      if(safeKind === "starter"){
        confirmation = "Excluir o bloco inicial de Despesas? Você poderá criar outro em Adicionar novo bloco.";
      }else if(safeKind === "entries"){
        confirmation = `Excluir o bloco Entradas e seus ${data.entries.length} lançamento(s) de todos os meses?`;
      }else if(["expense","category"].includes(safeKind)){
        const categoryName = category?.name || name;
        const entryCount = data.entries.filter(item => normalizeText(item.category || "Outros") === normalizeText(categoryName)).length;
        const expenseCount = data.expenses.filter(item => !item.cardId && normalizeText(item.category || "Despesas") === normalizeText(categoryName)).length;
        confirmation = `Excluir o bloco ${categoryName} e seus ${entryCount + expenseCount} lançamento(s) de todos os meses?`;
      }else if(card){
        const purchaseCount = data.cardPurchases.filter(item => item.cardId === card.id).length;
        const manualCount = data.expenses.filter(item => item.cardId === card.id).length;
        confirmation = `Excluir o bloco ${card.name}, o cartão e seus ${purchaseCount + manualCount} lançamento(s) de todos os meses?`;
      }else{
        return;
      }

      if(!confirm(confirmation)) return;
      const undoSnapshot = createUndoSnapshot();
      data.settings.financeStarterBlockDeleted = true;

      if(safeKind === "entries"){
        data.entries = [];
        data.movements = (data.movements || []).filter(item => item.type !== "income");
        data.expectedItems = (data.expectedItems || []).filter(item => item.direction !== "income");
        data.recurrenceRules = (data.recurrenceRules || []).filter(item => item.direction !== "income");
      }else if(["expense","category"].includes(safeKind)){
        const categoryName = category?.name || name;
        data.entries = data.entries.filter(item => normalizeText(item.category || "Outros") !== normalizeText(categoryName));
        data.expenses = data.expenses.filter(item => item.cardId || normalizeText(item.category || "Despesas") !== normalizeText(categoryName));
        if(category) category.financeBlock = false;
      }else if(safeKind === "card" && card){
        data.cards = data.cards.filter(item => item.id !== card.id);
        data.cardPurchases = data.cardPurchases.filter(item => item.cardId !== card.id);
        data.expenses = data.expenses.filter(item => item.cardId !== card.id);
        Object.keys(data.invoicePayments || {}).forEach(key => {
          if(parseInvoicePaymentKey(key).cardId === card.id) delete data.invoicePayments[key];
        });
        if(data.settings.defaultCardId === card.id) delete data.settings.defaultCardId;
        if(activeDrawerCardId === card.id) activeDrawerCardId = "";
      }

      recordFinanceAudit("finance_block_deleted", {kind:safeKind, entityId:blockId, name});
      autosave();
      render();
      registerUndo(undoSnapshot, `Exclusão do bloco ${name}`);
      toast("Bloco excluído", {undo:true});
    }

    function attachDragAndDrop(){
      document.querySelectorAll("[draggable='true']").forEach(el => {
        el.addEventListener("dragstart", e => {
          el.classList.add("dragging");
          e.dataTransfer.setData("text/plain", JSON.stringify({id:el.dataset.id, type:el.dataset.dragType}));
        });
        el.addEventListener("dragend", () => el.classList.remove("dragging"));
      });
      document.querySelectorAll("[data-drop-type]").forEach(zone => {
        zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("over"); });
        zone.addEventListener("dragleave", () => zone.classList.remove("over"));
        zone.addEventListener("drop", e => {
          e.preventDefault();
          zone.classList.remove("over");
          try{
            const payload = JSON.parse(e.dataTransfer.getData("text/plain"));
            if(payload.type !== zone.dataset.dropType) return;
            if(payload.type === "entry") markEntry(payload.id, zone.dataset.status);
            if(payload.type === "expense") markExpense(payload.id, zone.dataset.status);
          }catch(err){}
        });
      });
    }

    function formatCompactBRL(value){
      const amount = number(value);
      const abs = Math.abs(amount);
      if(abs >= 1000000) return `R$ ${(amount / 1000000).toFixed(1).replace(".", ",")} mi`;
      if(abs >= 1000) return `R$ ${(amount / 1000).toFixed(1).replace(".", ",")} mil`;
      return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}).format(amount);
    }

      const theme = chartTheme();

        responsive:true,

        plugins:{
          legend:{ position:"bottom", labels:{ boxWidth:10, color:theme.muted, font:{family:"Inter", size:11, weight:"700"} } },
          tooltip:{ callbacks:{ label:(ctx) => `${ctx.dataset.label}: ${toBRL(ctx.parsed.y ?? ctx.parsed)}` } }

        scales:{
          x:{ ticks:{ color:theme.muted, maxRotation:0 }, grid:{ color:"rgba(255,255,255,.04)" } },
          y:{ ticks:{ color:theme.muted, callback:value => formatCompactBRL(value) }, grid:{ color:theme.line } }

    const MEMORY_BACKUP_MAGIC = "FAZ-MEU-CONTROLE-MEMORIA";
    const MEMORY_BACKUP_VERSION = 1;
    const MEMORY_BACKUP_KEY_SEED = "faz-meu-controle|memoria-criptografada|v1";

    function bytesToBase64Url(bytes){
      let binary = "";
      const chunkSize = 0x8000;
      for(let i = 0; i < bytes.length; i += chunkSize){
        binary += String.fromCharCode(...bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function base64UrlToBytes(value){
      const base64 = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, "=");
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    function textToBase64Url(value){
      return bytesToBase64Url(new TextEncoder().encode(value));
    }

    function base64UrlToText(value){
      return new TextDecoder().decode(base64UrlToBytes(value));
    }

    function wrapBackupCode(value, size = 76){
      return String(value).match(new RegExp(`.{1,${size}}`, "g"))?.join("\n") || "";
    }

    async function getMemoryBackupKey(){
      if(!window.crypto?.subtle) throw new Error("Criptografia indisponível neste navegador.");
      const seedBytes = new TextEncoder().encode(MEMORY_BACKUP_KEY_SEED);
      const hash = await crypto.subtle.digest("SHA-256", seedBytes);
      return crypto.subtle.importKey("raw", hash, { name:"AES-GCM" }, false, ["encrypt", "decrypt"]);
    }

    async function encryptMemoryBackup(payload){
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await getMemoryBackupKey();
      const encrypted = await crypto.subtle.encrypt(
        { name:"AES-GCM", iv },
        key,
        new TextEncoder().encode(JSON.stringify(payload))
      );
      const envelope = {
        v: MEMORY_BACKUP_VERSION,
        alg: "AES-GCM",
        iv: bytesToBase64Url(iv),
        data: bytesToBase64Url(new Uint8Array(encrypted))
      };
      return textToBase64Url(JSON.stringify(envelope));
    }

    async function decryptMemoryBackup(code){
      const envelope = JSON.parse(base64UrlToText(code));
      if(envelope.v !== MEMORY_BACKUP_VERSION || envelope.alg !== "AES-GCM") throw new Error("Versão de memória inválida.");
      const key = await getMemoryBackupKey();
      const decrypted = await crypto.subtle.decrypt(
        { name:"AES-GCM", iv: base64UrlToBytes(envelope.iv) },
        key,
        base64UrlToBytes(envelope.data)
      );
      const payload = JSON.parse(new TextDecoder().decode(decrypted));
      return payload.data;
    }

    function buildMemoryBackupText(code){
      return [
        MEMORY_BACKUP_MAGIC,
        `versao: ${MEMORY_BACKUP_VERSION}`,
        `gerado_em: ${new Date().toISOString()}`,
        "tipo: memoria-criptografada",
        "",
        "Copie ou guarde este arquivo TXT. O RumoFi lê o código abaixo para restaurar seus dados.",
        "",
        "codigo:",
        wrapBackupCode(code),
        ""
      ].join("\n");
    }

    function extractMemoryBackupCode(text){
      const backupText = String(text || "");
      if(!backupText.includes(MEMORY_BACKUP_MAGIC)) return "";
      const lines = backupText.split(/\r?\n/);
      const markerIndex = lines.findIndex(line => line.trim().toLowerCase() === "codigo:");
      if(markerIndex < 0) throw new Error("Código da memória não encontrado.");
      return lines.slice(markerIndex + 1).join("").replace(/\s/g, "");
    }

    function assertBackupData(imported){
      if(!isRecognizedFinancialData(imported)) throw new Error("Formato inválido");
      return imported;
    }

    function excelEscape(value){
      return String(value ?? "").replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    }

    function excelCurrency(value){
      return {excelType:"number", format:"currency", value:number(value)};
    }

    function excelPercent(value){
      return {excelType:"number", format:"percent", value:number(value) / 100};
    }

    function excelNumberValue(value){
      const numeric = Number(value);
      if(!Number.isFinite(numeric)) return "";
      return String(round(numeric));
    }

    function excelCell(cell){
      if(cell && typeof cell === "object" && cell.excelType === "number"){
        const numeric = excelNumberValue(cell.value);
        if(numeric === "") return "<td></td>";
        const formatClass = cell.format === "currency" ? "excel-currency" : cell.format === "percent" ? "excel-percent" : "excel-number";
        return `<td class="${formatClass}" x:num="${excelEscape(numeric)}">${excelEscape(numeric)}</td>`;
      }
      return `<td>${excelEscape(cell)}</td>`;
    }

    function excelTable(title, headers, rows){
      return `
        <h2>${excelEscape(title)}</h2>
        <table>
          <thead><tr>${headers.map(header => `<th>${excelEscape(header)}</th>`).join("")}</tr></thead>
          <tbody>
            ${rows.length ? rows.map(row => `<tr>${row.map(excelCell).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}">Sem dados</td></tr>`}
          </tbody>
        </table>
      `;
    }

    function xlsxArgb(hex){
      return `FF${String(hex || XLSX_THEME.white).replace("#", "").slice(0,6).toUpperCase()}`;

    function parseXlsxDate(value){
      if(!value) return "";
      if(value instanceof Date && Number.isFinite(value.getTime())) return value;
      const raw = String(value || "").trim();
      const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(iso) return new Date(Number(iso[1]), Number(iso[2]) - 1, Number(iso[3]));
      const parsed = new Date(raw);
      return Number.isFinite(parsed.getTime()) ? parsed : "";
    }
    function xlsxSheetName(name, usedNames){
      const fallback = "Planilha";
      const clean = String(name || fallback).replace(/[\\/?*\[\]:]/g, " ").replace(/\s+/g, " ").trim() || fallback;
      let base = clean.slice(0, 31);
      let candidate = base;
      let suffix = 2;
      while(usedNames.has(candidate.toLowerCase())){
        const tail = ` ${suffix}`;
        candidate = `${base.slice(0, Math.max(1, 31 - tail.length))}${tail}`;
        suffix += 1;
      }
      usedNames.add(candidate.toLowerCase());
      return candidate;
    }
    function xlsxSetCell(cell, payload, rowTone = "default"){
      const xlsxType = payload && typeof payload === "object" ? payload.xlsxType : "";
      const value = xlsxType ? payload.value : payload;
      let pendingNumFmt = "";
      cell.value = value === undefined || value === null ? "" : value;
      cell.alignment = {vertical:"middle", wrapText:true};
      cell.font = {name:"Inter", size:10, color:{argb:xlsxArgb(XLSX_THEME.text)}};
      cell.border = xlsxBorder(rowTone === "soft" ? "DCEBF1" : XLSX_THEME.line);
      if(rowTone === "soft") cell.fill = xlsxFill(XLSX_THEME.panelAlt);
      if(xlsxType === "currency"){
        pendingNumFmt = XLSX_CURRENCY_FORMAT;
        cell.alignment = {...cell.alignment, horizontal:"right"};
        if(number(value) < 0) cell.font = {...cell.font, color:{argb:xlsxArgb(XLSX_THEME.red)}};
      }
      if(xlsxType === "percent"){
        pendingNumFmt = XLSX_PERCENT_FORMAT;
        cell.alignment = {...cell.alignment, horizontal:"right"};
        if(number(value) < 0) cell.font = {...cell.font, color:{argb:xlsxArgb(XLSX_THEME.red)}};
      }
      if(xlsxType === "number"){
        pendingNumFmt = '#,##0.00;[Red](#,##0.00);-';
        cell.alignment = {...cell.alignment, horizontal:"right"};
      }
      if(xlsxType === "date"){
        pendingNumFmt = XLSX_DATE_FORMAT;
        cell.alignment = {...cell.alignment, horizontal:"center"};
      }
      if(pendingNumFmt) xlsxApplyNumFmt(cell, pendingNumFmt);

    function setXlsxColumnWidths(worksheet, widths){
      widths.forEach((width, index) => {

      });

    function writeXlsxTable(worksheet, title, headers, rows, options = {}){
      const startRow = options.startRow || Math.max(worksheet.rowCount + 2, 4);
      const startCol = options.startCol || 1;
      const headerRowIndex = title ? startRow + 1 : startRow;
      const columnCount = headers.length;
      if(title){
        worksheet.mergeCells(startRow, startCol, startRow, startCol + columnCount - 1);
        const titleCell = worksheet.getCell(startRow, startCol);
        titleCell.value = title;
        titleCell.fill = xlsxFill(options.titleFill || XLSX_THEME.panel);
        titleCell.font = {name:"Inter", size:12, bold:true, color:{argb:xlsxArgb(XLSX_THEME.dark)}};
        titleCell.alignment = {vertical:"middle"};
        worksheet.getRow(startRow).height = 24;
      }
      const headerRow = worksheet.getRow(headerRowIndex);
      headers.forEach((header, index) => {
        const cell = headerRow.getCell(startCol + index);
        cell.value = header;
        xlsxStyleHeaderCell(cell);
      });
      headerRow.height = 24;

      if(rows.length){
        rows.forEach((row, rowIndex) => {
          const excelRow = worksheet.getRow(headerRowIndex + rowIndex + 1);
          row.forEach((cellValue, cellIndex) => xlsxSetCell(excelRow.getCell(startCol + cellIndex), cellValue, rowIndex % 2 ? "soft" : "default"));
          excelRow.height = 22;
        });
      } else {
        const emptyRow = worksheet.getRow(headerRowIndex + 1);
        emptyRow.getCell(startCol).value = "Sem dados";
        emptyRow.getCell(startCol).font = {name:"Inter", italic:true, color:{argb:xlsxArgb(XLSX_THEME.muted)}};
        emptyRow.getCell(startCol).fill = xlsxFill(XLSX_THEME.panelAlt);
        emptyRow.getCell(startCol).border = xlsxBorder();
        if(columnCount > 1) worksheet.mergeCells(headerRowIndex + 1, startCol, headerRowIndex + 1, startCol + columnCount - 1);
      }

      const lastDataRow = headerRowIndex + Math.max(rows.length, 1);
      if(options.autoFilter !== false){
        worksheet.autoFilter = {
          from:{row:headerRowIndex, column:startCol},
          to:{row:headerRowIndex, column:startCol + columnCount - 1}
        };
      }
      setXlsxColumnWidths(worksheet, options.widths || headers.map(header => Math.min(32, Math.max(12, String(header).length + 4))));
      return {startRow, headerRow:headerRowIndex, endRow:lastDataRow};
    }
    function addXlsxMetricCard(worksheet, row, col, label, value, note, tone = XLSX_THEME.cyan){

    function groupXlsxTotals(rows, keyFn, valueFn){

    async function renderXlsxChartImage(config){
      if(typeof Chart === "undefined") return "";
      const width = config.width || 760;
      const height = config.height || 300;
      const canvas = document.createElement("canvas");
      canvas.width = width * 2;
      canvas.height = height * 2;
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      canvas.style.position = "fixed";
      canvas.style.left = "-9999px";
      canvas.style.top = "-9999px";
      document.body.appendChild(canvas);
      const isDoughnut = config.type === "doughnut" || config.type === "pie";
      const chart = new Chart(canvas.getContext("2d"), {
        type:config.type,
        data:{labels:config.labels, datasets:config.datasets},
        options:{
          responsive:false,
          animation:false,
          devicePixelRatio:2,
          plugins:{
            title:{display:Boolean(config.title), text:config.title || "", color:"#08111F", font:{size:18, weight:"bold"}},
            legend:{position:"bottom", labels:{color:"#334155", boxWidth:12, font:{size:12, weight:"600"}}}
          },
          scales:isDoughnut ? {} : {
            x:{ticks:{color:"#475569"}, grid:{display:false}},
            y:{ticks:{color:"#475569", callback:value => config.currency === false ? value : toBRL(value)}, grid:{color:"rgba(100,116,139,.18)"}}
          }
        }
      });
      chart.update();
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const image = canvas.toDataURL("image/png");
      chart.destroy();

    function importData(file){
      const reader = new FileReader();
      reader.onload = async () => {
        try{
          const text = String(reader.result || "");
          const memoryCode = extractMemoryBackupCode(text);
          const imported = assertBackupData(memoryCode ? await decryptMemoryBackup(memoryCode) : JSON.parse(text));
          ensureLocalMigrationBackup(localStorage, STORAGE_KEY, imported);
          data = mergeDefaultCategories(imported);
          invalidateFinanceCaches();
          state.month = Number(data.settings?.currentMonth ?? 0);
          state.year = Number(data.settings?.year ?? state.year);
          saveData(true); render();
          toast(memoryCode ? "Memória restaurada com sucesso" : "Backup JSON importado com sucesso");
        }catch(e){
          console.error("Falha ao importar memória:", e);
          alert("Não consegui importar este arquivo. Use uma memória TXT válida ou um backup JSON antigo.");
        }
      };
      reader.readAsText(file);
    }

    function parseCsvRows(text){
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;
      const input = String(text || "").replace(/^\uFEFF/, "");
      for(let i=0;i<input.length;i++){
        const char = input[i];
        const next = input[i+1];
        if(char === '"'){
          if(quoted && next === '"'){
            field += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if(char === "," && !quoted){
          row.push(field);
          field = "";
        } else if((char === "\n" || char === "\r") && !quoted){
          if(char === "\r" && next === "\n") i++;
          row.push(field);
          if(row.some(value => String(value).trim() !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }
      row.push(field);
      if(row.some(value => String(value).trim() !== "")) rows.push(row);
      return rows;
    }

    function parseNubankAmount(value){
      const raw = String(value || "").replace(/"/g, "").replace(/\s/g, "");
      const negative = raw.includes("-");
      const numeric = Number(raw.replace("-", "").replace(/\./g, "").replace(",", "."));
      if(!Number.isFinite(numeric)) return 0;
      return round(negative ? -numeric : numeric);
    }

    function getNubankInvoiceInfo(fileName = ""){
      const match = String(fileName).match(/(20\d{2})-(\d{2})-(\d{2})/);
      if(match){
        return {invoiceMonth:`${match[1]}-${match[2]}`, invoiceDueDate:`${match[1]}-${match[2]}-${match[3]}`};
      }
      const nubank = findOrCreateNubankCard();
      return {invoiceMonth:getMonthKey(), invoiceDueDate:dateFromDay(nubank.dueDay || 1)};
    }

    function findOrCreateNubankCard(){
      let card = data.cards.find(card => findCardTemplate(card).id === "nubank" || normalizeText(card.name).includes("nubank"));
      if(card) return card;
      card = {
        id:"card_nubank",
        name:"Nubank",
        templateId:"nubank",
        brand:"mastercard",
        color:"#6F35B8",
        limit:0,
        dueDay:1,
        closingDay:1,
        bestDay:2
      };
      if(data.cards.some(item => item.id === card.id)) card.id = uid("card");
      data.cards.push(card);
      return card;
    }

    function parseNubankInstallment(title){
      const match = String(title || "").match(/(?:parcela\s*)?(\d+)\s*\/\s*(\d+)/i);
      if(!match) return {current:1, total:1};
      return {current:Math.max(1, Number(match[1]) || 1), total:Math.max(1, Number(match[2]) || 1)};
    }

    function cleanNubankTitle(title){
      return String(title || "")
        .replace(/^\s*Parcelamento de Compra\s*-\s*/i, "")
        .replace(/\s*-\s*Parcela\s*\d+\s*\/\s*\d+\s*$/i, "")
        .replace(/\s*-\s*\d+\s*\/\s*\d+\s*$/i, "")
        .trim();
    }

    function inferNubankCategory(title){
      const text = normalizeText(title);
      if(/farmacia|drogaria|droga|panvel|sao joao/.test(text)) return "Farmácia";
      if(/mercado|supermercado|zaffari|carrefour|atacadao|atacad|assai|big|nacional/.test(text)) return "Mercado";
      if(/ifood|restaurante|alimen|cafe|panetteria|padaria|pao|jeronimo|macaron|burger|pizza|lanch/.test(text)) return "Alimentação";
      if(/uber|99|posto|combustivel|shell|ipiranga|petrobras/.test(text)) return /posto|combustivel|shell|ipiranga|petrobras/.test(text) ? "Combustível" : "Transporte";
      if(/americanas|lojas|loja|magazine|amazon|shopee|mercadolivre|mercado livre/.test(text)) return "Compras";
      if(/comissao|imposto|taxa|tarifa|valores mobiliarios/.test(text)) return "Impostos";
      if(/netflix|spotify|prime|assinatura|google|apple|microsoft/.test(text)) return "Assinaturas";
      return "Outros";
    }

    function inferNubankTransactionType(title, amount){
      const text = normalizeText(title);
      if(amount < 0 || /estorno|reembolso|credito|credit|cashback|ajuste/.test(text)) return "credit";
      return "debit";
    }

    function buildNubankImportKey({invoiceDueDate, rowIndex, date, title, amount, transactionType}){
      return ["nubank", invoiceDueDate, rowIndex, date, normalizeText(title), transactionType || "debit", amount.toFixed(2)].join("|");
    }

    function importNubankCsv(file){
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const rows = parseCsvRows(reader.result);
          if(rows.length < 2) throw new Error("Arquivo vazio.");
          const header = rows[0].map(name => normalizeText(name));
          const dateIndex = header.indexOf("date");
          const titleIndex = header.indexOf("title");
          const amountIndex = header.indexOf("amount");
          if(dateIndex < 0 || titleIndex < 0 || amountIndex < 0) throw new Error("Colunas esperadas: date, title, amount.");

          const card = findOrCreateNubankCard();
          const {invoiceMonth, invoiceDueDate} = getNubankInvoiceInfo(file.name);
          const importedKeys = new Set(data.cardPurchases.map(item => item.importedKey).filter(Boolean));
          let added = 0;
          let ignored = 0;
          let duplicated = 0;

          rows.slice(1).forEach((row, index) => {
            const date = String(row[dateIndex] || "").trim();
            const title = String(row[titleIndex] || "").trim();
            const rawAmount = parseNubankAmount(row[amountIndex]);
            const transactionType = inferNubankTransactionType(title, rawAmount);
            const amount = Math.abs(rawAmount);
            if(!date || !title || amount <= 0){
              ignored++;
              return;
            }
            const key = buildNubankImportKey({invoiceDueDate, rowIndex:index + 1, date, title, amount, transactionType});
            if(importedKeys.has(key)){
              duplicated++;
              return;
            }
            const installment = parseNubankInstallment(title);
            const description = cleanNubankTitle(title);
            const purchase = {
              id:uid("pur"),
              cardId:card.id,
              date,
              description,
              category:inferNubankCategory(title),
              subcategory:"",
              totalValue:amount,
              transactionType,
              type:installment.total > 1 ? "parcelado" : "à vista",
              installments:installment.total,
              currentInstallment:installment.current,
              installmentValue:amount,
              recurrence:"única",
              status:"open",
              paidInstallments:[],
              importedSource:"nubank_csv",
              importedFile:file.name,
              importedKey:key,
              importedInvoiceMonth:invoiceMonth,
              invoiceDueDate,
              notes:`Importado do arquivo Nubank ${file.name}.`
            };
            if(!purchase.subcategory) purchase.subcategory = inferSubcategoryForCardPurchase(purchase);
            data.cardPurchases.push(purchase);
            importedKeys.add(key);
            added++;
          });

          autosave();
          render();
          if(activeDrawerCardId === card.id) openCardDrawer(card.id, true);
          toast(`Nubank importado: ${added} lançamentos, ${ignored} ignorados, ${duplicated} duplicados`);
        }catch(error){
          console.error("Falha ao importar Nubank:", error);
          alert(`Não consegui importar este arquivo do Nubank. ${error.message}`);
        }
      };
      reader.readAsText(file);
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if(!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id || "";

      btn.closest("details")?.removeAttribute("open");
      if(action === "open-financial-planning"){
        financialPlanning.open(btn);
        return;
      }
      if(action === "toggle-theme"){
        const current = normalizeFinanceTheme(data.settings.themeMode);
        applyFinanceTheme(current === "dark" ? "light" : "dark", true);
        render();
        return;
      }
      if(action === "tab"){ navigateFinanceTab(btn.dataset.tab); return; }
      if(action === "change-month"){
        const next = new Date(state.year, state.month + Number(btn.dataset.delta || 0), 1);
        setFinanceVisibleMonth(next.getMonth(), next.getFullYear(), true);
        saveViewStateLocally();
        render();
        return;
      }
      if(action === "select-month"){
        setFinanceVisibleMonth(
          Number(btn.dataset.month ?? state.month),
          Number(btn.dataset.year ?? state.year),
          true
        );
        saveViewStateLocally();
        render();
        return;
      }
      if(action === "movement-filter"){
        state.filters.kind = btn.dataset.kind || "all";
        if(!refreshFinanceFilteredContent()) render();
        return;
      }
      if(action === "clear-finance-filters"){
        state.filters = { search:"", category:"all", subcategory:"all", status:"all", date:"", method:"all", card:"all", sort:"date", kind:"all" };
        if(!refreshFinanceFilteredContent()) render();
        toast("Filtros limpos");
        return;
      }
      if(action === "close-modal"){ closeModal(); return; }
      if(action === "close-drawer"){ closeDrawer(); return; }
      if(action === "undo-last"){ undoLastAction(); return; }
      if(action === "add-invoice-month-row"){ addInvoiceBatchMonthRow(); return; }
      if(action === "remove-invoice-month-row"){ removeInvoiceBatchMonthRow(btn); return; }
      if(action === "select-card-invoice-month"){
        const position = financeMonthPositionFromKey(btn.dataset.monthKey);
        if(!position) return;
        setFinanceVisibleMonth(position.monthIndex, position.year, true);
        saveViewStateLocally();
        render();
        openCardDrawer(btn.dataset.card, true);
        return;
      }
      if(action === "investment-view"){
        state.investmentView=btn.dataset.view === "market" ? "market" : "simulator";
        if(state.investmentView === "market" && state.marketComparison.status === "idle" && marketSelectionHasContent()) requestMarketComparison();
        else render();
        return;
      }
      if(action === "toggle-fixed-income-rates"){
        state.investmentRatesOpen=!state.investmentRatesOpen;
        btn.setAttribute("aria-expanded",String(state.investmentRatesOpen));
        const label=btn.querySelector("[data-investment-rate-toggle-label]");
        const editor=document.getElementById("fixedIncomeRateEditor");
        if(label) label.textContent=state.investmentRatesOpen?"Recolher taxas dos títulos":"Editar taxas dos títulos";
        if(editor) editor.hidden=!state.investmentRatesOpen;
        return;
      }
      if(action === "investment-journey"){
        document.getElementById(btn.dataset.target || "investmentScenarioChapter")?.scrollIntoView({behavior:"smooth",block:"start"});
        return;
      }
      if(action === "investment-chart-mode"){
        state.investmentChartMode=btn.dataset.mode === "return" ? "return" : "money";
        render();
        requestAnimationFrame(()=>document.getElementById("investmentEvolutionChapter")?.scrollIntoView({behavior:"auto",block:"start"}));
        return;
      }
      if(action === "investment-chart-filter"){ toggleFixedIncomeChartScenario(btn.dataset.scenario || "all"); return; }
      if(action === "select-market-symbol"){ addMarketSymbol(btn.dataset.symbol || "",btn.dataset.symbolTarget || "comparison"); return; }
      if(action === "add-market-symbol"){ addMarketSymbol(btn.dataset.symbol || "",btn.dataset.symbolTarget || "comparison"); return; }
      if(action === "remove-market-symbol"){ removeMarketSymbol(btn.dataset.symbol || "",btn.dataset.symbolTarget || "comparison"); return; }
      if(action === "select-market-benchmark"){ selectMarketBenchmark(btn.dataset.benchmark || "CDI"); return; }
      if(action === "open-market-basket"){ openMarketBasket(); return; }
      if(action === "delete-market-basket"){ deleteMarketBasket(); return; }
      if(action === "refresh-market-comparison"){ requestMarketComparison(); return; }
      if(action === "equal-market-allocations"){ resetMarketAllocations(); render(); return; }
      if(action === "add-investment"){ openInvestmentModal(); return; }
      if(action === "edit-investment"){ openInvestmentModal(id); return; }
      if(action === "update-investment"){ openInvestmentUpdateModal(id); return; }
      if(action === "delete-investment"){ deleteInvestment(id); return; }
      if(action === "view-investment-history"){ state.investmentHistoryId=id; render(); requestAnimationFrame(()=>document.getElementById("investmentHistoryChapter")?.scrollIntoView({behavior:"smooth",block:"start"})); return; }
      if(action === "scroll-investment-simulator"){ document.getElementById("investmentSimulatorChapter")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }

      if(action === "delete-finance-block"){
        deleteFinanceBlock(btn.dataset.blockKind, btn.dataset.blockId, btn.dataset.blockName);
        return;
      }

      if(action === "add-entry") openEntryModal("", btn.dataset.category || "", {quick:btn.dataset.quick === "true"});
      if(action === "edit-entry") openEntryModal(id);
      if(action === "duplicate-entry") duplicateById(data.entries, id, "ent");
      if(action === "delete-entry") deleteById(data.entries, id, "entrada", btn.dataset.skipConfirm === "true");
      if(action === "mark-entry") markEntry(id, btn.dataset.status);

      if(action === "add-expense") openExpenseModal("", btn.dataset.category || "", {quick:btn.dataset.quick === "true"});
      if(action === "edit-expense") openExpenseModal(id);
      if(action === "duplicate-expense") duplicateById(data.expenses, id, "exp");
      if(action === "delete-expense") deleteById(data.expenses, id, "saída", btn.dataset.skipConfirm === "true");
      if(action === "mark-expense") markExpense(id, btn.dataset.status);
      if(action === "pay-invoice-full") payInvoiceFull(btn.dataset.card, btn.dataset.monthKey);
      if(action === "open-invoice-payment") openInvoicePaymentModal(btn.dataset.card, btn.dataset.monthKey);
      if(action === "reset-invoice-payment") resetInvoicePayment(btn.dataset.card, btn.dataset.monthKey);
      if(action === "edit-invoice-override") openInvoiceOverrideModal(btn.dataset.card, btn.dataset.monthKey);
      if(action === "clear-invoice-override") clearInvoiceOverride(btn.dataset.card, btn.dataset.monthKey);

      if(action === "add-card") openCardModal();
      if(action === "add-card-purchase") openQuickCardPurchase();
      if(action === "edit-card") openCardModal(id);
      if(action === "open-card") openCardDrawer(id);
      if(action === "delete-card-manuals") deleteCardManualLaunches(id);
      if(action === "delete-card"){
        if(confirm("Excluir este cartão e seus lançamentos?")){
          const undoSnapshot = createUndoSnapshot();
          data.cards = data.cards.filter(c=>c.id!==id);
          data.cardPurchases = data.cardPurchases.filter(p=>p.cardId!==id);
          recordFinanceAudit("card_deleted", {entityId:id});
          autosave(); render(); registerUndo(undoSnapshot, "Exclusão do cartão"); toast("Cartão excluído", {undo:true});
        }
      }

      if(action === "add-purchase") openPurchaseModal(id);
      if(action === "edit-purchase") openPurchaseModal(btn.dataset.card || activeDrawerCardId, id);
      if(action === "duplicate-purchase"){
        duplicateById(data.cardPurchases, id, "pur");
        if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true);
      }
      if(action === "delete-purchase"){
        if(btn.dataset.skipConfirm === "true" || confirm("Excluir esta compra?")){
          const undoSnapshot = createUndoSnapshot();
          data.cardPurchases = data.cardPurchases.filter(p=>p.id!==id);
          recordFinanceAudit("card_purchase_deleted", {entityId:id});
          autosave(); render(); if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true); registerUndo(undoSnapshot, "Exclusão da compra"); toast("Compra excluída", {undo:true});
        }
      }
      if(action === "mark-installment-paid"){
        const p = data.cardPurchases.find(x=>x.id===id);
        if(p){
          const undoSnapshot = createUndoSnapshot();
          const installmentKey = btn.dataset.inst;
          const nextStatus = btn.dataset.status === "pending" ? "pending" : "paid";
          const allBeforeChange = getPurchaseInstallments(p);
          const paidInstallments = new Set(p.paidInstallments || []);
          if(p.status === "paid") allBeforeChange.forEach(inst => paidInstallments.add(inst.installmentKey));
          if(nextStatus === "paid") paidInstallments.add(installmentKey);
          else paidInstallments.delete(installmentKey);
          p.paidInstallments = [...paidInstallments];
          p.status = "open";
          const all = getPurchaseInstallments(p);
          if(all.every(inst => inst.status === "paid" || p.paidInstallments.includes(inst.installmentKey))) p.status = "paid";
          recordFinanceAudit("card_installment_status_changed", {entityId:id, installment:installmentKey, status:nextStatus});
          autosave(); render(); if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true); registerUndo(undoSnapshot, "Alteração da parcela"); toast(nextStatus === "paid" ? "Parcela marcada como paga" : "Parcela voltou para pendente", {undo:true});
        }
      }
      if(action === "mark-purchase-paid"){
        const p = data.cardPurchases.find(x=>x.id===id);
        if(p){
          const undoSnapshot = createUndoSnapshot();
          p.status = "paid";
          recordFinanceAudit("card_purchase_paid", {entityId:id});
          autosave(); render(); if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true); registerUndo(undoSnapshot, "Alteração da compra"); toast("Compra marcada como paga", {undo:true});
        }
      }

      if(action === "add-finance-block") openFinanceBlockChooser();
      if(action === "add-block-item") openFinanceBlockItemModal(id);
      if(action === "edit-finance-block") openCategoryModal(id, true);
      if(action === "add-category") openCategoryModal();
      if(action === "edit-category") openCategoryModal(id);
      if(action === "delete-category"){
        if(confirm("Excluir categoria? Lançamentos existentes continuarão com o nome salvo.")){
          const undoSnapshot = createUndoSnapshot();
          data.categories = data.categories.filter(c=>c.id!==id);
          recordFinanceAudit("category_deleted", {entityId:id});
          autosave(); render(); registerUndo(undoSnapshot, "Exclusão da categoria"); toast("Categoria excluída", {undo:true});
        }
      }

      if(action === "add-subcategory") openSubcategoryModal();
      if(action === "edit-subcategory") openSubcategoryModal(id);
      if(action === "delete-subcategory"){
        if(confirm("Excluir subcategoria? Compras existentes continuarao com o nome salvo.")){
          const undoSnapshot = createUndoSnapshot();
          data.subcategories = (data.subcategories || []).filter(rule=>rule.id!==id);
          recordFinanceAudit("subcategory_deleted", {entityId:id});
          autosave(); render(); registerUndo(undoSnapshot, "Exclusão da subcategoria"); toast("Subcategoria excluída", {undo:true});
        }
      }
      if(action === "apply-subcategory-rules"){
        const changed = applySubcategoryRulesToCardPurchases(false);
        autosave(); render(); toast(changed ? `Filtros aplicados em ${changed} compra(s)` : "Nenhuma compra sem subcategoria encontrada para aplicar");
      }

      if(action === "save-config"){
        data.settings.startMonth = Number(document.getElementById("cfgStartMonth").value);
        data.settings.initialBalance = round(document.getElementById("cfgInitialBalance").value);
        state.year = Number(document.getElementById("cfgYear").value || state.year);
        data.settings.year = state.year;
        data.settings.initialBalanceYear = state.year;
        autosave(); render(); toast("Configurações salvas");
      }
      if(action === "export") exportData();
      if(action === "export-excel") exportExcel();
      if(action === "import") document.getElementById("importFile").click();
      if(action === "import-nubank") document.getElementById("nubankImportFile").click();
      if(action === "clear-data"){
        if(confirm("Excluir todos os dados deste navegador?")){
          const undoSnapshot = createUndoSnapshot();
          data = createEmptyData();
          recordFinanceAudit("all_financial_data_deleted");
          invalidateFinanceCaches();
          state.month = data.settings.currentMonth;
          state.year = data.settings.year;
          saveData(true); render(); registerUndo(undoSnapshot, "Exclusão de todos os dados"); toast("Dados limpos", {undo:true});
        }
      }
    });

    let filterRenderTimer = null;
    document.addEventListener("focusin", (e) => {
      const target = e.target;
      if(target.matches("[data-market-money]")){
        const key = target.dataset.marketMoney;
        target.value = formatInvestmentCurrencyEditValue(state.marketComparison[key]);
        requestAnimationFrame(()=>{ if(document.activeElement===target) target.select(); });
        return;
      }
      if(!target.matches("[data-investment-money]")) return;
      const key = target.dataset.investmentSimulation;
      target.value = formatInvestmentCurrencyEditValue(state.investmentSimulation[key]);
      requestAnimationFrame(()=>{ if(document.activeElement===target) target.select(); });
    });
    document.addEventListener("focusout", (e) => {
      const target = e.target;
      if(target.matches("[data-market-money]")){
        const key = target.dataset.marketMoney;
        const previous = Number(state.marketComparison[key] || 0);
        const next = Math.max(0,Math.min(1000000000000,parseInvestmentCurrencyInput(target.value)));
        state.marketComparison[key] = next;
        target.value = formatInvestmentCurrencyInput(next);
        if(next !== previous) requestMarketComparison();
        return;
      }
      if(!target.matches("[data-investment-money]")) return;
      const key = target.dataset.investmentSimulation;
      state.investmentSimulation[key] = parseInvestmentCurrencyInput(target.value);
      target.value = formatInvestmentCurrencyInput(state.investmentSimulation[key]);
      updateInvestmentSimulation();
    });
    document.addEventListener("input", (e) => {
      const target = e.target;
      if(target.matches("[data-market-symbol-input]")){ queueMarketSymbolSearch(target.value,target.dataset.symbolTarget || "comparison"); return; }
      if(target.matches("[data-market-allocation]")){ updateMarketAllocationDraft(target); refreshMarketBasketResults(); return; }
      if(target.matches("[data-investment-simulation], [data-fixed-income-rate]")){ updateInvestmentSimulation(); return; }
      const investmentEventContainer=target.closest("[data-investment-event-form]");
      if(investmentEventContainer){ if(target.matches("[data-investment-event-balance]"))target.dataset.userEdited="true"; if(target.name==="amount")syncInvestmentEventForm(investmentEventContainer); }
      if(target.matches("[data-expense-due-date], [data-purchase-invoice-date]")) target.dataset.userEdited = "true";
      if(target.matches("[data-expense-purchase-date]")) syncExpenseCardDueDate(target.closest("form"));
      if(target.matches("[data-purchase-date]")) syncPurchaseInvoiceDueDate(target.closest("form"));
      if(target.matches("[data-filter]")){
        state.filters[target.dataset.filter] = target.value;
        clearTimeout(filterRenderTimer);
        filterRenderTimer = setTimeout(() => {
          if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true);
          else if(!refreshFinanceFilteredContent()) render();
        }, 220);
      }
    });
    document.addEventListener("change", (e) => {
      const target = e.target;
      if(target.matches("[data-invoice-month]")){ refreshInvoiceBatchAddButton(); return; }
      if(target.matches("[data-market-allocation]")){
        updateMarketAllocationDraft(target);
        refreshMarketBasketResults();
        return;
      }
      if(target.matches("[data-market-years]")){
        state.marketComparison.years=Math.max(1,Math.min(30,Math.round(Number(target.value)||1)));
        target.value=state.marketComparison.years;
        requestMarketComparison();
        return;
      }
      if(target.matches("[data-investment-scenario]")){ highlightFixedIncomeScenario(target.value||"cdb-cdi"); return; }
      if(target.matches("[data-investment-simulation], [data-fixed-income-rate]")){ updateInvestmentSimulation(); return; }
      if(target.matches("[data-investment-event-kind]")){ syncInvestmentEventForm(target.closest("[data-investment-event-form]")); return; }
      if(target.matches("[data-investment-history-filter]")){ state.investmentHistoryId=target.value||"all"; render(); return; }
      if(target.id === "financePaletteSelect"){ applyFinancePalette(target.value, true); return; }
      if(target.id === "financeBackgroundSelect"){ applyFinanceBackground(target.value, true); return; }
      if(target.matches("[data-card-template]")){ applySelectedCardTemplateToForm(target); return; }
      if(target.matches("[data-entry-status]")){ syncEntryReceivedDateField(target.closest("form")); return; }
      if(target.matches("[data-expense-status]")){ syncExpensePaidDateField(target.closest("form")); return; }
      if(target.matches("[data-expense-payment-method], [data-expense-kind]")){ syncExpenseMode(target.closest("form")); return; }
      if(target.matches("[data-expense-card], [data-expense-purchase-date]")){ syncExpenseCardDueDate(target.closest("form")); return; }
      if(target.matches("[data-purchase-date], [data-purchase-card]")){ syncPurchaseInvoiceDueDate(target.closest("form")); return; }
      if(target.matches("[data-expense-due-date], [data-purchase-invoice-date]")){ target.dataset.userEdited = "true"; return; }
      if(target.id === "monthSelect"){ setFinanceVisibleMonth(Number(target.value), state.year, true); saveViewStateLocally(); render(); }
      if(target.id === "yearInput"){ setFinanceVisibleMonth(state.month, Number(target.value || state.year), true); saveViewStateLocally(); render(); }
      if(target.matches("[data-filter]")){
        state.filters[target.dataset.filter] = target.value;
        if(activeDrawerCardId) openCardDrawer(activeDrawerCardId, true);
        else if(!refreshFinanceFilteredContent()) render();
      }
      if(target.matches("[data-analysis]")){ state.analysis[target.dataset.analysis] = target.value; render(); }
    });

    document.addEventListener("keydown", (event) => {
      if(event.target.matches("[data-market-symbol-input]")){
        const comparison = state.marketComparison;
        const target = event.target.dataset.symbolTarget === "basket" ? "basket" : "comparison";
        comparison.searchTarget = target;
        const suggestions = Array.isArray(comparison.suggestions) ? comparison.suggestions : [];
        if((event.key === "ArrowDown" || event.key === "ArrowUp") && suggestions.length){
          event.preventDefault();
          const direction = event.key === "ArrowDown" ? 1 : -1;
          comparison.activeSuggestionIndex = comparison.activeSuggestionIndex < 0
            ? (direction > 0 ? 0 : suggestions.length-1)
            : (comparison.activeSuggestionIndex + direction + suggestions.length) % suggestions.length;
          renderMarketSymbolSuggestions();
          return;
        }
        if(event.key === "Enter"){
          event.preventDefault();
          const selected = suggestions[comparison.activeSuggestionIndex >= 0
            ? comparison.activeSuggestionIndex
            : 0];
          addMarketSymbol(selected?.symbol || "",target);
          return;
        }
        if(event.key === "Escape" && comparison.searchStatus !== "idle"){
          event.preventDefault();
          comparison.searchStatus = "idle";
          comparison.suggestions = [];
          comparison.activeSuggestionIndex = -1;
          renderMarketSymbolSuggestions();
          return;
        }
      }
      const modal = document.getElementById("modal");
      const drawerBackdrop = document.getElementById("drawerBackdrop");
      const modalVisible = !modal.classList.contains("hidden");
      const drawerVisible = !drawerBackdrop.classList.contains("hidden");
      if(event.key === "Escape"){
        if(modalVisible){ event.preventDefault(); closeModal(); return; }
        if(drawerVisible){ event.preventDefault(); closeDrawer(); return; }
      }
      if(event.key === "Tab" && modalVisible){
        trapDialogFocus(event, modal.querySelector(".modal-card"));
      } else if(event.key === "Tab" && drawerVisible){
        trapDialogFocus(event, drawerBackdrop.querySelector(".drawer"));
      }
    });

    document.getElementById("saveBtn").addEventListener("click", () => saveData(true));
    document.getElementById("exportBtn").addEventListener("click", exportData);
    document.getElementById("excelBtn").addEventListener("click", exportExcel);
    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", e => {
      if(e.target.files?.[0]) importData(e.target.files[0]);
      e.target.value = "";
    });
    document.getElementById("nubankImportFile").addEventListener("change", e => {
      if(e.target.files?.[0]) importNubankCsv(e.target.files[0]);
      e.target.value = "";
    });
    document.getElementById("clearFiltersBtn").addEventListener("click", () => {
      state.filters = { search:"", category:"all", subcategory:"all", status:"all", date:"", method:"all", card:"all", sort:"date", kind:"all" };
      if(!refreshFinanceFilteredContent()) render();
      toast("Filtros limpos");
    });

    render();
    observeFinanceFrameHeight();
  </script>
</body>
</html>
