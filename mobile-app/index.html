<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="application-name" content="RumoFi" />
  <meta name="description" content="Controle suas entradas, despesas, cartões, faturas e planejamento financeiro em um só aplicativo." />
  <title>RumoFi</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="shortcut icon" href="./favicon.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#080808">
  <link rel="stylesheet" href="./financial-planning.css?v=20260831-8">
  <script src="/vendor/chart-4.5.1.umd.min.js"></script>
  <script src="/vendor/exceljs-4.4.0.min.js"></script>
  <style>
    :root{
      --espresso:#080808;
      --coffee:#101010;
      --cocoa:#181818;
      --caramel:#4f7cff;
      --gold:#4f7cff;
      --cream:#ffffff;
      --card:#181818;
      --green:#00c853;
      --green-soft:rgba(0,200,83,.14);
      --red:#ff3b30;
      --yellow:#4f7cff;
      --ink:#ffffff;
      --muted:#a6a6a6;
      --line:#2a2a2a;
      --shadow:0 18px 42px rgba(0,0,0,.26);
      --soft-shadow:0 12px 28px rgba(0,0,0,.22);
      --radius:18px;
      --radius-sm:12px;
    }

    *{box-sizing:border-box}
    html{
      scroll-behavior:smooth;
      color-scheme:dark;
      background:#080808;
      scrollbar-color:#3a3a3a #080808;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar{width:10px;height:10px;background:#080808}
    html::-webkit-scrollbar-track,
    body::-webkit-scrollbar-track{background:#080808}
    html::-webkit-scrollbar-thumb,
    body::-webkit-scrollbar-thumb{border:2px solid #080808;border-radius:999px;background:#3a3a3a}
    body{
      margin:0;
      font-family:'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(88,199,216,.16), transparent 34%),
        radial-gradient(circle at 94% 20%, rgba(118,240,210,.10), transparent 32%),
        linear-gradient(180deg, #07101d 0%, #0b1423 46%, #070d18 100%);
      min-height:100vh;
    }

    button,input,select,textarea{font-family:inherit}
    button{cursor:pointer;border:0}
    .app-shell{max-width:1440px;margin:0 auto;padding:0 18px 42px}
    .topbar{
      position:sticky;top:0;z-index:50;
      margin:0 -18px 16px;
      padding:14px 18px;
      background:linear-gradient(135deg, rgba(8,17,31,.98) 0%, rgba(17,27,45,.96) 62%, rgba(88,199,216,.22) 128%);
      color:var(--cream);
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 16px 34px rgba(0,0,0,.24);
      backdrop-filter:blur(12px);
    }
    .topbar-inner{
      max-width:1440px;margin:0 auto;
      display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    }
    .brand h1{font-size:1.15rem;line-height:1;margin:0 0 4px;font-weight:800;letter-spacing:-.03em}
    .brand p{margin:0;color:#ead8c5;font-size:.82rem}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .field-mini{
      display:flex;align-items:center;gap:6px;
      background:rgba(255,248,239,.11);border:1px solid rgba(255,248,239,.18);
      border-radius:999px;padding:6px 8px;color:#f7eadb;
    }
    .field-mini label{font-size:.72rem;color:#ead8c5}
    .field-mini select,.field-mini input{
      height:28px;border:0;border-radius:999px;
      background:#fff8ef;color:var(--espresso);
      padding:0 10px;font-weight:700;outline:none;min-width:82px;
    }
    .field-mini input{width:86px}
    .btn{
      height:34px;border-radius:999px;padding:0 12px;
      background:var(--card);color:var(--espresso);
      font-weight:700;font-size:.78rem;
      display:inline-flex;align-items:center;gap:6px;
      box-shadow:0 4px 14px rgba(0,0,0,.08);
      transition:.18s ease;
      white-space:nowrap;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.13)}
    .btn.primary{background:linear-gradient(135deg, var(--gold), var(--caramel));color:#fff}
    .btn.dark{background:var(--espresso);color:#fff}
    .btn.ghost{background:rgba(255,248,239,.13);color:#fff;border:1px solid rgba(255,248,239,.25);box-shadow:none}
    .btn.soft{background:#f3e3d1;color:var(--coffee);box-shadow:none}
    .btn.green{background:var(--green);color:#fff}
    .btn.red{background:var(--red);color:#fff}
    .btn.small{height:28px;padding:0 9px;font-size:.72rem}
    .saved-indicator{
      font-size:.72rem;color:#f1dfc8;display:inline-flex;align-items:center;gap:6px;
      min-width:135px;justify-content:flex-end;
    }
    .pulse-dot{width:7px;height:7px;border-radius:999px;background:#a7e0b8;box-shadow:0 0 0 4px rgba(167,224,184,.16)}

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(11,minmax(118px,1fr));
      gap:10px;
      margin:16px 0 12px;
    }
    .kpi-card{
      position:relative;overflow:hidden;
      background:rgba(255,248,239,.86);
      border:1px solid rgba(112,67,35,.12);
      border-radius:16px;
      box-shadow:var(--soft-shadow);
      padding:12px 12px 11px;
      min-height:86px;
    }
    .kpi-card:before{
      content:"";position:absolute;inset:0 0 auto;height:3px;
      background:linear-gradient(90deg,var(--gold),rgba(185,130,82,.28));
    }
    .kpi-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.055em;color:var(--muted);font-weight:800}
    .kpi-value{font-size:1rem;font-weight:850;letter-spacing:-.04em;margin-top:8px;white-space:nowrap}
    .kpi-hint{font-size:.68rem;color:#9b826e;margin-top:6px}
    .positive{color:var(--green)!important}
    .negative{color:var(--red)!important}
    .neutral{color:var(--coffee)!important}
    .warning{color:#916210!important}

    .tabs{
      display:flex;gap:8px;overflow:auto;padding:4px 2px 12px;margin:0 0 6px;
      scrollbar-width:thin;
    }
    .tab-btn{
      border-radius:999px;
      padding:10px 14px;
      background:rgba(255,248,239,.72);
      color:var(--coffee);
      font-size:.84rem;
      font-weight:800;
      border:1px solid rgba(112,67,35,.12);
      transition:.18s ease;
      white-space:nowrap;
    }
    .tab-btn.active{
      color:#fff;
      background:linear-gradient(135deg,var(--espresso),var(--cocoa));
      box-shadow:0 10px 22px rgba(59,36,23,.16);
    }

    .page{animation:none}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .section-grid{
      display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start;
    }
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .panel{
      background:rgba(255,248,239,.84);
      border:1px solid rgba(112,67,35,.12);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .panel-header{
      padding:13px 14px;
      display:flex;justify-content:space-between;gap:12px;align-items:center;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.36), rgba(255,248,239,.38));
    }
    .panel-title{margin:0;font-size:.95rem;color:var(--espresso);letter-spacing:-.02em}
    .panel-subtitle{margin:3px 0 0;color:var(--muted);font-size:.73rem}
    .panel-body{padding:14px}
    .compact-list{display:grid;gap:8px}
    .item-card{
      background:#fffdf9;border:1px solid rgba(112,67,35,.13);
      border-radius:14px;padding:10px 10px;
      display:grid;grid-template-columns:1fr auto;gap:10px;
      align-items:center;transition:.16s ease;
    }
    .item-card:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(59,36,23,.08)}
    .item-card.dragging{opacity:.55;transform:scale(.99)}
    .item-main{min-width:0}
    .item-title{font-weight:800;font-size:.86rem;color:var(--espresso);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
    .tag{
      display:inline-flex;align-items:center;gap:4px;
      padding:3px 7px;border-radius:999px;
      background:#f1e1cf;color:var(--coffee);
      font-size:.68rem;font-weight:800;
    }
    .tag.green{background:var(--green-soft);color:var(--green)}
    .tag.yellow{background:var(--yellow);color:#7d5524}
    .tag.red{background:#f2d5cd;color:var(--red)}
    .tag.dark{background:#ead8c5;color:var(--espresso)}
    .item-value{text-align:right;font-weight:850;color:var(--coffee);font-size:.92rem;white-space:nowrap}
    .item-actions{display:flex;gap:5px;justify-content:flex-end;margin-top:7px;flex-wrap:wrap}

    .columns{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
    }
    .drop-col{
      min-height:230px;background:rgba(255,253,249,.58);
      border:1px dashed rgba(112,67,35,.22);
      border-radius:18px;padding:10px;
    }
    .drop-col.over{background:#fff7e6;border-color:var(--caramel)}
    .drop-title{
      display:flex;justify-content:space-between;align-items:center;
      margin:0 0 10px;font-size:.86rem;color:var(--espresso);
    }
    .drop-total{font-weight:900;color:var(--coffee)}
    .filterbar{
      display:flex;gap:8px;flex-wrap:wrap;align-items:center;
      margin-bottom:12px;padding:10px;
      background:rgba(255,248,239,.68);
      border:1px solid rgba(112,67,35,.12);
      border-radius:16px;
    }
    .input,.select,.textarea{
      width:100%;
      border:1px solid rgba(112,67,35,.16);
      background:#fffdf9;
      border-radius:12px;
      padding:10px 11px;
      color:var(--espresso);
      outline:none;
      transition:.15s ease;
      font-size:.84rem;
    }
    .input:focus,.select:focus,.textarea:focus{border-color:var(--caramel);box-shadow:0 0 0 3px rgba(185,130,82,.14)}
    .textarea{min-height:82px;resize:vertical}
    .filterbar .input{max-width:260px}
    .filterbar .select{width:auto;min-width:150px}
    .filter-control{
      display:flex;
      flex-direction:column;
      gap:5px;
      min-width:158px;
    }
    .filter-control .input,
    .filter-control .select{
      width:100%;
      max-width:none;
    }
    .filter-control-label{
      font-size:.64rem;
      line-height:1;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.04em;
      color:var(--muted);
    }

    .card-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;
    }
    .credit-card{
      overflow:hidden;border-radius:20px;background:var(--card);
      border:1px solid rgba(112,67,35,.14);
      box-shadow:var(--shadow);
    }
    .credit-head{
      position:relative;
      min-height:168px;
      color:var(--card-text,#fff);
      padding:16px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:14px;
      background:
        linear-gradient(135deg,var(--card-color,#B98252) 0%,var(--card-accent,#3B2417) 100%);
      isolation:isolate;
    }
    .credit-head:before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(115deg,rgba(255,255,255,.2),transparent 34%),
        linear-gradient(0deg,rgba(0,0,0,.16),transparent 55%);
      z-index:-1;
    }
    .credit-head:after{
      content:"";
      position:absolute;
      right:-42px;
      top:-38px;
      width:150px;
      height:150px;
      border:1px solid rgba(255,255,255,.22);
      transform:rotate(28deg);
      border-radius:28px;
      z-index:-1;
    }
    .credit-top,.credit-bottom{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      min-width:0;
    }
    .credit-bottom{align-items:flex-end}
    .credit-logo{
      width:64px;
      height:42px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }
    .card-institution-mark{
      display:inline-grid;
      place-items:center;
      width:60px;
      height:38px;
      max-width:100%;
      color:inherit;
      flex:0 0 auto;
    }
    .card-institution-mark svg,
    .card-institution-mark img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;overflow:visible}
    .card-institution-mark[data-institution="nubank"],
    .card-institution-mark[data-institution="mercadopago"],
    .card-institution-mark[data-institution="itau"]{width:42px;height:42px}
    .card-institution-mark[data-institution="xp"]{width:52px;height:34px}
    .card-institution-mark[data-institution="santander"],
    .card-institution-mark[data-institution="bradesco"],
    .card-institution-mark[data-institution="bb"],
    .card-institution-mark[data-institution="inter"]{width:44px;height:38px}
    .institution-logo-tile{display:grid;place-items:center;width:42px;height:42px;overflow:hidden;border-radius:12px}
    .institution-logo-tile.mercado-pago{padding:5px;background:#ffe600}
    .card-institution-monogram{display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.28);border-radius:11px;background:rgba(255,255,255,.1);font-size:12px;font-weight:900;letter-spacing:.03em}
    .credit-chip{
      width:42px;
      height:30px;
      border-radius:8px;
      background:
        linear-gradient(135deg,rgba(255,255,255,.78),rgba(255,255,255,.28)),
        linear-gradient(135deg,#d8b66b,#8d6a2f);
      border:1px solid rgba(255,255,255,.38);
      box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
      flex:0 0 auto;
    }
    .credit-chip:before{
      content:"";
      display:block;
      width:1px;
      height:100%;
      margin-left:18px;
      background:rgba(59,36,23,.28);
    }
    .credit-number{
      font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:.85rem;
      letter-spacing:.08em;
      opacity:.9;
      white-space:nowrap;
    }
    .credit-template{
      font-size:.64rem;
      font-weight:850;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.76;
      margin-bottom:5px;
    }
    .credit-name{font-weight:900;font-size:1.08rem;letter-spacing:-.03em;line-height:1.1}
    .credit-dates{font-size:.7rem;opacity:.9;margin-top:5px;line-height:1.45}
    .credit-brand{
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:5px;
      font-size:.66rem;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.05em;
      min-width:76px;
    }
    .brand-mark{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:48px;
      height:24px;
      border-radius:8px;
      color:#fff;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.22);
      font-size:.7rem;
      font-weight:900;
      line-height:1;
    }
    .brand-mark.mastercard{
      position:relative;
      width:48px;
      min-width:48px;
      background:transparent;
      border:0;
    }
    .brand-mark.mastercard span{
      width:24px;
      height:24px;
      border-radius:50%;
      display:block;
      position:absolute;
      top:0;
    }
    .brand-mark.mastercard span:first-child{left:7px;background:#eb001b}
    .brand-mark.mastercard span:last-child{right:7px;background:#f79e1b;mix-blend-mode:screen}
    .brand-mark.visa{font-style:italic;letter-spacing:.08em}
    .brand-mark.elo{background:#111;color:#fff}
    .brand-mark.amex{background:#2e77bb;color:#fff}
    .brand-mark.hipercard{background:#b0182d;color:#fff}
    .brand-mark.diners{background:#0079be;color:#fff}
    .mini-card-mark{
      width:24px;
      height:18px;
      border-radius:5px;
      display:inline-grid;
      place-items:center;
      margin-right:7px;
      font-size:.58rem;
      font-weight:900;
      vertical-align:middle;
      box-shadow:0 4px 10px rgba(59,36,23,.12);
    }
    .credit-body{padding:13px 14px 14px}
    .metric-row{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;margin:6px 0;color:var(--muted)}
    .metric-row strong{color:var(--espresso)}
    .progress{
      height:9px;border-radius:999px;background:#ead8c5;overflow:hidden;margin:10px 0 8px;
    }
    .progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--caramel));border-radius:inherit;transition:.35s ease}
    .progress.warn span{background:#d19042}
    .progress.danger span{background:var(--red)}
    .alert-line{font-size:.7rem;font-weight:800;color:var(--red);margin-top:4px}

    .chart-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;
    }
    .chart-card{
      background:rgba(255,248,239,.88);
      border:1px solid rgba(112,67,35,.12);
      border-radius:18px;box-shadow:var(--soft-shadow);
      padding:14px;min-height:292px;
    }
    .chart-card h3{font-size:.9rem;margin:0 0 10px;color:var(--espresso)}
    .chart-card canvas{max-height:235px}

    .category-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
    .category-card{
      background:#fffdf9;border:1px solid rgba(112,67,35,.13);
      border-radius:15px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .cat-left{display:flex;align-items:center;gap:9px;min-width:0}
    .cat-dot{width:14px;height:14px;border-radius:999px;box-shadow:0 0 0 4px rgba(112,67,35,.08)}
    .cat-name{font-weight:850;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cat-type{font-size:.68rem;color:var(--muted);margin-top:3px}

    .modal,.drawer-backdrop{
      position:fixed;inset:0;z-index:100;background:rgba(43,27,18,.42);
      display:flex;align-items:center;justify-content:center;padding:18px;
      backdrop-filter:blur(6px);
    }
    .drawer-backdrop{z-index:120}
    .modal{z-index:160}
    .modal.hidden,.drawer-backdrop.hidden{display:none}
    .modal-card{
      width:min(760px,100%);
      max-height:88vh;overflow:auto;
      background:#fff8ef;border:1px solid rgba(255,255,255,.45);
      border-radius:24px;box-shadow:0 26px 80px rgba(43,27,18,.32);
    }
    .modal-header,.drawer-header{
      padding:16px 18px;border-bottom:1px solid var(--line);
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      background:linear-gradient(180deg,#fffaf2,#f8eadb);
    }
    .modal-title,.drawer-title{margin:0;font-size:1rem;color:var(--espresso);font-weight:900}
    .close-btn{width:32px;height:32px;border-radius:50%;background:#eedbc8;color:var(--espresso);font-weight:900}
    .modal-body{padding:16px 18px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .form-field label{display:block;margin:0 0 6px;font-weight:800;font-size:.73rem;color:var(--coffee)}
    .form-field.full{grid-column:1/-1}
    .form-hint{margin:6px 0 0;color:var(--muted);font-size:.68rem;line-height:1.35}
    .check-field{
      display:flex!important;
      align-items:flex-start;
      gap:10px;
      margin:0!important;
      padding:11px 12px;
      border:1px solid rgba(112,67,35,.14);
      border-radius:12px;
      background:#fffdf9;
      cursor:pointer;
    }
    .check-field input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--caramel);flex:0 0 auto}
    .check-field strong{display:block;color:var(--coffee);font-size:.78rem}
    .check-field small{display:block;margin-top:3px;color:var(--muted);font-weight:600;font-size:.68rem;line-height:1.35}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:#fff4e6}

    .drawer-backdrop{justify-content:flex-end;padding:0}
    .drawer{
      width:min(560px,100%);height:100vh;background:#fff8ef;
      box-shadow:-24px 0 70px rgba(43,27,18,.26);
      display:flex;flex-direction:column;
      animation:slideDrawer .22s ease both;
    }
    @keyframes slideDrawer{from{transform:translateX(24px);opacity:.2}to{transform:translateX(0);opacity:1}}
    .drawer-body{padding:15px;overflow:auto;display:grid;gap:12px}
    .card-invoice-overview{display:grid;gap:14px;min-width:0}
    .card-invoice-chart{min-width:0;padding:13px 13px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
    .card-invoice-chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
    .card-invoice-chart-head strong{font-size:.8rem}
    .card-invoice-chart-head span{color:var(--muted);font-size:.64rem;text-align:right}

      const g = parseInt(clean.slice(2,4), 16);

      return `rgba(${r},${g},${b},${alpha})`;

          settings[field] = newIndex >= 0 ? newIndex : oldIndex;

        settings.startMonth = clampMonth(settings.startMonth);
        settings.currentMonth = clampMonth(settings.currentMonth);

        year:y,
        key:`${y}-${String(m).padStart(2,"0")}`,
        label:`${MONTHS[monthIndex]}/${String(y).slice(-2)}`
      };
    }
    function previousMonthPosition(monthIndex = state.month, planningYear = state.year){
      return monthPositionFromOffset(monthIndex, planningYear, -1);
    }
    function forwardMonthWindow(count = 12){
      const visibleCount = Math.min(MAX_RECURRING_PROJECTION_MONTHS, Math.max(0, Math.floor(Number(count) || 0)));
      const projectionEndKey = financeProjectionEndMonthKey();
      return Array.from({length:visibleCount}, (_, offset) => monthPositionFromOffset(state.month, state.year, offset))
        .filter(position => position.key <= projectionEndKey);
    }
    function totalsMemoKey(monthIndex = state.month, planningYear = state.year){
      return `${planningYear}-${monthIndex}`;
    }
    function planningYearFromMonthKey(key){
      const [year, month] = String(key || "").slice(0,7).split("-").map(Number);
      return year;
    }
    function setVisibleMonthFromDate(date){
      const key = keyFromDate(date);
      if(!key) return;
      const [, month] = key.split("-").map(Number);
      const monthIndex = MONTH_NUMBERS.indexOf(month);
      if(monthIndex < 0) return;
      return setFinanceVisibleMonth(monthIndex, planningYearFromMonthKey(key), true);
    }
    function dateFromDay(day, monthIndex = state.month, planningYear = state.year){
      const key = getMonthKey(monthIndex, planningYear);
      const [y,m] = key.split("-").map(Number);
      const last = new Date(y, m, 0).getDate();
      const d = Math.min(Math.max(Number(day) || 1, 1), last);
      return `${key}-${String(d).padStart(2,"0")}`;
    }
    function dateFromYearMonthDay(year, month, day){
      let y = Number(year);
      let m = Number(month);
      while(m > 12){ m -= 12; y += 1; }
      while(m < 1){ m += 12; y -= 1; }
      const last = new Date(y, m, 0).getDate();
      const d = Math.min(Math.max(Number(day) || 1, 1), last);
      return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    }
    function getCardInvoiceDueDate(card, purchaseDate){
      if(!card || !purchaseDate) return purchaseDate || "";
      const purchase = parseDate(purchaseDate);
      const closingDay = Math.min(31, Math.max(1, Number(card.closingDay || 1)));
      const dueDay = Math.min(31, Math.max(1, Number(card.dueDay || 1)));
      let invoiceMonth = purchase.getMonth() + 1 + (purchase.getDate() > closingDay ? 1 : 0);
      let invoiceYear = purchase.getFullYear();
      while(invoiceMonth > 12){ invoiceMonth -= 12; invoiceYear += 1; }
      const dueMonth = invoiceMonth + (dueDay <= closingDay ? 1 : 0);
      return dateFromYearMonthDay(invoiceYear, dueMonth, dueDay);
    }
    function getCardBillingDates(card, monthIndex = state.month, planningYear = state.year){
      const dueDate = dateFromDay(card?.dueDay || 1, monthIndex, planningYear);
      const closingOffset = Number(card?.dueDay || 1) <= Number(card?.closingDay || 1) ? -1 : 0;
      const closingPosition = monthPositionFromOffset(monthIndex, planningYear, closingOffset);
      const closingDate = dateFromDay(card?.closingDay || 1, closingPosition.monthIndex, closingPosition.year);
      return {closingDate,dueDate};
    }
    function keyFromDate(date){ return date ? date.slice(0,7) : ""; }
    function normalizeMonthKey(value, fallback = getMonthKey()){
      const match = String(value || "").trim().match(/^(\d{4})-(\d{2})$/);
      if(!match) return fallback;
      const year = Number(match[1]);
      const month = Number(match[2]);
      if(!year || month < 1 || month > 12) return fallback;
      return `${String(year).padStart(4,"0")}-${String(month).padStart(2,"0")}`;
    }
    function parseDate(date){ return new Date(`${date}T00:00:00`); }
    function dateToIso(date){
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    }
    function addMonths(dateStr, months){
      const d = parseDate(dateStr);
      const day = d.getDate();
      d.setMonth(d.getMonth() + months);
      if (d.getDate() !== day) d.setDate(0);
      return d.toISOString().slice(0,10);
    }
    function monthDiff(startDate, targetKey){
      const [ty,tm] = targetKey.split("-").map(Number);
      const s = parseDate(startDate);
      return (ty - s.getFullYear()) * 12 + (tm - (s.getMonth()+1));
    }
    function monthRange(key){
      const [y,m] = key.split("-").map(Number);
      return {
        start: new Date(y, m-1, 1),
        end: new Date(y, m, 0)
      };
    }

    function recurrenceDatesForMonth(item, dateField, monthIndex = state.month, planningYear = state.year){
      const start = item[dateField];
      if(!start) return [];
      const targetKey = getMonthKey(monthIndex, planningYear);
      const rec = item.recurrence || "única";
      const diff = monthDiff(start, targetKey);
      if(diff < 0 || diff >= MAX_RECURRING_PROJECTION_MONTHS) return [];
      if(rec === "única") return keyFromDate(start) === targetKey ? [start] : [];
      if(rec === "mensal") return [addMonths(start, diff)];
      if(rec === "bimestral") return diff % 2 === 0 ? [addMonths(start, diff)] : [];
      if(rec === "trimestral") return diff % 3 === 0 ? [addMonths(start, diff)] : [];
      if(rec === "semestral") return diff % 6 === 0 ? [addMonths(start, diff)] : [];
      if(rec === "anual") return diff % 12 === 0 ? [addMonths(start, diff)] : [];
      if(rec === "semanal" || rec === "quinzenal"){
        const step = rec === "semanal" ? 7 : 15;
        const {start:ms, end:me} = monthRange(targetKey);
        const dates = [];
        let d = parseDate(start);
        let guard = 0;
        while(d <= me && guard < 370){
          if(d >= ms) dates.push(dateToIso(d));
          d.setDate(d.getDate()+step);
          guard++;
        }
        return dates;
      }
      return keyFromDate(start) === targetKey ? [start] : [];
    }

    function loadData(){

        let raw = localStorage.getItem(STORAGE_KEY);
        if(!raw){
          for(const legacyBase of LEGACY_STORAGE_KEY_BASES){
            const legacyKey = STORAGE_KEY.replace(STORAGE_KEY_BASE, legacyBase);
            raw = localStorage.getItem(legacyKey);
            if(raw){
              localStorage.setItem(STORAGE_KEY, raw);
              break;
            }
          }
        }
        if(!raw) return createEmptyData();
        const parsed = JSON.parse(raw);
        if(!isRecognizedFinancialData(parsed)) return createEmptyData();
        ensureLocalMigrationBackup(localStorage, STORAGE_KEY, parsed);
        const migrated = mergeDefaultCategories(parsed);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
        return migrated;
      }catch(e){
        console.warn("Falha ao carregar localStorage:", e);
        return createEmptyData();
      }
    }

      const suggestion = suggestCategory({
        description,
        categoryRules:data.categoryRules,
        movements:data.movements,
        categories:data.categories
      });
      const category = data.categories.find(item => item.id === suggestion.categoryId);
      const compatible = category && (category.type === type || category.type === "ambos");
      const fallback = data.categories.find(item => normalizeFinancialText(item.name) === "outros")
        || data.categories.find(item => item.type === type || item.type === "ambos");
      return {
        ...suggestion,
        categoryId:compatible ? category.id : fallback?.id || null,
        name:compatible ? category.name : fallback?.name || "Outros"
      };

      data.categoryRules = Array.isArray(data.categoryRules) ? data.categoryRules : [];
      const existing = data.categoryRules.find(rule =>
        (rule.learned === true || rule.source === "learned")
        && normalizeFinancialText(rule.pattern) === pattern
      );
      const rule = {
        id:existing?.id || uid("category_rule"),
        pattern,
        matchType:"merchant",
        categoryId:category.id,
        priority:100,
        source:"learned",
        learned:true,
        active:true,
        updatedAt:new Date().toISOString()
      };

      else data.categoryRules.push(rule);

    function subcategoryRuleMatchesItem(rule = {}, item = {}){

      if(category !== "all" && item.category !== category) return false;
      const haystack = normalizeText([item.description, item.notes, item.importedFile].filter(Boolean).join(" "));
      if(!haystack) return false;
      const terms = subcategoryRuleTerms(rule);
      return terms.some(term => haystack.includes(term));

    function renderCardInstitutionMark(visual = {}){
      const institutionId = CARD_TEMPLATES.some(template => template.id === visual.templateId)
        ? visual.templateId
        : "custom";
      const label = visual.templateLabel || visual.name || "Personalizada";
      const symbol = institutionId === "custom"
        ? `<span class="card-institution-monogram">${escapeHtml(visual.short || initials(visual.name || label))}</span>`
        : (CARD_INSTITUTION_SYMBOLS[institutionId] || `<span class="card-institution-monogram">${escapeHtml(visual.short || initials(visual.name || label))}</span>`);
      return `<span class="card-institution-mark" data-institution="${escapeHtml(institutionId)}" role="img" aria-label="Instituição ${escapeHtml(label)}">${symbol}</span>`;
    }
    function cardVisualStyle(visual){
      return `--card-color:${visual.color};--card-accent:${visual.accent};--card-text:${visual.text};`;
    }

    function normalizeCardPurchaseTransactionType(value){
      const normalized = normalizeText(value);
      if(["credit", "credito", "crédito", "estorno", "refund", "reembolso"].includes(normalized)) return "credit";
      return "debit";
    }

    function isCardPurchaseCredit(purchase = {}){
      return normalizeCardPurchaseTransactionType(purchase.transactionType || purchase.nature || purchase.kind) === "credit";
    }

    function cardPurchaseTransactionLabel(purchase = {}){
      return isCardPurchaseCredit(purchase) ? "Crédito / estorno" : "Débito";
    }

    function signedCardPurchaseValue(purchase = {}, value){
      const amount = Math.abs(number(value));
      return round(isCardPurchaseCredit(purchase) ? -amount : amount);
    }

    function recurrenceCount(item, dateField, monthIndex = state.month, planningYear = state.year){
      return recurrenceDatesForMonth(item, dateField, monthIndex, planningYear).length;
    }

    function getEntriesForMonth(monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`entries:${planningYear}:${monthIndex}`, () => data.entries
        .map(e => {
          const dates = recurrenceDatesForMonth(e, "plannedDate", monthIndex, planningYear);
          if(!dates.length) return null;
          const targetKey = getMonthKey(monthIndex, planningYear);
          const actualKey = keyFromDate(e.receivedDate || e.plannedDate);
          const projectedOccurrence = e.status === "received" && (e.recurrence || "única") !== "única" && actualKey !== targetKey;
          return {
            ...e,
            plannedDate:dates[0],
            receivedDate:projectedOccurrence ? "" : e.receivedDate,
            status:projectedOccurrence ? "pending" : e.status,
            occurrenceDates:dates,
            displayValue:round(number(e.value) * dates.length),
            occurrences:dates.length,
            projectedOccurrence
          };
        })
        .filter(Boolean));
    }

    function uniqueRows(rows, keyFn){
      const seen = new Set();
      return rows.filter(row => {
        const key = keyFn(row);
        if(seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function getReceivedEntriesForMonth(monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`receivedEntries:${planningYear}:${monthIndex}`, () => {
      const targetKey = getMonthKey(monthIndex, planningYear);
      const rows = [];
      [Number(planningYear) - 1, Number(planningYear), Number(planningYear) + 1].forEach(scanYear => {
        MONTHS.forEach((_, plannedMonthIndex) => {
          getEntriesForMonth(plannedMonthIndex, scanYear).forEach(entry => {
            if(entry.status !== "received") return;
            const cashDate = entry.receivedDate || entry.plannedDate;
            if(keyFromDate(cashDate) !== targetKey) return;
            rows.push({
              ...entry,
              cashDate,
              displayValue: round(number(entry.displayValue ?? entry.value))
            });
          });
        });
      });
      return uniqueRows(rows, entry => `${entry.id}|${entry.cashDate || entry.plannedDate}|${entry.displayValue}`);
      });
    }

    function getManualExpenseInstallmentForMonth(expense, monthIndex = state.month, planningYear = state.year){
      if(!expense.dueDate) return null;
      const targetKey = getMonthKey(monthIndex, planningYear);
      const diff = monthDiff(expense.dueDate, targetKey);
      if(expense.fixedInstallment){
        if(diff < 0 || diff >= MAX_RECURRING_PROJECTION_MONTHS) return null;
        const dueDate = addMonths(expense.dueDate, diff);
        return {
          ...expense,
          dueDate,
          paymentDate:diff > 0 ? "" : expense.paymentDate,
          status:diff > 0 ? "pending" : expense.status,
          displayValue: round(number(expense.value)),
          occurrences:1,
          currentInstallment:Math.max(1, Number(expense.currentInstallment || 1) + diff),
          installmentLabel:"Parcela fixa",
          projectedInstallment:true,
          projectedOccurrence:diff > 0,
          virtual:false
        };
      }
      const total = Math.max(1, Number(expense.installments || 1));
      if(total <= 1) return null;
      const current = Math.min(total, Math.max(1, Number(expense.currentInstallment || 1)));
      const installmentNumber = current + diff;
      if(diff < 0 || installmentNumber < 1 || installmentNumber > total) return null;
      const dueDate = addMonths(expense.dueDate, diff);
      return {
        ...expense,
        dueDate,
        paymentDate:diff > 0 ? "" : expense.paymentDate,
        status:diff > 0 ? "pending" : expense.status,
        displayValue: round(number(expense.value)),
        occurrences:1,
        currentInstallment:installmentNumber,
        installments:total,
        installmentLabel:`${installmentNumber}/${total}`,
        projectedInstallment:true,
        projectedOccurrence:diff > 0,
        virtual:false
      };
    }

    function getManualExpensesForMonth(monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`manualExpenses:${planningYear}:${monthIndex}`, () => data.expenses
        .map(e => {
          const projectedInstallment = getManualExpenseInstallmentForMonth(e, monthIndex, planningYear);
          if(projectedInstallment) return projectedInstallment;
          const dates = recurrenceDatesForMonth(e, "dueDate", monthIndex, planningYear);
          if(!dates.length) return null;
          const targetKey = getMonthKey(monthIndex, planningYear);
          const actualKey = keyFromDate(e.paymentDate || e.dueDate);
          const projectedOccurrence = e.status === "paid" && (e.recurrence || "única") !== "única" && actualKey !== targetKey;
          return {
            ...e,
            dueDate:dates[0],
            paymentDate:projectedOccurrence ? "" : e.paymentDate,
            status:projectedOccurrence ? "pending" : e.status,
            occurrenceDates:dates,
            displayValue:round(number(e.value) * dates.length),
            occurrences:dates.length,
            projectedOccurrence,
            virtual:false
          };
        })
        .filter(Boolean));
    }

    function getLinkedExpenseRowsForCard(cardId, monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`linkedExpenseRows:${cardId}:${planningYear}:${monthIndex}`, () => {
      const key = getMonthKey(monthIndex, planningYear);
      return getManualExpensesForMonth(monthIndex, planningYear)
        .filter(expense => expense.cardId === cardId)
        .map(expense => {
          const total = Math.max(1, Number(expense.installments || 1));
          const number = Math.max(1, Number(expense.currentInstallment || 1));
          return {
            source:"expense",
            purchase:expense,
            inst:{
              key,
              installmentKey:`expense_${expense.id}_${key}`,
              number,
              total,
              label:expense.fixedInstallment ? "Parcela fixa" : (expense.installmentLabel || (total > 1 ? `${number}/${total}` : "Saída vinculada")),
              value:round(expense.displayValue ?? expense.value),
              dueDate:expense.dueDate,
              status:expense.status === "paid" ? "paid" : "open"
            }
          };
        });
      });
    }

    function getLinkedExpenseScheduledRowsForCard(cardId){
      return cachedFinance(`linkedExpenseScheduledRows:${cardId}`, () => {
      const rows = [];
      data.expenses
        .filter(expense => expense.cardId === cardId && expense.dueDate)
        .forEach(expense => {
          const total = Math.max(1, Number(expense.installments || 1));
          const current = Math.min(total, Math.max(1, Number(expense.currentInstallment || 1)));
          const maxRows = expense.fixedInstallment ? 1 : Math.max(1, total - current + 1);
          for(let i=0;i<maxRows;i++){
            const installmentNumber = current + i;
            const dueDate = addMonths(expense.dueDate, i);
            const key = keyFromDate(dueDate);
            rows.push({
              source:"expense",
              purchase:{
                ...expense,
                dueDate,
                displayValue:round(expense.value),
                currentInstallment:installmentNumber,
                installments:total,
                installmentLabel:expense.fixedInstallment ? "Parcela fixa" : (total > 1 ? `${installmentNumber}/${total}` : "Saida vinculada"),
                projectedInstallment:i > 0,
                virtual:false
              },
              inst:{
                key,
                installmentKey:`expense_${expense.id}_${key}_${installmentNumber}`,
                number:installmentNumber,
                total,
                label:expense.fixedInstallment ? "Parcela fixa" : (total > 1 ? `${installmentNumber}/${total}` : "Saida vinculada"),
                value:round(expense.value),
                dueDate,
                status:i === 0 && expense.status === "paid" ? "paid" : "open"
              }
            });
          }
        });
      return rows;
      });
    }

    function getLinkedExpenseStats(card, monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`linkedExpenseStats:${card.id}:${planningYear}:${monthIndex}`, () => {
      const currentKey = getMonthKey(monthIndex, planningYear);
      const rows = getLinkedExpenseScheduledRowsForCard(card.id);
      const currentRows = rows.filter(row => row.inst.key === currentKey);
      const invoice = currentRows.reduce((sum, row) => sum + number(row.inst.value), 0);
      const paidInMonth = currentRows.filter(row => row.inst.status === "paid").reduce((sum, row) => sum + number(row.inst.value), 0);
      const openRows = rows.filter(row => row.inst.status !== "paid");
      const used = openRows.reduce((sum, row) => sum + number(row.inst.value), 0);
      const future = openRows
        .filter(row => row.inst.key > currentKey)
        .reduce((sum, row) => sum + number(row.inst.value), 0);
      return {
        used:round(used),
        available:0,
        invoice:round(invoice),
        future:round(future),
        paidInMonth:round(paidInMonth),
        percent:0
      };
      });
    }

    function getPurchaseInstallments(purchase){
      const paidKey = (purchase.paidInstallments || []).join(",");
      const transactionType = normalizeCardPurchaseTransactionType(purchase.transactionType);
      return cachedFinance(`purchaseInstallments:${purchase.id}:${purchase.date}:${purchase.invoiceDueDate}:${purchase.totalValue}:${purchase.installmentValue}:${purchase.installments}:${purchase.currentInstallment}:${purchase.status}:${transactionType}:${paidKey}`, () => {
      if(purchase.importedInvoiceMonth){
        const n = Number(purchase.currentInstallment || 1);
        const key = purchase.importedInvoiceMonth;
        const installmentKey = `${purchase.id}_${key}_${n}`;
        const status = purchase.status === "paid" || (purchase.paidInstallments || []).includes(installmentKey) ? "paid" : "open";
        const displayValue = round(Math.abs(number(purchase.installmentValue || purchase.totalValue)));
        return [{
          key,
          installmentKey,
          number:n,
          total:Number(purchase.installments || 1),
          value: signedCardPurchaseValue(purchase, displayValue),
          displayValue,
          transactionType,
          transactionLabel:cardPurchaseTransactionLabel(purchase),
          dueDate: purchase.invoiceDueDate || `${key}-01`,
          status
        }];
      }

      const card = data.cards.find(item => item.id === purchase.cardId);
      const firstDueDate = purchase.invoiceDueDate || (card ? getCardInvoiceDueDate(card, purchase.date) : purchase.date);
      const installments = Math.max(1, Number(purchase.installments || 1));
      const current = Math.min(installments, Math.max(1, Number(purchase.currentInstallment || 1)));
      const base = round(Math.abs(number(purchase.installmentValue)) || (Math.abs(number(purchase.totalValue)) / installments));
      const result = [];
      for(let i=0;i<installments - current + 1;i++){
        const date = addMonths(firstDueDate, i);
        const key = keyFromDate(date);
        const installmentNumber = current + i;
        let value = base;
        if(installmentNumber === installments){
          value = round(Math.abs(number(purchase.totalValue)) - base * (installments - 1));
        }
        const installmentKey = `${purchase.id}_${key}_${installmentNumber}`;
        const status = purchase.status === "paid" || (purchase.paidInstallments || []).includes(installmentKey) ? "paid" : "open";
        const displayValue = round(Math.abs(value));
        result.push({
          key,
          installmentKey,
          number:installmentNumber,
          total:installments,
          value:signedCardPurchaseValue(purchase, displayValue),
          displayValue,
          transactionType,
          transactionLabel:cardPurchaseTransactionLabel(purchase),
          dueDate:date,
          status
        });
      }
      return result;
      });
    }

    function getCardPurchaseStats(card, monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`cardPurchaseStats:${card.id}:${planningYear}:${monthIndex}`, () => {
      const currentKey = getMonthKey(monthIndex, planningYear);
      let used = 0, invoice = 0, future = 0, paidInMonth = 0;
      data.cardPurchases.filter(p => p.cardId === card.id).forEach(p => {
        getPurchaseInstallments(p).forEach(inst => {
          const affectsOpenBalance = inst.status !== "paid" || number(inst.value) < 0;
          if(affectsOpenBalance) used += inst.value;
          if(inst.key === currentKey){
            invoice += inst.value;
            if(inst.status === "paid" && number(inst.value) > 0) paidInMonth += inst.value;
          }
          if(inst.key > currentKey && affectsOpenBalance) future += inst.value;
        });
      });
      const limit = Math.max(0, number(card.limit));
      return {
        used: round(used),
        available: round(limit - used),
        invoice: round(invoice),
        future: round(future),
        paidInMonth: round(paidInMonth),
        percent: limit ? Math.min(999, Math.max(0, round((used / limit) * 100))) : 0
      };
      });
    }

    function getInvoiceOpenAmountForLimit(invoiceValue, payment = {}){
      const value = Math.max(0, round(invoiceValue));
      if(payment.status === "paid") return 0;
      const paidAmount = Math.min(value, Math.max(0, round(payment.paidAmount)));
      return Math.max(0, round(payment.remainingAmount ?? (value - paidAmount)));
    }

    function getCardInvoiceCommitment(card, monthKey){
      const rows = getCardDrawerRowsForMonth(card.id, monthKey);
      const purchaseRows = rows.filter(row => row.source === "purchase");
      const linkedRows = rows.filter(row => row.source === "expense");
      const purchaseTotal = round(purchaseRows.reduce((sum,row) => sum + number(row.inst?.value), 0));
      const linkedTotal = round(linkedRows.reduce((sum,row) => sum + number(row.inst?.value), 0));
      const rawOpen = round(rows.reduce((sum,row) => {
        const value = number(row.inst?.value);
        return row.inst?.status !== "paid" || value < 0 ? sum + value : sum;
      }, 0));
      const payment = getInvoicePaymentRecord(card.id, monthKey);
      const override = getInvoiceOverride(card.id, monthKey);
      const computedInvoice = round(purchaseTotal + linkedTotal);
      const invoice = round(computedInvoice + (override.enabled ? override.amount : 0));
      const hasInvoicePayment = payment.status === "paid"
        || payment.status === "partial"
        || number(payment.paidAmount) > 0;
      const open = hasInvoicePayment
        ? getInvoiceOpenAmountForLimit(invoice, payment)
        : Math.max(0, round(rawOpen + (override.enabled ? override.amount : 0)));
      return {invoice:Math.max(0,round(invoice)),open:Math.max(0,round(open))};
    }

    function getCardCommitmentStats(card, monthIndex = state.month, planningYear = state.year){
      const selectedKey = getMonthKey(monthIndex, planningYear);
      const monthKeys = new Set([selectedKey]);
      data.cardPurchases
        .filter(purchase => purchase.cardId === card.id)
        .forEach(purchase => getPurchaseInstallments(purchase).forEach(inst => monthKeys.add(inst.key)));
      getLinkedExpenseScheduledRowsForCard(card.id).forEach(row => monthKeys.add(row.inst.key));
      Object.keys(data.invoicePayments || {}).forEach(payKey => {
        const parsed = parseInvoicePaymentKey(payKey);
        if(parsed.cardId === card.id && parsed.monthKey) monthKeys.add(parsed.monthKey);
      });

      let used = 0;
      let future = 0;
      let overdue = 0;
      let currentOpen = 0;
      let currentInvoice = 0;
      [...monthKeys].sort().forEach(monthKey => {
        const commitment = getCardInvoiceCommitment(card, monthKey);
        used += commitment.open;
        if(monthKey === selectedKey){
          currentOpen = commitment.open;
          currentInvoice = commitment.invoice;
        }else if(monthKey > selectedKey){
          future += commitment.open;
        }else{
          overdue += commitment.open;
        }
      });
      return {
        used:Math.max(0,round(used)),
        invoice:Math.max(0,round(currentInvoice)),
        currentOpen:Math.max(0,round(currentOpen)),
        future:Math.max(0,round(future)),
        overdue:Math.max(0,round(overdue))
      };
    }

    function getCardStats(card, monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`cardStats:${card.id}:${planningYear}:${monthIndex}`, () => {
      const purchaseStats = getCardPurchaseStats(card, monthIndex, planningYear);
      const linkedStats = getLinkedExpenseStats(card, monthIndex, planningYear);
      const commitments = getCardCommitmentStats(card, monthIndex, planningYear);
      const limit = Math.max(0, number(card.limit));
      const used = commitments.used;
      return {
        used,
        available:round(limit - used),
        invoice:commitments.invoice,
        currentOpen:commitments.currentOpen,
        future:commitments.future,
        overdue:commitments.overdue,
        overLimit:Math.max(0,round(used - limit)),
        paidInMonth:round(purchaseStats.paidInMonth + linkedStats.paidInMonth),
        percent: limit ? Math.min(999, Math.max(0, round((used / limit) * 100))) : 0
      };
      });
    }

    function invoicePaymentKey(cardId, monthKey){
      return `${monthKey}_${cardId}`;
    }
    function parseInvoicePaymentKey(payKey){
      const monthKey = String(payKey || "").slice(0,7);
      const cardId = String(payKey || "").slice(8);
      const [year, month] = monthKey.split("-").map(Number);
      return {monthKey, cardId, year, monthIndex:MONTH_NUMBERS.indexOf(month)};
    }
    function getInvoicePaymentRecord(cardId, monthKey){
      return data.invoicePayments[invoicePaymentKey(cardId, monthKey)] || {};
    }
    function getInvoiceOverride(cardId, monthKey){
      const payment = getInvoicePaymentRecord(cardId, monthKey);
      const enabled = payment.manualEntryEnabled === true || payment.overrideEnabled === true;
      const savedAmount = payment.manualEntryAmount ?? payment.overrideAmount;
      const amount = Math.max(0, round(savedAmount));
      return {
        enabled,
        amount,
        mode:"additive",
        includesLinked:false,
        notes:payment.manualEntryNotes || payment.overrideNotes || "",
        updatedAt:payment.manualEntryUpdatedAt || payment.overrideUpdatedAt || ""
      };
    }
    function getInvoicePaymentSummary(invoice){
      const payment = getInvoicePaymentRecord(invoice.cardId, invoice.monthKey);
      const invoiceValue = round(invoice.value);
      const paidAmount = payment.status === "paid"
        ? invoiceValue
        : Math.min(invoiceValue, Math.max(0, round(payment.paidAmount)));
      const remainingAmount = payment.status === "paid"
        ? 0
        : Math.max(0, round(payment.remainingAmount ?? (invoiceValue - paidAmount)));
      const installments = remainingAmount > 0 ? Math.max(1, Number(payment.renegotiationInstallments || 1)) : 0;
      const installmentValue = installments ? round(remainingAmount / installments) : 0;
      return {...payment, paidAmount, remainingAmount, renegotiationInstallments:installments, renegotiationInstallmentValue:installmentValue};
    }

    function getVirtualInvoicesForMonth(monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`virtualInvoices:${planningYear}:${monthIndex}`, () => {
      const key = getMonthKey(monthIndex, planningYear);
      return data.cards.map(card => {
        const stats = getCardPurchaseStats(card, monthIndex, planningYear);
        const linkedStats = getLinkedExpenseStats(card, monthIndex, planningYear);
        const override = getInvoiceOverride(card.id, key);
        const computedValue = round(stats.invoice + linkedStats.invoice);
        if(computedValue <= 0 && !override.enabled) return null;
        const invoiceValue = round(computedValue + (override.enabled ? override.amount : 0));
        const payKey = invoicePaymentKey(card.id, key);
        const payment = data.invoicePayments[payKey] || {};
        const status = payment.status || "pending";
        const paidAmount = status === "paid" ? invoiceValue : Math.min(invoiceValue, Math.max(0, round(payment.paidAmount)));
        const remainingAmount = status === "paid" ? 0 : Math.max(0, round(payment.remainingAmount ?? (invoiceValue - paidAmount)));
        return {
          id:`invoice_${card.id}_${key}`,
          virtual:true,
          source:"cardInvoice",
          monthKey:key,
          payKey,
          cardId:card.id,
          description:`Fatura ${card.name}`,
          category:"Cartão de Crédito",
          value:invoiceValue,
          computedValue,
          overrideEnabled:override.enabled,
          overrideAmount:override.enabled ? override.amount : "",
          overrideMode:override.mode,
          overrideIncludesLinked:override.includesLinked,
          overrideNotes:override.notes,
          displayValue:status === "partial" ? paidAmount : invoiceValue,
          paidAmount,
          remainingAmount,
          renegotiationInstallments:Number(payment.renegotiationInstallments || 0),
          renegotiationFirstDueDate:payment.renegotiationFirstDueDate || "",
          dueDate:dateFromDay(card.dueDay || 1, monthIndex, planningYear),
          paymentDate:payment.paymentDate || "",
          status,
          paymentMethod:"cartão de crédito",
          installments:1,
          currentInstallment:1,
          recurrence:"única",
          notes:"Fatura gerada automaticamente pelos lançamentos do cartão."
        };
      }).filter(Boolean);
      });
    }

    function getInvoiceRenegotiationsForMonth(monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`invoiceRenegotiations:${planningYear}:${monthIndex}`, () => {
      const targetKey = getMonthKey(monthIndex, planningYear);
      return Object.entries(data.invoicePayments || {}).flatMap(([payKey, payment]) => {
        if(payment.status !== "partial" || number(payment.remainingAmount) <= 0) return [];
        const {monthKey, cardId} = parseInvoicePaymentKey(payKey);
        const card = data.cards.find(item => item.id === cardId);
        const installments = Math.max(1, Number(payment.renegotiationInstallments || 1));
        const firstDueDate = payment.renegotiationFirstDueDate || addMonths(`${monthKey}-01`, 1);
        const base = round(number(payment.remainingAmount) / installments);
        const payments = payment.renegotiationPayments || {};
        const rows = [];
        for(let i=0;i<installments;i++){
          const dueDate = addMonths(firstDueDate, i);
          if(keyFromDate(dueDate) !== targetKey) continue;
          const installmentNumber = i + 1;
          const installmentKey = `reneg_${installmentNumber}`;
          const paidInfo = payments[installmentKey] || {};
          let value = base;
          if(installmentNumber === installments){
            value = round(number(payment.remainingAmount) - base * (installments - 1));
          }
          rows.push({
            id:`reneg__${payKey}__${installmentNumber}`,
            virtual:true,
            source:"invoiceRenegotiation",
            payKey,
            cardId,
            description:`Renegociação Fatura ${card?.name || "cartão"}`,
            category:"Renegociação",
            value,
            displayValue:value,
            dueDate,
            paymentDate:paidInfo.paymentDate || "",
            status:paidInfo.status === "paid" ? "paid" : "pending",
            paymentMethod:"cartão de crédito",
            installments,
            currentInstallment:installmentNumber,
            installmentLabel:`${installmentNumber}/${installments}`,
            recurrence:"única",
            notes:payment.renegotiationNotes || `Saldo renegociado da fatura ${monthKey}.`
          });
        }
        return rows;
      });
      });
    }

    function getExpensesForMonth(monthIndex = state.month, includeVirtual = true, planningYear = state.year){
      return cachedFinance(`expenses:${planningYear}:${monthIndex}:${includeVirtual ? "withVirtual" : "manualOnly"}`, () => {
      const manual = getManualExpensesForMonth(monthIndex, planningYear);
      return includeVirtual ? manual.concat(getVirtualInvoicesForMonth(monthIndex, planningYear), getInvoiceRenegotiationsForMonth(monthIndex, planningYear)) : manual;
      });
    }

    function getCardPurchaseDetailRowsForMonth(monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`cardPurchaseDetailRows:${planningYear}:${monthIndex}`, () => {

              status:inst.status === "paid" ? "paid" : "pending",

    function getExpenseDetailRowsForMonth(monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`expenseDetailRows:${planningYear}:${monthIndex}`, () => {
      const manualRows = getManualExpensesForMonth(monthIndex, planningYear);
      const purchaseRows = getCardPurchaseDetailRowsForMonth(monthIndex, planningYear);
      const overrideInvoices = getVirtualInvoicesForMonth(monthIndex, planningYear)
        .filter(invoice => invoice.overrideEnabled)
        .map(invoice => ({
          ...invoice,
          description:`Fatura cadastrada ${data.cards.find(card => card.id === invoice.cardId)?.name || ""}`.trim(),
          category:invoice.category || "Cartao de Credito",
          subcategory:"",
          displayValue:round(invoice.overrideAmount),
          value:round(invoice.overrideAmount),
          status:invoice.status || "pending"
        }));
      return manualRows.concat(purchaseRows, overrideInvoices);
      });
    }

    function getPaidExpensesForMonth(monthIndex = state.month, planningYear = state.year){
      return cachedFinance(`paidExpenses:${planningYear}:${monthIndex}`, () => {
      const targetKey = getMonthKey(monthIndex, planningYear);
      const rows = [];
      [Number(planningYear) - 1, Number(planningYear), Number(planningYear) + 1].forEach(scanYear => {
        MONTHS.forEach((_, dueMonthIndex) => {
          getExpensesForMonth(dueMonthIndex, true, scanYear).forEach(expense => {
            if(expense.source === "cardInvoice" && expense.status === "partial" && number(expense.paidAmount) > 0){
              const cashDate = expense.paymentDate || expense.dueDate;
              if(keyFromDate(cashDate) !== targetKey) return;
              rows.push({
                ...expense,
                id:`paid_${expense.id}`,
                description:`Pagamento parcial ${expense.description}`,
                status:"paid",
                cashDate,
                displayValue: round(number(expense.paidAmount)),
                value: round(number(expense.paidAmount)),
                partialPayment:true
              });
              return;
            }
            if(expense.status !== "paid") return;
            const cashDate = expense.paymentDate || expense.dueDate;
            if(keyFromDate(cashDate) !== targetKey) return;
            rows.push({
              ...expense,
              cashDate,
              displayValue: round(number(expense.displayValue ?? expense.value))
            });
          });
        });
      });
      return uniqueRows(rows, expense => `${expense.id}|${expense.cashDate || expense.dueDate}|${expense.displayValue}`);
      });
    }

    function calcTotals(monthIndex = state.month, memo = financeCalcMemo, planningYear = state.year){
      memo = memo || financeCalcMemo;
      const memoKey = totalsMemoKey(monthIndex, planningYear);
      if(memo[memoKey]) return memo[memoKey];
      const startYear = Number(data.settings.initialBalanceYear || data.settings.year || state.year);
      const isBaseMonth = Number(planningYear) <= startYear && monthIndex === 0;
      const previousPosition = previousMonthPosition(monthIndex, planningYear);
      const previousTotals = isBaseMonth ? null : calcTotals(previousPosition.monthIndex, memo, previousPosition.year);
      const previous = isBaseMonth ? number(data.settings.initialBalance) : previousTotals.saldoFinal;
      const previousPrevisto = isBaseMonth ? number(data.settings.initialBalance) : previousTotals.saldoPrevisto;
      const entries = getEntriesForMonth(monthIndex, planningYear);
      const expenses = getExpensesForMonth(monthIndex, true, planningYear);
      const receivedEntries = getReceivedEntriesForMonth(monthIndex, planningYear);
      const paidExpenses = getPaidExpensesForMonth(monthIndex, planningYear);
      const entradasPrevistas = round(entries.reduce((s,e)=> s + number(e.displayValue ?? e.value), 0));
      const entradasRecebidas = round(receivedEntries.reduce((s,e)=> s + number(e.displayValue ?? e.value), 0));
      const entradasRecebidasNoPlanejado = round(entries.filter(e=>e.status === "received").reduce((s,e)=> s + number(e.displayValue ?? e.value), 0));
      const entradasPendentes = round(Math.max(0, entradasPrevistas - entradasRecebidasNoPlanejado));
      const saidasPrevistas = round(expenses.reduce((s,e)=> s + number(e.displayValue ?? e.value), 0));
      const saidasPagas = round(paidExpenses.reduce((s,e)=> s + number(e.displayValue ?? e.value), 0));
      const saidasPagasNoVencimento = round(expenses.reduce((s,e)=> {
        if(e.status === "paid") return s + number(e.displayValue ?? e.value);
        if(e.source === "cardInvoice" && e.status === "partial") return s + number(e.paidAmount);
        return s;
      }, 0));
      const saidasPendentes = round(Math.max(0, saidasPrevistas - saidasPagasNoVencimento));
      const faturas = round(getVirtualInvoicesForMonth(monthIndex, planningYear).reduce((s,e)=>s+number(e.value),0));
      const resultadoMes = round(entradasRecebidas - saidasPagas);
      const saldoPrevisto = round(previousPrevisto + entradasPrevistas - saidasPrevistas);
      const saldoRealizado = round(previous + resultadoMes);
      const saldoFinal = saldoRealizado;
      memo[memoKey] = {
        monthIndex,
        year:Number(planningYear),
        monthKey:getMonthKey(monthIndex, planningYear),
        previous, previousPrevisto, entradasPrevistas, entradasRecebidas, entradasPendentes,
        saidasPrevistas, saidasPagas, saidasPendentes, faturas,
        resultadoMes, saldoPrevisto, saldoRealizado, saldoFinal
      };
      return memo[memoKey];
    }

    function updateFinanceOsShell(summary, hasData){
      const sideBalance = document.getElementById("financeSideBalance");
      const sideNote = document.getElementById("financeSideNote");
      const health = document.getElementById("financeHealthText");
      if(sideBalance) sideBalance.textContent = toBRL(summary.projectedFreeMinor / 100);
      if(sideNote) sideNote.textContent = hasData
        ? `Recebidos ${toBRL((summary.receivedMinor + summary.refundsMinor) / 100)}; compromissos ${toBRL(summary.committedMinor / 100)}.`
        : "Adicione entradas, gastos ou cartões para iniciar a leitura.";
      if(health){
        if(!hasData){
          health.textContent = "Saúde do mês: aguardando dados";
          health.removeAttribute("data-status");
          return;
        }
        const incomeBaseMinor = summary.receivedMinor + summary.refundsMinor + summary.expectedIncomeMinor;
        const commitment = incomeBaseMinor ? Math.round((summary.committedMinor / incomeBaseMinor) * 100) : (summary.committedMinor ? 100 : 0);
        const status = summary.projectedFreeMinor < 0 || commitment >= 95
          ? "critico"
          : commitment >= 75
            ? "atencao"
            : "positivo";
        const label = status === "critico" ? "crítica" : status === "atencao" ? "atenção" : "positiva";
        health.textContent = `Saúde do mês: ${label} (${commitment}% comprometido)`;
        health.dataset.status = status;
      }
    }

    function animateKpis(){
      document.querySelectorAll("[data-currency]").forEach(el => {
        const target = Number(el.dataset.currency || 0);
        if(window.matchMedia?.("(prefers-reduced-motion: reduce)").matches){
          el.textContent = toBRL(target);
          return;
        }
        const start = 0;
        const duration = 420;
        const t0 = performance.now();
        function tick(now){
          const p = Math.min(1, (now - t0) / duration);
          const eased = 1 - Math.pow(1-p, 3);
          el.textContent = toBRL(start + (target - start) * eased);
          if(p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });
    }

    function financeOsMonthName(monthIndex = state.month){
      return ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][monthIndex] || MONTHS[monthIndex] || "";
    }

    function financeOsStatus(t){
      const commitment = t.entradasPrevistas ? Math.round((t.saidasPrevistas / t.entradasPrevistas) * 100) : 0;
      const paidRatio = t.saidasPrevistas ? Math.round((t.saidasPagas / t.saidasPrevistas) * 100) : 0;
      const score = Math.max(28, Math.min(98, Math.round(100 - commitment * .55 + (t.saldoPrevisto > 0 ? 12 : -16) + (paidRatio > 70 ? 4 : 0))));
      const label = score < 60 ? "Critico" : score < 75 ? "Atencao" : score > 88 ? "Excelente" : "Positivo";
      return { commitment, score, label };
    }

    function financeOsRecentItems(limit = 8, useFilters = false){
      const entries = getEntriesForMonth().filter(item => item.status !== "received").concat(getReceivedEntriesForMonth()).map(item => ({
        id:item.id, kind:"entry", filterKind:"entry", cardId:"", date:item.cashDate || item.receivedDate || item.plannedDate,
        description:item.description, category:item.category, type:"Entrada",
        account:"Conta corrente", value:number(item.displayValue ?? item.value),
        status:item.status === "received" ? "Recebido" : "Pendente",
        statusKey:item.status === "received" ? "received" : "pending"
      }));
      const expenses = getExpensesForMonth().filter(item => item.status !== "paid").concat(getPaidExpensesForMonth()).map(item => ({
        id:item.id, openId:item.cardId || item.id, kind:item.source === "cardInvoice" || item.cardId ? "card" : "expense", filterKind:"expense", cardId:item.cardId || "", date:item.cashDate || item.paymentDate || item.dueDate,
        description:item.description, category:item.category, type:item.source === "cardInvoice" || item.cardId ? "Cartão" : "Saída",
        account:item.paymentMethod || "Conta corrente", value:-number(item.displayValue ?? item.value),
        status:item.status === "paid" ? "Pago" : item.status === "partial" ? "Parcial" : "Pendente",
        statusKey:item.status === "paid" ? "paid" : item.status === "partial" ? "partial" : "pending",
        paymentMethod:item.paymentMethod || ""
      }));
      const purchases = data.cardPurchases
        .filter(item => keyFromDate(item.date) === getMonthKey())
        .map(item => {
          const card = data.cards.find(candidate => candidate.id === item.cardId);
          const installments = Math.max(1, Number(item.installments || 1));
          const isRefund = normalizeCardPurchaseTransactionType(item.transactionType) === "credit";
          return {
            id:item.id,
            openId:item.cardId,
            kind:"card",
            filterKind:"expense",
            cardId:item.cardId || "",
            date:item.date,
            description:item.description,
            category:item.category,
            type:installments > 1 ? `Cartão · ${installments}x de ${toBRL(item.installmentValue)}` : (isRefund ? "Estorno no cartão" : "Cartão"),
            account:card?.name || "Cartão",
            value:(isRefund ? 1 : -1) * number(item.totalValue),
            status:item.status === "paid" ? "Pago" : "Na fatura",
            statusKey:item.status === "paid" ? "paid" : "pending",
            paymentMethod:"cartão de crédito"
          };
        });
      let items = entries.concat(expenses, purchases);
      if(useFilters){
        const search = state.filters.search.trim().toLowerCase();
        items = items.filter(item => {
          const okSearch = !search || [item.description, item.category, item.account, item.type]
            .some(value => String(value || "").toLowerCase().includes(search));
          const okCategory = state.filters.category === "all" || item.category === state.filters.category;
          const okKind = state.filters.kind === "all" || item.filterKind === state.filters.kind;
          const okStatus = state.filters.status === "all" || item.statusKey === state.filters.status;
          const okDate = !state.filters.date || item.date === state.filters.date;
          const okMethod = state.filters.method === "all" || item.paymentMethod === state.filters.method;
          const okCard = state.filters.card === "all"
            || (state.filters.card === "none" ? !item.cardId : item.cardId === state.filters.card);
          return okSearch && okCategory && okKind && okStatus && okDate && okMethod && okCard;
        });
      }
      items.sort((a,b) => {
        if(state.filters.sort === "value") return Math.abs(b.value) - Math.abs(a.value);
        if(state.filters.sort === "category") return String(a.category || "").localeCompare(String(b.category || ""), "pt-BR");
        return String(b.date || "").localeCompare(String(a.date || ""));
      });
      return items.slice(0, limit);
    }

    function renderFinanceOsMonthStrip(){
      return forwardMonthWindow(12).map(({monthIndex, year, label}) => {
        const totals = calcTotals(monthIndex, financeCalcMemo, year);
        const credito = totals.entradasPrevistas;
        const debito = totals.saidasPrevistas;
        const resultadoProjetado = round(credito - debito);
        const active = monthIndex === state.month && Number(year) === Number(state.year);
        return `
          <button class="finance-os-month-card ${active ? "active" : ""}" data-action="select-month" data-month="${monthIndex}" data-year="${year}">
            <small>${label}</small>
            <span class="finance-os-month-label">Saldo projetado</span>
            <strong class="${totals.saldoPrevisto >= 0 ? "positive" : "negative"}">${toBRL(totals.saldoPrevisto)}</strong>
            <span class="finance-os-month-flow credit"><b>Crédito</b>${toBRL(credito)}</span>
            <span class="finance-os-month-flow debit"><b>Débito</b>${toBRL(debito)}</span>
            <span class="finance-os-month-flow result"><b>Resultado</b>${toBRL(resultadoProjetado)}</span>
          </button>

      }).join("");
    }

    function renderFinanceOsTimeline(){
      const rows = financeOsRecentItems(7);
      if(!rows.length) return `<div class="empty">Sem eventos financeiros para o mes selecionado.</div>`;
      return rows.map(item => {
        const day = item.date ? String(item.date).slice(8,10) : "--";
        const tagClass = item.status === "Pago" || item.status === "Recebido" ? "received" : "pending";
        return `
          <article class="finance-os-timeline-item">
            <div class="finance-os-timeline-day">${day}/${String(state.month + 1).padStart(2,"0")}</div>
            <strong>${escapeHtml(item.description)}</strong>
            <span>${escapeHtml(item.type)} | ${escapeHtml(item.category || "Sem categoria")}</span>

    function renderFinanceOsInsights(t, status){
      const openBalance = round(t.entradasPendentes - t.saidasPendentes);
      const insights = [
        ["Comprometimento", `${status.commitment}% da renda prevista esta comprometida no mes.`],
        ["Pendencias", `${toBRL(t.entradasPendentes)} a receber contra ${toBRL(t.saidasPendentes)} a pagar.`],
        ["Projecao", openBalance >= 0 ? `Pendencias ainda deixam folga de ${toBRL(openBalance)}.` : `Pendencias pressionam o caixa em ${toBRL(Math.abs(openBalance))}.`]
      ];
      return insights.map(item => `
        <div class="finance-os-insight">
          <div class="finance-os-insight-icon"></div>
          <div><strong>${item[0]}</strong><span>${item[1]}</span></div>

      `).join("");

    function renderFinanceOsCompareBars(t){
      const max = Math.max(t.entradasPrevistas, t.saidasPrevistas, Math.abs(t.saldoPrevisto), 1);
      const rows = [
        ["Entradas", t.entradasPrevistas, t.entradasRecebidas, "positive"],
        ["Gastos", t.saidasPrevistas, t.saidasPagas, "negative"],
        ["Saldo", t.saldoPrevisto, t.saldoRealizado, t.saldoRealizado >= 0 ? "positive" : "negative"]
      ];
      return rows.map(([label, planned, realized, tone]) => `
        <div class="finance-os-compare-row">
          <header><span>${label}</span><strong>${toBRL(planned)} -> <span class="${tone}">${toBRL(realized)}</span></strong></header>
          <div class="finance-os-dual">
            <div class="finance-os-track"><span class="planned" style="width:${Math.min(100, Math.abs(planned) / max * 100)}%"></span></div>
            <div class="finance-os-track"><span class="${label === "Gastos" ? "expense" : "realized"}" style="width:${Math.min(100, Math.abs(realized) / max * 100)}%"></span></div>
          </div>
        </div>
      `).join("");
    }

    function getDashboardCardSummary(monthIndex = state.month, planningYear = state.year){
      const rows = data.cards.map(card => ({card, stats:getCardStats(card, monthIndex, planningYear)}));
      const limit = round(rows.reduce((sum, row) => sum + number(row.card.limit), 0));
      const used = round(rows.reduce((sum, row) => sum + number(row.stats.used), 0));
      const available = round(rows.reduce((sum, row) => sum + number(row.stats.available), 0));
      const invoice = round(rows.reduce((sum, row) => sum + number(row.stats.invoice), 0));
      const future = round(rows.reduce((sum, row) => sum + number(row.stats.future), 0));
      const paidInMonth = round(rows.reduce((sum, row) => sum + number(row.stats.paidInMonth), 0));
      const percent = limit ? Math.min(999, Math.max(0, round((used / limit) * 100))) : 0;
      const riskCards = rows.filter(row => number(row.stats.percent) >= 80).length;
      return {rows, limit, used, available, invoice, future, paidInMonth, percent, riskCards};
    }

            <div class="finance-dashboard-hero-top">
              <div>

              <div class="finance-os-head">

                <h2>Cartões de crédito</h2>
                <p>Cartões cadastrados em Movimentações. Clique em um cartão para expandir limite, fatura, futuras e previsão por mês.</p>

          </section>
